# ─────────────────────────────────────────────────────────────────────────────
# Deploy to Production — بازسازی‌شده از صفر (۲۰۲۶-۰۸-۲۸)
#
# تفاوت با نسخهٔ قبلی (که «سبز ولی بی‌اثر» بود):
#   ۱) گیت CI (run-ci-gate + php -l) قبل از FTP.
#   ۲) مارکر __deploy__.json با هر ران ساخته و آپلود می‌شود.
#   ۳) گیت راستی‌آزمایی پس از FTP (_tools/ci/verify-deploy.sh):
#      سمت FTP و سمت HTTP با کامیت دیپلوی‌شده مقایسه می‌شوند؛ مغایرت = قرمز.
#      بدون این، تگ/Release «نسخه پایدار» برای دیپلویی ساخته می‌شد که هرگز زنده نشده بود.
#   ۴) state-name جدید (v2) → اولین اجرا آپلود کاملِ تازه می‌زند.
#   ۵) تگ و Release فقط بعد از سبزشدنِ راستی‌آزمایی ساخته می‌شوند.
#
# رول‌بک: ref را روی یک تگ قبلی بگذارید (مثلاً v2026.08.28-0905).
#   توجه: تگ‌های ساخته‌شده با ورک‌فلوی قدیمی (پیش از این بازنویسی) به دیپلویی
#   اشاره می‌کنند که هرگز زنده نشد؛ رول‌بک معتبر از اولین تگِ این نسخه به بعد است.
#
# ⛔ هیچ‌وقت dangerously-clean-slate فعال نشود:
#      llm-config.php / sms-config.php / storage-config.php فقط روی سرور‌اند.
#
# سکرت‌ها: FTP_PROD_SERVER / FTP_PROD_USERNAME / FTP_PROD_PASSWORD / FTP_PROD_SERVER_DIR
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'برای تایید، عبارت DEPLOY را دقیقا تایپ کنید'
        required: true
        default: ''
      ref:
        description: 'چه چیزی منتشر شود؟ main برای انتشار عادی، یا نام یک تگ برای رول‌بک'
        required: true
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write   # لازم برای ساخت تگ و Release (فقط بعد از راستی‌آزمایی سبز)

env:
  LIVE_URL: https://pishtaj.ir

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          [ "${{ github.event.inputs.confirm }}" = "DEPLOY" ] || { echo "::error::باید عبارت DEPLOY وارد شود"; exit 1; }
          echo "confirmation OK"

      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      # فقط main یا تگ نسخه — جلوگیری از انتشار کار نیمه‌تمام
      - name: Validate ref is main or a version tag
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [ "$REF" = "main" ]; then
            echo "deploying from main"
          elif git tag --list | grep -Fxq "$REF"; then
            echo "rollback to tag: $REF"
          else
            echo "::error::فقط main یا یک تگ معتبر مجاز است: $REF"; exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── گیت ۱: تسترهای CI پروژه
      - name: CI gate (run-ci-gate)
        run: node _tools/uat/run-ci-gate.js

      # ── گیت ۲: php -l قطعی روی api/*.php
      - name: PHP syntax lint
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq php-cli >/dev/null 2>&1 || true
          command -v php >/dev/null 2>&1 || { echo "::error::php-cli نصب نشد"; exit 1; }
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null 2>&1 || { echo "::error file=$f::php -l شکست خورد"; fail=1; }
          done < <(find api -name '*.php' -print0)
          [ "$fail" -eq 0 ] || exit 1
          echo "php -l: سالم"

      # ── گیت‌های محتوای پروداکشن
      - name: Sanity check robots.txt
        run: |
          ! grep -qi '^\s*Disallow:\s*/\s*$' robots.txt || { echo "::error::robots.txt حالت noindex دارد؛ نسخهٔ استیجینگ وارد شده است."; exit 1; }
          echo "robots.txt OK"

      - name: Ensure no staging banner
        run: |
          ! grep -rql 'ptf-staging-banner' --include='*.html' . || { echo "::error::بنر استیجینگ پیدا شد؛ استقرار متوقف شد."; exit 1; }
          echo "no staging banner"

      - name: Write deploy marker
        run: |
          SHA="$(git rev-parse HEAD)"
          cat > __deploy__.json <<EOF
          {"env":"production","ref":"${{ github.event.inputs.ref }}","sha":"${SHA}","run":${GITHUB_RUN_ID:-0},"utc":"$(date -u +%FT%TZ)"}
          EOF
          cat __deploy__.json
          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"

      # ── انتقال FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_PROD_SERVER }}
          username: ${{ secrets.FTP_PROD_USERNAME }}
          password: ${{ secrets.FTP_PROD_PASSWORD }}
          server-dir: ${{ secrets.FTP_PROD_SERVER_DIR }}
          state-name: .ftp-state-production-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.ftp-state*
            **/node_modules/**
            *.md
            *.zip
            _audit/**
            _human_test/**
            _personas/**
            _tools/**
            ptf-all-photos/**
            service-photos/**
            ptf-snapshots/**
            docs-deploy/**
            tester*.js
            FILES-CHANGED-*.txt

      # ── گیت ۳: راستی‌آزمایی پس از استقرار (سمت FTP + سمت HTTP)
      - name: Verify deployment (FTP-side + live HTTP)
        run: |
          bash _tools/ci/verify-deploy.sh \
            --url "$LIVE_URL" \
            --sha "$DEPLOY_SHA" \
            --ftp-server "${{ secrets.FTP_PROD_SERVER }}" \
            --ftp-user   "${{ secrets.FTP_PROD_USERNAME }}" \
            --ftp-pass   "${{ secrets.FTP_PROD_PASSWORD }}" \
            --ftp-dir    "${{ secrets.FTP_PROD_SERVER_DIR }}"

      # ── بعد از راستی‌آزمایی سبز: تگ نسخه + بک‌آپ (فقط انتشار از main)
      - name: Create version tag
        if: ${{ github.event.inputs.ref == 'main' }}
        id: tag
        run: |
          TAG="v$(date -u +'%Y.%m.%d-%H%M')"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production deploy $TAG (verified live)"
          git push origin "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build backup archive
        if: ${{ github.event.inputs.ref == 'main' }}
        run: |
          zip -r "site-backup.zip" . \
            -x '.git/*' 'node_modules/*' '_audit/*' '_human_test/*' \
               '_personas/*' '_tools/*' 'ptf-all-photos/*' \
               'service-photos/*' 'ptf-snapshots/*' '*.zip' > /dev/null
          ls -lh site-backup.zip

      - name: Publish Release (backup)
        if: ${{ github.event.inputs.ref == 'main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: نسخه پایدار ${{ steps.tag.outputs.tag }}
          body: |
            انتشار **راستی‌آزمایی‌شده** روی https://pishtaj.ir
            (مارکر و sw.js زنده با کامیت مقایسه و تأیید شده)

            **کامیت:** `${{ github.sha }}`

            برای بازگشت به این نسخه:
            تب Actions ← Deploy to Production ← Run workflow
            و در فیلد `ref` مقدار `${{ steps.tag.outputs.tag }}` را وارد کنید.

            فایل `site-backup.zip` نسخه کامل سایت در این لحظه است.
          files: site-backup.zip

      - name: Summary
        run: |
          echo "### 🚀 استقرار پروداکشن — اثبات‌شده" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| مورد | مقدار |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|">> $GITHUB_STEP_SUMMARY
          echo "| منبع | \`${{ github.event.inputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| کامیت | \`$DEPLOY_SHA\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.ref }}" = "main" ]; then
            echo "| تگ نسخه | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| نوع | رول‌بک |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| آدرس | $LIVE_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| راستی‌آزمایی | مارکر + sw.js هم سمت FTP و هم سمت HTTP ✅ |" >> $GITHUB_STEP_SUMMARY
