<section class="job-hero"><div class="container"><h1>Careers</h1><p>Open positions. Apply on the bilingual job page (English section via #en). The application form is in Persian.</p></div></section>
<main class="job-wrap">
<!--PTF_CAREERS_LIST-->
<div id="careersEnList"><p>There are currently no open positions.</p></div>
<!--/PTF_CAREERS_LIST-->
</main>
<script>
(function(){
  var el = document.getElementById('careersEnList');
  if (!el) return;
  function paint(d){
    var jobs = (d && d.jobs) || [];
    if (!jobs.length) { el.innerHTML = '<p>There are currently no open positions.</p>'; return; }
    el.className = 'job-grid';
    el.innerHTML = jobs.map(function(j){
      var title = j.titleEn || j.titleFa || '';
      return '<a class="job-card" href="../careers/' + String(j.slug||'').replace(/[^a-z0-9\-]/g,'') + '/#en"><h3>' + String(title).replace(/</g,'') + '</h3></a>';
    }).join('');
  }
  fetch('../api/careers.php?action=published', { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : Promise.reject(); }).then(paint).catch(function(){
    fetch('../careers/status.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(paint).catch(function(){});
  });
})();
</script>
<script src="../assets/js/ptf-metrics.js" defer></script>
<script src="../assets/js/ptf-discover.js" defer></script>
</body>
</html>
