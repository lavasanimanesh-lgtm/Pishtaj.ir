<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Vazirmatn;src:url('file:///home/user/pishtaj/assets/fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400}
@font-face{font-family:Vazirmatn;src:url('file:///home/user/pishtaj/assets/fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700}
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#3a3d42;width:210mm;height:297mm;position:relative;background:#fff}

/* ===== نوار بالای صفحه (بازسازی پیکسلی) ===== */
.bar-top{position:absolute;top:0;left:0;right:0;height:6.2mm}
.bar-top .grad{position:absolute;top:0;left:0;right:0;height:100%;
  background:linear-gradient(90deg,#e87200 0%,#ee8100 35%,#ecb003 70%,#ecc506 100%)}
.bar-top .s1,.bar-top .s2,.bar-top .s3{position:absolute;top:-1mm;height:9mm;width:1.4mm;background:#fff;transform:skewX(-35deg)}
.bar-top .s1{left:34.2%}.bar-top .s2{left:35.8%}.bar-top .s3{left:37.4%}

/* ===== هدر: لوگو راست / فیلدها چپ ===== */
.hd{position:absolute;top:12mm;right:14mm;left:14mm}
.hd table.lay{width:100%;border-collapse:collapse}
.hd td.c-logo{width:62mm;text-align:right;vertical-align:middle}
.hd td.c-fields{text-align:left;vertical-align:middle}
.logo img{height:23mm;display:inline-block}
.fields{font-size:10.5pt;color:#6b7075;line-height:2.6;display:inline-block}
.fields .row{display:flex;align-items:baseline;gap:1.5mm}
.fields .lb{white-space:nowrap;color:#6b7075}
.fields .dots{color:#c3c7cd;font-size:9pt}
.fields .val{font-weight:700;color:#2f3237;min-width:34mm}

/* ===== فوتر (بازسازی پیکسلی با اطلاعات جدید) ===== */
.ft{position:absolute;bottom:9.5mm;left:0;right:0;text-align:center;font-size:9.2pt;color:#4b5057;line-height:2}
.ft .line{display:flex;justify-content:center;align-items:center;gap:2.2mm;direction:rtl}
.ft .line.en{direction:ltr;gap:9mm}
.ft .seg{display:flex;align-items:center;gap:2mm}
.ic{width:4.1mm;height:4.1mm}
.ltr{direction:ltr;unicode-bidi:embed}

/* ===== نوار پایین (آینه نوار بالا) ===== */
.bar-bot{position:absolute;bottom:0;left:0;right:0;height:6.2mm}
.bar-bot .grad{position:absolute;top:0;left:0;right:0;height:100%;
  background:linear-gradient(90deg,#ecc506 0%,#ecb003 30%,#ee8100 65%,#e87200 100%)}
.bar-bot .s1,.bar-bot .s2,.bar-bot .s3{position:absolute;top:-1mm;height:9mm;width:1.4mm;background:#fff;transform:skewX(-35deg)}
.bar-bot .s1{right:34.2%}.bar-bot .s2{right:35.8%}.bar-bot .s3{right:37.4%}
</style></head><body>

<div class="bar-top"><div class="grad"></div><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>

<div class="hd"><table class="lay"><tr>
  <td class="c-logo"><span class="logo"><img src="../assets/images/ptf-logo-full.png" alt="لوگو پیشرو تجهیز فرتاک"></span></td>
  <td class="c-fields"><div class="fields">
    <div class="row"><span class="lb">تاریـخ :</span><span class="dots">................................</span></div>
    <div class="row"><span class="lb">شمـاره :</span><span class="dots">................................</span></div>
    <div class="row"><span class="lb">پیوست :</span><span class="dots">................................</span></div>
  </div></td>
</tr></table></div>

<div class="ft">
  <div class="line">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#4b5057" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0114 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span>تهـــران، بلـوار کوهــک، مجتمــع تجــاری اداری طوبـــی، بلــوک A اداری، طبقــه ۱۶، واحــد ۱</span>
  </div>
  <div class="line">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#4b5057" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 2 .7 2.9a2 2 0 01-.5 2.1L8 10a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.5c.9.3 1.9.6 2.9.7a2 2 0 011.7 2z"/></svg>
    <span class="ltr">(+۹۸)۲۱ ۴۶۰۸۷۶۷۹</span>
  </div>
  <div class="line en">
    <span class="seg"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#4b5057" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg><span class="ltr">www.pishtaj.ir</span></span>
    <span class="seg"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#4b5057" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="ltr">info@pishtaj.ir</span></span>
  </div>
</div>

<div class="bar-bot"><div class="grad"></div><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
</body></html>
