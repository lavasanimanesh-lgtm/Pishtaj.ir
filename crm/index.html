<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<style id="ptfCriticalTheme">
  :root { --bg: #f7f8fa; --brd: #e8ebf0; --pri: #ef4b1a; --org: #f79400; --crd: #fff; --tx: #1e293b; --sb: #fff; }
  body { background: var(--bg); color: var(--tx); }
  .sb { background: var(--sb); border-left: 1px solid var(--brd); }
  /* ===== v31.7.17 BUG-FOUC-001: تم قدیمی قبل از تم اصلی فلش می‌زد =====
     ریشه: theme.js و mobilenav.js انتهای body لود می‌شوند؛ CSS بحرانی پوسته باید در head باشد. */
  @font-face{font-family:'Vazirmatn';src:url('../assets/fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:100 500;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('../assets/fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:600 900;font-display:swap}
  *{font-family:'Vazirmatn','B Nazanin','BNazanin',Vazirmatn,Tahoma,sans-serif}
  .sb{box-shadow:0 0 20px rgba(15,23,42,.05)}
  .sb-n .sb-i{color:#475569}
  .sb-i.act{background:linear-gradient(90deg,rgba(239,75,26,.10),rgba(247,148,0,.05));color:#c2410c;box-shadow:inset -3px 0 0 var(--pri)}
  .pn{border:1px solid var(--brd);box-shadow:0 1px 3px rgba(15,23,42,.04)}
  html{overflow-y:scroll;scrollbar-gutter:stable}
  /* موبایل: سایدبار از همان فریم اول مخفی — دیگر فلشِ ستون ایموجی‌ها دیده نمی‌شود */
  /* MOB-005: گوشی افقی 844×390 از نظر عرض «desktop» نیست؛ قبل از لود JS نیز
     باید sidebar پنهان و فضای bottom-nav رزرو باشد تا layout یک فریم نپرد. */
  @media(max-width:768px), (max-width:900px) and (max-height:600px) and (orientation:landscape){
    .sb{display:none!important}
    .mn{margin-right:0!important;width:100%!important;max-width:100%!important}
    .ca{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
  }
  @media(max-width:900px) and (max-height:600px) and (orientation:landscape){
    .ca{padding-bottom:calc(54px + env(safe-area-inset-bottom,0px))!important}
  }
  /* MOB-008: در cold start، پیش از رسیدن bundleهای غیرضروری یک status واقعی
     به کاربر نشان بده تا فضای خالی با «خرابی» اشتباه گرفته نشود. */
  #ptfBootStatus{display:none}
  @media(max-width:768px), (max-width:900px) and (max-height:600px) and (orientation:landscape){
    #crmL[data-ptf-boot="loading"] #ptfBootStatus,#crmL[data-ptf-boot="nav"] #ptfBootStatus{position:fixed;display:inline-flex;align-items:center;gap:8px;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:1400;max-width:calc(100vw - 24px);background:#1e293b;color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;box-shadow:0 10px 28px rgba(15,23,42,.28);pointer-events:none;white-space:nowrap;overflow:hidden}
    #ptfBootStatus span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
    /* nav زودتر آماده است اما bundleهای بخش‌ها هنوز در پس‌زمینه می‌آیند. */
    #crmL[data-ptf-boot="nav"] #ptfBootStatus{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
    #ptfBootStatus .ptf-boot-spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:ptfBootSpin .75s linear infinite}
  }
  @media(max-width:900px) and (max-height:600px) and (orientation:landscape){#crmL[data-ptf-boot="nav"] #ptfBootStatus{bottom:calc(62px + env(safe-area-inset-bottom,0px))}}
  @keyframes ptfBootSpin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){#ptfBootStatus .ptf-boot-spin{animation:none}}
  /* MOB-037: badge صندوق پیام دیگر از button زنگوله بیرون نمی‌زند و توسط
     overflow عمومی button بریده نمی‌شود؛ حتی شمارندهٔ 99+ کامل دیده می‌شود. */
  #tbIcons,#tbBellBtn{overflow:visible!important}
  #tbBellBtn #ibBadge{top:1px!important;left:1px!important;right:auto!important;bottom:auto!important;z-index:4!important;box-sizing:border-box!important;pointer-events:none!important;line-height:1!important}

/* فیلترهای جدول باید روی دسکتاپ و کارت موبایل یکسان باشند؛ display:block!important
   کارت موبایل قبلاً style.display='none' را خنثی می‌کرد. */
.ptf-filter-hidden,.tb2 tr.ptf-filter-hidden{display:none!important}
/* ============ Sprint 108 / US-112: انقلابی در تجربه موبایل (Mobile Data Card View & Native PWA Feel) ============ */
@media (max-width: 768px) {
  body { font-size: 14px !important; background: var(--bg, #f1f5f9) !important; } /* US-285: رنگ متغیر — حالت شب موبایل */
  .btn, .bt, .bt-o, .btn-l, button {
    min-height: 46px !important;
    font-size: 14px !important;
    padding: 10px 14px !important;
    border-radius: 12px !important;
  }
  /* US-285: فیلدهای ورودی ۱۶px — جلوگیری از زوم خودکار iOS هنگام فوکوس */
  select, textarea, input[type="text"], input[type="number"], input[type="password"], input[type="email"], input[type="date"], input[type="search"] {
    min-height: 46px !important;
    font-size: 16px !important;
    padding: 10px 14px !important;
    border-radius: 12px !important;
  }

  /* v34.1.0 (فاز ۱۴): یکنواخت‌سازی دکمه‌ها در موبایل —
     آیکون وسط، متن خوانا/شکستنی، جلوگیری از خروج از صفحه */
  .bt, .bt-o, .btn, .btn-l, .ba, button {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    text-align: center !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    min-width: 0 !important;
    max-width: 100% !important;
    line-height: 1.5 !important;
  }
  .md .bt, .md .bt-o, .md .btn, .md .ba, .md button { width: 100% !important; white-space: normal !important; overflow: visible !important; text-overflow: unset !important; }
  .md .fr > .fld button { width: auto !important; }
  /* دکمه‌های کوچک داخل جدول/عملگری — بزرگ‌تر و لمسی */
  .tb2 .ba, .tb2 button, .ba { min-height: 34px !important; padding: 6px 10px !important; }
  /* متن توضیحات/برچسب‌های کوتاه — خوانا */
  .md small, .md .fld label, .tb2 small, .tb2 td { overflow-wrap: break-word !important; word-break: normal !important; }

  /* نسخه فعال — خوانا در موبایل */
  #topVerPill, #liveHealthPill { font-size: 12.5px !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; line-height: 1.4 !important; padding: 6px 10px !important; }
  /* هدر تک‌ردیفه موبایل — فضای کافی برای آیکون‌های 42px */
  .tb { flex-direction: row !important; align-items: center !important; justify-content: space-between !important; gap: 8px !important; height: 56px !important; overflow: hidden !important; }
  .tb > div:first-child { flex: 1 1 auto !important; min-width: 0 !important; display: flex !important; align-items: center !important; gap: 8px !important; }
  .tb > div:last-child { flex: 0 0 auto !important; display: flex !important; align-items: center !important; gap: 4px !important; }
  /* مخفی‌سازی عناصر غیرضروری موبایل */
  #topVerPill, #liveHealthPill, #clockD { display: none !important; }
  
  /* تبدیل ردیف‌های جدول به کارت‌های اطلاعاتی مستقل لمسی (Card Transformation) */
  .tb2 table, .tb2 thead, .tb2 tbody, .tb2 th, .tb2 td, .tb2 tr {
    display: block !important;
    width: 100% !important;
  }
  .tb2 thead tr {
    position: absolute !important;
    top: -9999px !important;
    left: -9999px !important;
  }
  .tb2 tr {
    background: var(--crd, #fff) !important; /* US-285 */
    border: 1px solid var(--brd) !important;
    border-radius: 18px !important;
    margin-bottom: 14px !important;
    padding: 14px !important;
    box-shadow: 0 6px 20px rgba(0,0,0,.06) !important;
    position: relative !important;
  }
  .tb2 td {
    border: none !important;
    border-bottom: 1px dashed var(--brd, #e2e8f0) !important; /* US-285 */
    position: relative !important;
    padding: 10px 0 !important;
    text-align: left !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    font-size: 13px !important;
  }
  .tb2 td:last-child {
    border-bottom: none !important;
    justify-content: flex-end !important;
    gap: 10px !important;
    padding-top: 14px !important;
    margin-top: 4px !important;
    border-top: 1px solid var(--brd) !important;
  }
  /* MOB-002: label ستون‌ها روی کارت موبایل؛ مقدار بدون زمینه باقی نمی‌ماند. */
  #panels .tb2 td[data-mobile-label]:not([data-mobile-label=""]) {
    gap: 10px !important;
  }
  #panels .tb2 td[data-mobile-label]:not([data-mobile-label=""])::before {
    content: attr(data-mobile-label);
    flex: 0 0 42%;
    max-width: 42%;
    color: #64748b;
    font-size: 11px;
    font-weight: 800;
    line-height: 1.6;
    text-align: right;
    direction: rtl;
    overflow-wrap: anywhere;
  }
  #panels .tb2 td[data-mobile-label=""]::before { content: none; }
  
  /* بهبود نمایش سایدبار و ناوبری در موبایل */
  /* crm-l normal */
  /* sb 56px kept */
  .mn { padding: 10px !important; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; }
  .md, .ptfdlg-b .md {
    width: 96% !important;
    max-width: 96vw !important;
    max-height: 88vh !important;
    margin: 10px auto !important;
    padding: 18px !important;
    border-radius: 20px !important;
  }
  .ph { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
  /* MOB-001: کنترل‌های مودال در موبایل دیگر مک‌داتِ بی‌معنا/کشیده نیستند.
     هر کنترل hit-area ثابت، نماد همیشه قابل‌دیدن و رنگ معنایی دارد. */
  body .md { padding-top: 62px !important; } /* عنوان زیر ردیف کنترل‌ها می‌آید، نه زیر آن‌ها */
  .md .mx-dots { top: 12px !important; left: 12px !important; gap: 6px !important; }
  .md .mx-dots .mx-dot {
    width: 36px !important;
    height: 36px !important;
    min-width: 36px !important;
    min-height: 36px !important;
    max-width: 36px !important;
    max-height: 36px !important;
    flex: 0 0 36px !important;
    margin: 0 !important;
    padding: 0 !important;
    display: grid !important;
    place-items: center !important;
    border-radius: 12px !important;
    border: 1px solid transparent !important;
    line-height: 1 !important;
    overflow: visible !important;
  }
  .md .mx-dots .mx-dot span {
    position: static !important;
    inset: auto !important;
    display: grid !important;
    place-items: center !important;
    width: 100% !important;
    height: 100% !important;
    font-size: 17px !important;
    line-height: 1 !important;
    font-weight: 900 !important;
    pointer-events: none !important;
  }
  .md .mx-dots .mx-dot.r { background: #fef2f2 !important; border-color: #fecaca !important; }
  .md .mx-dots .mx-dot.r span { color: #dc2626 !important; }
  .md .mx-dots .mx-dot.y { background: #fffbeb !important; border-color: #fde68a !important; }
  .md .mx-dots .mx-dot.y span { color: #d97706 !important; }
  .md .mx-dots .mx-dot.g { background: #ecfdf5 !important; border-color: #a7f3d0 !important; }
  .md .mx-dots .mx-dot.g span { color: #059669 !important; }
  .md .mx-dots .mx-dot.a { background: #f5f3ff !important; border-color: #ddd6fe !important; }
  .md .mx-dots .mx-dot.a span { color: #7c3aed !important; font-size: 15px !important; }
  /* v20.0 BUG-033: چیپ بیضی mx-ai حذف شد — دستیار = نقطه چهارم mx-dot.a */
  .md .fr { grid-template-columns: 1fr !important; } /* فرم‌های دوستونه → تک‌ستون در موبایل */
  .md h3 { font-size: 15px !important; padding-left: 0 !important; }
  /* ردیف دکمه‌های پایین مودال: تمام‌عرض و زیر هم */
  .md > div[style*="justify-content:flex-end"], .md > div[style*="justify-content: flex-end"] {
    flex-direction: column-reverse !important; align-items: stretch !important; gap: 8px !important;
  }
  .md > div[style*="justify-content:flex-end"] .bt, .md > div[style*="justify-content: flex-end"] .bt {
    width: 100% !important; justify-content: center !important; text-align: center !important;
  }
  .sb2 { width: 100% !important; display: flex !important; flex-wrap: wrap !important; gap: 8px !important; }
  .sb2 input, .sb2 select { width: 100% !important; }
  /* MOB-030: فیلتر کالا و actionهای زیر «همه» در ردیف مستقل، بدون هم‌پوشانی. */
  #prodFilters { width: 100% !important; display: grid !important; grid-template-columns: 1fr !important; gap: 8px !important; margin-bottom: 10px !important; }
  #prodFilters > input, #prodFilters > select { width: 100% !important; min-width: 0 !important; min-height: 46px !important; }
  #prodFilterExtras { width: 100% !important; min-width: 0 !important; display: grid !important; grid-template-columns: minmax(0, 1fr) auto !important; align-items: center !important; gap: 8px !important; }
  #prodFilterExtras .prod-hidden-toggle { min-width: 0 !important; white-space: normal !important; line-height: 1.5 !important; }
  #prodFilterExtras .lt-btn { justify-self: end !important; }

  /* ===== v34.1: دکمه‌های هدر ماژول → Icon-Only در موبایل ===== */
  /* دکمه‌های .ph (هدر ماژول‌ها) و .sb2 (نوار ابزار): فقط ایموجی/آیکون */
  .ph .bt, .ph .bt-o, .sb2 .bt, .sb2 .bt-o {
    font-size: 0 !important;
    padding: 0 !important;
    width: 44px !important;
    height: 44px !important;
    min-width: 44px !important;
    min-height: 44px !important;
    max-width: 44px !important;
    display: inline-grid !important;
    place-items: center !important;
    border-radius: 12px !important;
    flex: 0 0 auto !important;
    white-space: nowrap !important;
  }
  /* ایموجی آغازی → بزرگ و مرکزی */
  .ph .bt::first-letter, .ph .bt-o::first-letter,
  .sb2 .bt::first-letter, .sb2 .bt-o::first-letter {
    font-size: 18px !important;
  }

  /* MOB-034: کنترل‌های کارتابل من از قانون icon-only عمومی .ph مستثنا هستند.
     filter تمام‌عرض و actionهای برچسب‌دار در grid مستقل می‌مانند؛ بنابراین در
     عرض 320px checkbox، «خواندم همه»، ترجیحات و پیام گروه روی هم نمی‌افتند. */
  #panels .cartable-head .cartable-toolbar {
    width: 100% !important;
    flex: 1 0 100% !important;
    min-width: 0 !important;
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) !important;
    gap: 8px !important;
  }
  #panels .cartable-head .cartable-toggle {
    width: 100% !important;
    min-height: 48px !important;
    box-sizing: border-box !important;
    display: flex !important;
    align-items: center !important;
    gap: 9px !important;
    padding: 9px 12px !important;
    border: 1px solid #bfdbfe !important;
    border-radius: 12px !important;
    background: #f8fbff !important;
    color: #334155 !important;
    font-size: 12px !important;
    font-weight: 800 !important;
    line-height: 1.5 !important;
    cursor: pointer !important;
  }
  #panels .cartable-head .cartable-toggle input[type="checkbox"] {
    appearance: auto !important;
    width: 20px !important;
    height: 20px !important;
    min-width: 20px !important;
    min-height: 20px !important;
    max-width: 20px !important;
    max-height: 20px !important;
    margin: 0 !important;
    padding: 0 !important;
    flex: 0 0 20px !important;
    accent-color: #0e7490 !important;
  }
  #panels .cartable-head .cartable-quick-actions {
    width: 100% !important;
    min-width: 0 !important;
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 8px !important;
  }
  #panels .cartable-head .cartable-action {
    width: 100% !important;
    min-width: 0 !important;
    max-width: none !important;
    min-height: 64px !important;
    height: auto !important;
    margin: 0 !important;
    padding: 7px 4px !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 4px !important;
    border-width: 1px !important;
    border-radius: 12px !important;
    font-size: 10.5px !important;
    font-weight: 800 !important;
    line-height: 1.3 !important;
    white-space: normal !important;
    text-align: center !important;
    overflow: hidden !important;
    text-overflow: clip !important;
  }
  #panels .cartable-head .cartable-action-icon {
    display: grid !important;
    place-items: center !important;
    width: 21px !important;
    height: 21px !important;
    flex: 0 0 21px !important;
    font-size: 19px !important;
    line-height: 1 !important;
  }
  #panels .cartable-head .cartable-action-label {
    display: block !important;
    max-width: 100% !important;
    overflow-wrap: anywhere !important;
  }
  #panels .cartable-head .cartable-read-all { color: #0f766e !important; background: #f0fdfa !important; border-color: #99f6e4 !important; }
  #panels .cartable-head .cartable-preferences { color: #475569 !important; background: #f8fafc !important; border-color: #cbd5e1 !important; }
  #panels .cartable-head .cartable-message-action { color: #2563eb !important; background: #eff6ff !important; border-color: #bfdbfe !important; }

  /* MOB-035: فیلترهای یادآورها همان مشکل کارتابل را داشتند: checkbox کشیده و
     «یادآور جدید» به icon-only مبهم تبدیل می‌شد. */
  #panels .reminders-head .reminders-toolbar {
    width: 100% !important;
    flex: 1 0 100% !important;
    min-width: 0 !important;
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) !important;
    gap: 8px !important;
  }
  #panels .reminders-head .reminders-select {
    width: 100% !important;
    min-width: 0 !important;
    min-height: 48px !important;
    box-sizing: border-box !important;
    padding: 9px 12px !important;
    border: 1px solid var(--brd, #e2e8f0) !important;
    border-radius: 12px !important;
    background: var(--crd, #fff) !important;
  }
  #panels .reminders-head .reminders-footer {
    width: 100% !important;
    min-width: 0 !important;
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 8px !important;
  }
  #panels .reminders-head .reminders-toggle {
    min-width: 0 !important;
    min-height: 58px !important;
    box-sizing: border-box !important;
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 8px 10px !important;
    border: 1px solid #fde68a !important;
    border-radius: 12px !important;
    background: #fffbeb !important;
    color: #92400e !important;
    font-size: 11px !important;
    font-weight: 800 !important;
    line-height: 1.45 !important;
  }
  #panels .reminders-head .reminders-toggle input[type="checkbox"] {
    appearance: auto !important;
    width: 20px !important;
    height: 20px !important;
    min-width: 20px !important;
    min-height: 20px !important;
    max-width: 20px !important;
    max-height: 20px !important;
    margin: 0 !important;
    padding: 0 !important;
    flex: 0 0 20px !important;
    accent-color: #d97706 !important;
  }
  #panels .reminders-head .reminders-new-action {
    width: 100% !important;
    min-width: 0 !important;
    max-width: none !important;
    min-height: 58px !important;
    margin: 0 !important;
    padding: 7px 5px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 3px !important;
    border-radius: 12px !important;
    font-size: 11px !important;
    line-height: 1.3 !important;
    white-space: normal !important;
    overflow: hidden !important;
    text-overflow: clip !important;
  }
  #panels .reminders-head .reminders-action-icon { font-size: 19px !important; line-height: 1 !important; }
  #panels .reminders-head .reminders-action-label { display: block !important; max-width: 100% !important; overflow-wrap: anywhere !important; }

  /* MOB-036: tabهای هاب مالی در 320px با عرض متن چیده می‌شدند و 10 tab را
     به ردیف‌های نامتقارن و بلند تبدیل می‌کردند. grid دو ستونه، همهٔ مقصدها را
     در یک الگوی پایدار و بدون horizontal overflow نگه می‌دارد. */

<script>
(function(){
  try {
    var mode = localStorage.getItem('ptf_theme');
    var r = document.documentElement;
    if (mode === 'dark') {
      r.style.setProperty('--bg', '#0f172a');
      r.style.setProperty('--crd', '#1e293b');
      r.style.setProperty('--tx', '#f8fafc');
      r.style.setProperty('--brd', '#334155');
      r.style.setProperty('--sb', '#0f172a');
    } else {
      var th = localStorage.getItem('ptf_crm_theme_vars');
      if (th) {
        var v = JSON.parse(th);
        if (v.pri) r.style.setProperty('--pri', v.pri);
        if (v.bg) r.style.setProperty('--bg', v.bg);
        if (v.crd) r.style.setProperty('--crd', v.crd);
        if (v.tx) r.style.setProperty('--tx', v.tx);
        if (v.brd) r.style.setProperty('--brd', v.brd);
        if (v.sb) r.style.setProperty('--sb', v.sb);
      }
    }
  } catch(e){}
})();
</script>

<script>
// نسخه امن: فقط session و کش پاک می‌شود — داده‌های CRM هرگز حذف نمی‌شوند
function ptfSafeReset() {
  try { if (typeof ptfAuthClear === 'function') ptfAuthClear(); } catch (eAc3) {}
  localStorage.removeItem('ptf_crm_session');
  /* v34.7.93 (AUTH-TOKEN-REQUIRED): «رفع مشکل ورود» باید نشست و توکن را همزمان پاک کند.
     پیش‌تر فقط session حذف می‌شد و توکن کهنه/نامعتبر در localStorage می‌ماند و ورود مجدد
     را گمراه می‌کرد. داده‌های CRM هرگز حذف نمی‌شوند. */
  localStorage.removeItem('ptf_crm_token');
  localStorage.removeItem('ptf_crm_token_role');
  localStorage.removeItem('ptf_login_lock');
  localStorage.removeItem('ptf_nav_open');
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
  if (window.caches && caches.keys) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
  setTimeout(function(){ location.href = '?fresh=' + Date.now(); }, 800);
}
</script>

<script>
// ===== LOGIN - کاملاً مجزا و ساده =====
const ADMIN_USER = 'admin';
/* SEC-03 (v34.1): ADMIN_HASH از سورس کلاینت حذف شد — احراز هویت ادمین فقط سمت سرور */
const ADMIN_NAME = 'مدیر ارشد سیستم';
const ADMIN_ROLE = 'مدیریت کل سیستم (Admin)';

async function sha256Hex(str) {
  // v78.1: در برخی مرورگرها روی HTTP غیرامن crypto.subtle وجود ندارد → پیاده‌سازی خالص JS
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* fallback پایین */ }
  }
  return sha256Fallback(str);
}
// SHA-256 خالص JS (فقط وقتی crypto.subtle در دسترس نیست — مثلاً HTTP بدون SSL)
function sha256Fallback(ascii) {
  function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), result = '';
  var words = [], asciiBitLength = 0;
  var hash = [], k = [], primeCounter = 0;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  // UTF-8 encode
  ascii = unescape(encodeURIComponent(ascii));
  ascii += '\x80';
  asciiBitLength = (ascii.length - 1) * 8;
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash.slice(0);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

// US-145 AC5: قفل ورود پس از ۵ تلاش ناموفق (۶۰ ثانیه)
function loginLockState() {
  try { return JSON.parse(localStorage.getItem('ptf_login_lock') || '{}'); } catch(e) { return {}; }
}
function loginFail() {
  var s = loginLockState();
  s.fails = (s.fails || 0) + 1;
  if (s.fails >= 5) { s.until = Date.now() + 60000; s.fails = 0; }
  localStorage.setItem('ptf_login_lock', JSON.stringify(s));
  return s;
}
function ptfApiAuthHeaders(json) {
  /* v34.8.45 (R5/T4-1b): نمای واحد لایهٔ نشست (rbac.js) — توکن از sessionStorage */
  if (typeof ptfAuthHeaders === 'function') return ptfAuthHeaders(json);
  var h = json ? { 'Content-Type': 'application/json' } : {};
  try { var t = localStorage.getItem('ptf_crm_token'); if (t) h['X-CRM-Token'] = t; } catch (e) {}
  return h;
}
function ptfServerLogin(u, p) {
  return fetch('../api/crm.php?action=auth_login&_t=' + Date.now(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'username=' + encodeURIComponent(u) + '&pass' + 'word=' + encodeURIComponent(p)
  }).then(function (r) { return r.json(); }).catch(function () { return null; });
}

/* v34.8.46 (R6/T7-ب — LOGIN-2FA): اگر auth_login برای نقش مالی otp_required برگرداند،
   کد پیامکی گرفته و با auth_login_otp توکن بگیرد. لغو کاربر = خروج با error روشن. */
async function ptf2faContinue(u, resp) {
  try {
    if (!resp || !resp.otp_required) {
      if (resp && resp.ok && resp.twofa_skipped && typeof ptfToast === 'function') {
        try { ptfToast('ℹ️ ورود دومرحله‌ای برای نقش شما فعال است اما موقتاً اجرا نشد (' + resp.twofa_skipped + ') — برای ادمین ثبت شد', 'warn'); } catch (eT) {}
      }
      return resp;
    }
    var tries = 0;
    while (tries < 3) {
      var code = '';
      try { code = (window.prompt('رمز ۶ رقمی ارسال‌شده به موبایل ...' + (resp.mobile_last4 || '') + ' (اعتبار ۳ دقیقه):') || '').trim(); } catch (ePr) {}
      if (!/^\d{6}$/.test(code)) {
        if (code === '' || code === null) return { ok: false, error: 'twofa_cancelled', message: 'ورود دومرحله‌ای لغو شد' };
        tries++; continue;
      }
      var r2 = await fetch('../api/crm.php?action=auth_login_otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'username=' + encodeURIComponent(u) + '&otp_challenge=' + encodeURIComponent(resp.otp_challenge) + '&code=' + encodeURIComponent(code)
      }).then(function (r) { return r.json(); }).catch(function () { return null; });
      if (r2 && r2.ok && r2.token) return r2;
      tries++;
      if (tries < 3) { try { alert((r2 && (r2.message || r2.error)) ? ((r2.message || r2.error) + ' — دوباره تلاش کنید') : 'کد تأیید نشد — دوباره تلاش کنید'); } catch (eAl) {} }
    }
    return { ok: false, error: 'twofa_failed', message: 'کد دومرحله‌ای تأیید نشد — دوباره وارد شوید' };
  } catch (e) { return { ok: false, error: 'twofa_error', message: 'خطای ورود دومرحله‌ای' }; }
}
function ptfInvalidateSession(msg) {
  try { if (typeof ptfAuthClear === 'function') ptfAuthClear(); } catch (eAc) {}
  try { if (typeof ptfAuthClear === 'function') ptfAuthClear(); } catch (eAc4) {}
  try { localStorage.removeItem('ptf_crm_session'); localStorage.removeItem('ptf_crm_token'); localStorage.removeItem('ptf_crm_token_role'); } catch (e) {}
  var le = document.getElementById('lerr');
  if (le) { le.textContent = msg || 'نشست سرور معتبر نیست؛ لطفاً دوباره وارد شوید.'; le.style.display = 'block'; }
  try { document.getElementById('crmL').style.display = 'none'; document.getElementById('loginS').style.display = 'grid'; } catch (e2) {}
}
async function doLogin() {
  var lock = loginLockState();
  if (lock.until && Date.now() < lock.until) {
    var sec = Math.ceil((lock.until - Date.now()) / 1000);
    var le = document.getElementById('lerr');
    le.textContent = '🔒 به دلیل تلاش‌های ناموفق، ورود ' + sec + ' ثانیه قفل است';
    le.style.display = 'block';
    setTimeout(function(){ le.style.display = 'none'; }, 3000);
    return;
  }
  var u = document.getElementById('uName').value.trim().toLowerCase();
  var p = document.getElementById('uPass').value.trim();
  var ph = await sha256Hex(p);

  // v33.0.3: server-authoritative login first for every role, including admin.
  var _login = await ptfServerLogin(u, p);
  _login = await ptf2faContinue(u, _login); /* v34.8.46: نقش مالی → کد پیامکی */
  if (_login && _login.ok && _login.token) {
    localStorage.removeItem('ptf_login_lock');
    localStorage.removeItem('ptf_crm_offline_login');
    ptfAuthLoginWrite(_login.token, _login.role || 'sales', { /* v34.8.45 (R5/T4-1b): توکن/نشست در sessionStorage؛ LS فقط پاک می‌شود */
      user: _login.user || u,
      name: _login.name || u,
      role: _login.role || 'sales',
      roleId: _login.role || 'sales'
    });
    try {
      var _cu = JSON.parse(localStorage.getItem('ptf_crm_users') || '[]');
      var _ex = false;
      for (var _i = 0; _i < _cu.length; _i++) if (_cu[_i].username === (_login.user || u)) { _cu[_i].passhash = ph; _cu[_i].name = _cu[_i].name || (_login.name || u); _cu[_i].roleId = _cu[_i].roleId || (_login.role || 'sales'); _ex = true; }
      if (!_ex && u !== 'admin') _cu.push({ username: _login.user || u, name: _login.name || u, role: _login.role || 'sales', roleId: _login.role || 'sales', passhash: ph });
      localStorage.setItem('ptf_crm_users', JSON.stringify(_cu));
    } catch (eCacheUser) {}
    // v33.2.1: بعد از سرور لاگین، کاربران سرور رو بگیر — ادمین هم باید لیست کاربران رو ببینه
    if (typeof usersPullFromServer === 'function') usersPullFromServer(function () { if (typeof renderUsers2 === 'function') renderUsers2(); });
    showCrm();
    return;
  }
  if (u === ADMIN_USER) {
    var stAdmin = loginFail();
    var leAdmin = document.getElementById('lerr');
    leAdmin.textContent = stAdmin.until ? '🔒 ۵ تلاش ناموفق — ورود ۶۰ ثانیه قفل شد' : '❌ ورود admin باید از سرور توکن بگیرد. ptf-secrets.php/admin_sha256 و auth_key را بررسی کنید.';
    leAdmin.style.display = 'block';
    setTimeout(function(){ leAdmin.style.display = 'none'; }, 7000);
    return;
  }

  /* SEC-03: بلاک لاگین آفلاین ادمین کاملاً حذف شد — احراز هویت فقط از سرور */
  /* v34.7.93 (AUTH-TOKEN-REQUIRED): ورود فقط-محلی که session بدون توکن می‌ساخت حذف شد.
     ریشه باگ «توکن معتبر وجود ندارد»: وقتی auth_login سرور موقتاً ناموفق بود (شبکه/429/
     رمز)، کد قبلی اگر هش محلی را داشت فقط session می‌ساخت و showCrm بلافاصله همان پیام
     گمراه‌کننده را نشان می‌داد. اکنون هر ورود باید از سرور توکن بگیرد؛ هیچ session
     بدون توکن ساخته نمی‌شود. پیام‌های خطا هم دقیق‌اند. */
  var _srvErr = (_login && _login.ok === false) ? _login.error : '';
  if (_srvErr !== '') {
    var stSrv = loginFail();
    var leSrv = document.getElementById('lerr');
    var srvMsg;
    if (_srvErr === 'too_many_attempts') srvMsg = 'تعداد تلاش بیش از حد — لطفاً بعداً دوباره تلاش کنید';
    else if (_srvErr === 'auth_not_configured') srvMsg = 'سامانه احراز هویت پیکربندی نشده است';
    else if (_srvErr === 'invalid_credentials' || _srvErr === 'invalid_credentials') srvMsg = 'نام کاربری یا رمز عبور اشتباه است';
    else srvMsg = 'ورود از سرور رد شد: ' + _srvErr;
    leSrv.textContent = stSrv.until ? '🔒 ۵ تلاش ناموفق — ورود ۶۰ ثانیه قفل شد' : ('❌ ' + srvMsg);
    leSrv.style.display = 'block';
    setTimeout(function () { leSrv.style.display = 'none'; }, 7000);
    return;
  }

  // ===== US-151 فاز ۱: کاربر محلی پیدا نشد → مستقیم از سرور بگیر و دوباره چک کن =====
  // v78.1: بدون واسطه rbac.js + پیام‌های تشخیصی دقیق (سرور قطع؟ کاربر نیست؟ رمز غلط؟)
  var le0 = document.getElementById('lerr');
  le0.textContent = '⏳ در حال بررسی کاربران سرور...';
  le0.style.display = 'block';
  var srvResult = await fetch('../api/crm.php?action=users_get&t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .catch(function () { return null; });

  var errMsg = '';
  if (!srvResult) {
    errMsg = '⚠️ اتصال به سرور برقرار نشد — اینترنت/آدرس سایت را چک کنید';
  } else if (!srvResult.ok || !Array.isArray(srvResult.users) || !srvResult.users.length) {
    errMsg = '⚠️ هنوز کاربری روی سرور ثبت نشده — ادمین باید از مرورگر اصلی وارد CRM شود یا در پنل «کاربران» دکمهٔ «🔄 همگام‌سازی کاربران» را بزند تا کاربران روی سرور بروند';
  } else {
    // ادغام با محلی (کاربران فقط-محلی حفظ شوند)
    var localU = JSON.parse(localStorage.getItem('ptf_crm_users') || '[]');
    var seen = {};
    srvResult.users.forEach(function (x) { seen[x.username] = true; });
    var merged = srvResult.users.slice();
    localU.forEach(function (x) { if (!seen[x.username]) merged.push(x); });
    /* v31.7.14 BUG-USERS-VANISH-001: نسخه سروری users_get از v31.7.4 passhash ندارد؛
       بدون این حفظ، رکورد محلیِ دارای هش با نسخه بی‌هش جایگزین و در seed بعدی
       کاربر از سرور حذف می‌شد. هش محلی روی رکورد merged برگردانده می‌شود. */
    var _localByName = {};
    localU.forEach(function (x) { if (x && x.username) _localByName[x.username] = x; });
    merged.forEach(function (x) {
      if (x && x.username && !x.passhash && _localByName[x.username] && _localByName[x.username].passhash) {
        x.passhash = _localByName[x.username].passhash;
      }
    });
    localStorage.setItem('ptf_crm_users', JSON.stringify(merged));

    var srvUser = null;
    for (var j = 0; j < merged.length; j++) if (merged[j].username === u) { srvUser = merged[j]; break; }
    if (srvUser) {
      // v31.7.8 HOTFIX-AUTH: users_get no longer returns passhash (BUG-AUDIT-004).
      // Instead of comparing locally, delegate to auth_login on the server which
      // compares passhash server-side and returns a JWT token on success.
      var _srvLogin = await fetch('../api/crm.php?action=auth_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'username=' + encodeURIComponent(u) + '&pass' + 'word=' + encodeURIComponent(p)
      }).then(function (r) { return r.json(); }).catch(function () { return null; });
      _srvLogin = await ptf2faContinue(u, _srvLogin); /* v34.8.46: نقش مالی → کد پیامکی */

      if (_srvLogin && _srvLogin.ok && _srvLogin.token) {
        localStorage.removeItem('ptf_login_lock');
        ptfAuthLoginWrite(_srvLogin.token, _srvLogin.role || srvUser.roleId || 'sales', { /* v34.8.45 (R5/T4-1b) */
          user: _srvLogin.user || u,
          name: _srvLogin.name || srvUser.name || u,
          role: _srvLogin.role || srvUser.roleId || 'sales',
          roleId: _srvLogin.role || srvUser.roleId || 'sales'
        });
        // Also store passhash locally for future offline login (from existing server data)
        for (var j2 = 0; j2 < merged.length; j2++) {
          if (merged[j2].username === u) { merged[j2].passhash = ph; break; }
        }
        localStorage.setItem('ptf_crm_users', JSON.stringify(merged));
        showCrm();
        return;
      }
      // auth_login failed — show specific error
      if (_srvLogin && !_srvLogin.ok) {
        errMsg = '❌ ' + (_srvLogin.error || 'نام کاربری یا رمز عبور اشتباه است');
      } else {
        errMsg = '⚠️ عدم اتصال به سرور برای احراز هویت — اینترنت را بررسی کنید';
      }
    } else {
      // v31.9 BUG-AUTH-MOBILE-USER-001: users_get can be stale or role-filtered;
      // try server-side auth_login directly before declaring user-not-found.
      var _directLogin = await fetch('../api/crm.php?action=auth_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'username=' + encodeURIComponent(u) + '&pass' + 'word=' + encodeURIComponent(p)
      }).then(function (r) { return r.json(); }).catch(function () { return null; });
      _directLogin = await ptf2faContinue(u, _directLogin); /* v34.8.46: نقش مالی → کد پیامکی */
      if (_directLogin && _directLogin.ok && _directLogin.token) {
        localStorage.removeItem('ptf_login_lock');
        var roleDirect = _directLogin.role || 'sales';
        var nameDirect = _directLogin.name || u;
        ptfAuthLoginWrite(_directLogin.token, roleDirect, { user: _directLogin.user || u, name: nameDirect, role: roleDirect, roleId: roleDirect }); /* v34.8.45 (R5/T4-1b) */
        try {
          var curUsers = JSON.parse(localStorage.getItem('ptf_crm_users') || '[]');
          var exists = false;
          for (var du = 0; du < curUsers.length; du++) {
            if (curUsers[du].username === u) { curUsers[du].passhash = ph; curUsers[du].name = curUsers[du].name || nameDirect; curUsers[du].roleId = curUsers[du].roleId || roleDirect; exists = true; break; }
          }
          if (!exists) curUsers.push({ username: u, name: nameDirect, role: roleDirect, roleId: roleDirect, passhash: ph });
          localStorage.setItem('ptf_crm_users', JSON.stringify(curUsers));
        } catch (eDU) {}
        showCrm();
        return;
      }
      errMsg = '❌ کاربری با نام «' + u + '» روی سرور پیدا نشد. اگر این کاربر روی دسکتاپ وارد می‌شود، در دسکتاپ از حساب ادمین یک‌بار خروج/ورود مجدد کنید یا در پنل «کاربران» دکمهٔ «🔄 همگام‌سازی کاربران» را بزنید.';
    }
  }

  var st = loginFail();
  var le = document.getElementById('lerr');
  le.textContent = st.until ? '🔒 ۵ تلاش ناموفق — ورود ۶۰ ثانیه قفل شد' : (errMsg || 'نام کاربری یا رمز عبور اشتباه است');
  le.style.display = 'block';
  setTimeout(function(){ le.style.display = 'none'; }, 6000);
}

/* =====================================================================
   MOB-010 — deep-link پنل‌ها
   مقصد hash بعد از اتمام defer bundleها اعمال می‌شود؛ بنابراین #off در cold
   start نه به #dash بازنویسی می‌شود و نه پیش از تعریف buildOffers خطا می‌دهد.
   ===================================================================== */
function ptfHashPanelId(value) {
  var raw = String(value == null ? '' : value).replace(/^#/, '').trim().toLowerCase();
  return /^[a-z][a-z0-9_-]*$/.test(raw) ? raw : '';
}
function ptfDeepLinkButton(id) {
  return (typeof window.ptfFindPanelButton === 'function') ? window.ptfFindPanelButton(id) : null;
}
function ptfReplacePanelHash(id) {
  try { history.replaceState({ panel: id }, '', '#' + id); } catch (e) {}
}
function ptfDeepLinkFallback() {
  try {
    var role = (typeof window.roleDef === 'function') ? window.roleDef() : null;
    if (role && role.panels !== '*') {
      if (role.panels.indexOf('dash') > -1) return 'dash';
      if (role.panels.length) return role.panels[0];
    }
  } catch (e) {}
  return 'dash';
}
window.ptfOpenHashPanel = function (value) {
  var id = ptfHashPanelId(value);
  if (!id) return false;
  var crm = document.getElementById('crmL');
  if (!crm || crm.style.display === 'none') return false;
  var btn = ptfDeepLinkButton(id);
  /* panel ناشناخته یا بدون دسترسی → landing مجاز نقش، بدون alert گمراه‌کننده. */
  if (!btn || window.getComputedStyle(btn).display === 'none' || (typeof window.canPanel === 'function' && !window.canPanel(id) && id !== 'set')) {
    ptfReplacePanelHash(ptfDeepLinkFallback());
    return false;
  }
  _ptfNavFromPop = true;
  try { goPanel(id, btn); } catch (e) { _ptfNavFromPop = false; return false; }
  _ptfNavFromPop = false;
  /* بعضی wrapperهای پنل سفارشی history/state پایه را دور می‌زنند. */
  window.ptfActivePanel = id;
  ptfReplacePanelHash(id);
  return true;
};
function ptfApplyInitialHashPanel() {
  var id = ptfHashPanelId(window.ptfInitialHashPanel);
  window.ptfInitialHashPanel = '';
  if (id && id !== 'dash') window.ptfOpenHashPanel(id);
  else if (id === 'dash') ptfReplacePanelHash('dash');
}
/* همهٔ scriptهای defer و mobile-nav-state تا load تمام می‌شوند؛ 360ms برای wrapper
   state آخر لازم است و همان قراردادی است که queue ناوبری cold-start استفاده می‌کند. */
window.addEventListener('load', function () { setTimeout(ptfApplyInitialHashPanel, 360); }, { once: true });
window.addEventListener('hashchange', function () {
  if (window._ptfSkipNextHashChange) { window._ptfSkipNextHashChange = false; return; }
  if (document.readyState !== 'complete') return;
  setTimeout(function () { window.ptfOpenHashPanel(window.location.hash); }, 0);
});

      window.ptfScheduleDataRefresh(k);

// Sprint 110 / US-116 → v28.8 BUG-CODE-FIX: سیستم کدینگ یکپارچه برای کلیه موجودیت‌ها
/* v28.8 (BUG-CODE-FIX): رفع ۶ نقص بحرانی سیستم کدینگ — ریشه باگ «کد تکراری/قدیمی»:
   ۱. regex با Device Tag سازگار نبود (RFQ-1001-D10 دیده نمی‌شد)
   ۲. ۳۸ prefix از ۴۳ prefix به صورت تصادفی (Math.random) کد می‌گرفتند → برخورد حتمی
   ۳. شمارنده حافظه‌ای (_ptfCodeSeq) با رفرش صفحه reset می‌شد
   ۴. دو سیستم موازی offerSerial و ptfUnifiedCode یکدیگر را نمی‌دیدند
   ۵. در حلقه‌های batch، genCode قبل از setData فراخوانی → race condition
   ۶. هیچ اعتبارسنجی یکتایی پس از تولید وجود نداشت
   اصلاح: همه ۴۳ prefix sequential + regex سازگار با Device Tag + یکتایی تضمینی + fallback امن */
window._ptfCodeSeq = window._ptfCodeSeq || {};
window.ptfUnifiedCode = function (prefix) {
  var p = String(prefix || 'ID').toUpperCase().trim();
  // US-265 (v23.2): Device Tag — بدون تغيير
  var devTag = (function () {
    try {
      if (localStorage.getItem('ptf_crm_sync_enabled') !== '1' && !window._ptfSyncBootstrapped) return '';
      var t = localStorage.getItem('ptf_crm_device_tag');
      if (!t) { t = 'D' + Math.floor(10 + Math.random() * 89); localStorage.setItem('ptf_crm_device_tag', t); }
      return '-' + t;
    } catch (e) { return ''; }
  })();
  /* v28.8 BUG-CODE-FIX: رفع ۶ نقص بحرانی سیستم کدینگ
     ① regex سازگار با Device Tag ② همه prefixها sequential
     ③ یکتایی تضمینی ④ اسکن عمیق ساختارهای تودرتو
     ⑵ شمارنده نشست قوی‌تر ⑥ fallback امن برای prefix ناشناخته */
  function extractNum(code, pattern) {
    var s = String(code || '').replace(/-D\d+$/, '');
    // FIX v28.8: سازگاری با فرمت PTF-KIND-YEAR-NUM (offerSerial) و KIND-NUM
    var m = s.match(new RegExp('^' + pattern + '-(\\d+)$', 'i'))
         || s.match(new RegExp('^PTF-' + pattern + '-\\d+-(\\d+)$', 'i'));
    return m ? +m[1] : 0;
  }
  function deepScan(listKey, codeField, pattern, paths) {
    var max = 0;
    try {
      var raw = localStorage.getItem(listKey);
      if (!raw) return 0;
      var data = JSON.parse(raw);
      if (!Array.isArray(data) && typeof data === 'object') {
        Object.keys(data).forEach(function(k) {
          if (Array.isArray(data[k])) {
            data[k].forEach(function(x) {
              var n = extractNum(x[codeField], pattern);
              if (n > max) max = n;
            });
          }
        });
        return max;
      }
      if (Array.isArray(data)) {
        data.forEach(function(item) {
          var n = extractNum(item[codeField], pattern);
          if (n > max) max = n;
          if (paths && paths.length) {
            paths.forEach(function(path) {
              var nested = item;
              path.split('.').forEach(function(seg) { nested = nested ? nested[seg] : null; });
              if (Array.isArray(nested)) {
                nested.forEach(function(x) {
                  var n2 = extractNum(x[codeField], pattern);
                  if (n2 > max) max = n2;
                });
              }
            });
          }
        });
      }
    } catch (e) {}
    return max;
  }
  function genSeq(listKey, codeField, pattern, make, nestedPaths) {
    var max = deepScan(listKey, codeField, pattern, nestedPaths);
    var seqKey = pattern.toUpperCase();
    var candidate = Math.max(max + 1, (window._ptfCodeSeq[seqKey] || 0) + 1);
    window._ptfCodeSeq[seqKey] = candidate;
    var code = make(candidate);
    var attempts = 0;
    while (attempts < 50) {
      var exists = false;
      try {
        var raw = localStorage.getItem(listKey);
        if (raw) {
          var data = JSON.parse(raw);
          var check = function(x) {
            var cd = String(x[codeField] || '').replace(/-D\d+$/, '').toUpperCase();
            return cd === code.toUpperCase();
          };
          if (Array.isArray(data)) {
            exists = data.some(check);
            if (!exists && nestedPaths) {
              nestedPaths.forEach(function(path) {
                data.forEach(function(item) {
                  var nested = item;
                  path.split('.').forEach(function(seg) { nested = nested ? nested[seg] : null; });
                  if (Array.isArray(nested) && nested.some(check)) exists = true;
                });
              });
            }
          } else if (typeof data === 'object') {
            Object.keys(data).forEach(function(k) {
              if (Array.isArray(data[k]) && data[k].some(check)) exists = true;
            });
          }
        }
      } catch(e) {}
      if (!exists) break;
      candidate++;
      window._ptfCodeSeq[seqKey] = candidate;
      code = make(candidate);
      attempts++;
    }
    return code + devTag;
  }
  var REG = {
    'PROD':['ptf_crm_products','cd','P',function(n){return 'P-'+n}],
    'P':['ptf_crm_products','cd','P',function(n){return 'P-'+n}],
    'PRODUCT':['ptf_crm_products','cd','P',function(n){return 'P-'+n}],
    'RFQ':['ptf_crm_rfqs','cd','RFQ',function(n){return 'RFQ-'+n}],
    'TO':['ptf_crm_offers','no','TO',function(n){return typeof offerSerial==='function'?offerSerial('TO'):'PTF-TO-'+(typeof faYear==='function'?faYear():'1404')+'-'+String(n).padStart(4,'0')}],
    'CO':['ptf_crm_offers','no','CO',function(n){return typeof offerSerial==='function'?offerSerial('CO'):'PTF-CO-'+(typeof faYear==='function'?faYear():'1404')+'-'+String(n).padStart(4,'0')}],
    'TC':['ptf_crm_offers','no','TC',function(n){return typeof offerSerial==='function'?offerSerial('TC'):'PTF-TC-'+(typeof faYear==='function'?faYear():'1404')+'-'+String(n).padStart(4,'0')}],
    'CUST':['ptf_crm_customers','cd','CUST',function(n){return 'CUST-'+n}],
    'SUP':['ptf_crm_suppliers','cd','SUP',function(n){return 'SUP-'+n}],
    'IQI':['ptf_crm_inqitems','cd','IQI',function(n){return 'IQI-'+n}],
    'LEAD':['ptf_crm_leads','cd','LEAD',function(n){return 'LEAD-'+n}],
    'CHQ':['ptf_crm_cheques','cd','CHQ',function(n){return 'CHQ-'+n}],
    'REM':['ptf_crm_reminders','cd','REM',function(n){return 'REM-'+n}],
    'NTF':['ptf_crm_notifs','cd','NTF',function(n){return 'NTF-'+n}],
    'CMP':['ptf_crm_buycmp','id','CMP',function(n){return 'CMP-'+n}],
    'BQ':['ptf_crm_buyquotes','cd','BQ',function(n){return 'BQ-'+n}],
    'OPX':['ptf_crm_opex','cd','OPX',function(n){return 'OPX-'+n}],
    'PTX':['ptf_crm_petty','cd','PTX',function(n){return 'PTX-'+n}],
    'PTY':['ptf_crm_petty_tx','cd','PTY',function(n){return 'PTY-'+n}],
    'PPR':['ptf_crm_petty_periods','cd','PPR',function(n){return 'PPR-'+n}],
    'INV':['ptf_crm_invoices','cd','INV',function(n){return 'INV-'+n}],
    'PAY':['ptf_crm_payables','cd','PAY',function(n){return 'PAY-'+n}],
    'ADP':['ptf_crm_payables','cd','ADP',function(n){return 'ADP-'+n},['advance.payments']],
    'FSY':['ptf_crm_fiscal_snapshots','cd','FSY',function(n){return 'FSY-'+n}],
    'FAM':['ptf_crm_fiscal_snapshots','cd','FAM',function(n){return 'FAM-'+n}],
    'LET':['ptf_crm_letters','cd','LET',function(n){return 'LET-'+n}],
    'LTR':['ptf_crm_letters','cd','LTR',function(n){return 'LTR-'+n}],
    'DEAL':['ptf_crm_deals','cd','DEAL',function(n){return 'DEAL-'+n},['lossEvents','docs']],
    'FIN':['ptf_crm_finance','code','FIN',function(n){return 'FIN-'+n}],
    'LOS':['ptf_crm_deals','cd','LOS',function(n){return 'LOS-'+n},['lossEvents']],
    'DX':['ptf_crm_projects','cd','DX',function(n){return 'DX-'+n},['docs']],
    'PAC':['ptf_crm_projects','cd','PAC',function(n){return 'PAC-'+n},['docs']],
    'CST':['ptf_crm_buycmp','cd','CST',function(n){return 'CST-'+n},['events']],
    'SHP':['ptf_crm_projects','cd','SHP',function(n){return 'SHP-'+n},['docs']],
    'QC':['ptf_crm_projects','cd','QC',function(n){return 'QC-'+n},['docs']],
    'SHR':['ptf_crm_shareholders','cd','SHR',function(n){return 'SHR-'+n}],
    'SHT':['ptf_crm_sharetx','cd','SHT',function(n){return 'SHT-'+n}],
    'SND':['ptf_crm_smsbook','cd','SND',function(n){return 'SND-'+n}],
    'PB':['ptf_crm_smsbook','cd','PB',function(n){return 'PB-'+n}],
    'SFINV':['ptf_crm_supplier_finance','cd','SFINV',function(n){return 'SFINV-'+n}],
    'SFPAY':['ptf_crm_supplier_finance','cd','SFPAY',function(n){return 'SFPAY-'+n}],
    'SFOPEN':['ptf_crm_supplier_finance','cd','SFOPEN',function(n){return 'SFOPEN-'+n}],
    'SFADJ':['ptf_crm_supplier_finance','cd','SFADJ',function(n){return 'SFADJ-'+n}],
    'FOB':['ptf_crm_finance','cd','FOB',function(n){return 'FOB-'+n}],
    'FSCFG':['ptf_crm_finance','cd','FSCFG',function(n){return 'FSCFG-'+n}]
  };
  /* LOS/SHP/QC/PAC در دو منبع ذخیره می‌شوند — هر دو اسکن شود */
  var REG2 = {
    'LOS':['ptf_crm_projects','cd','LOS',function(n){return 'LOS-'+n},['lossEvents']],
    'SHP':['ptf_crm_projects','cd','SHP',function(n){return 'SHP-'+n},['docs']],

    'PAC':['ptf_crm_projects','cd','PAC',function(n){return 'PAC-'+n},['docs']]
  };
  if (REG[p]) {
    var r = REG[p];
    var result = genSeq(r[0], r[1], r[2], r[3], r[4]);
    if (REG2[p]) {
      var r2 = REG2[p];
      var max2 = deepScan(r2[0], r2[1], r2[2], r2[4]);
      var currentNum = extractNum(result.replace(/-D\d+$/, ''), r2[2]);
      if (max2 >= currentNum) {
        var seqKey2 = r2[2].toUpperCase();
        var newC = Math.max(max2 + 1, (window._ptfCodeSeq[seqKey2] || 0) + 1);
        window._ptfCodeSeq[seqKey2] = newC;
        result = r2[3](newC) + devTag;
      }
    }
    return result;
  }
  /* FALLBACK امن: هر prefix ناشناخته هم sequential از اسکن سراسری */
  var gMax = 0;

    var allKeys = ['ptf_crm_products','ptf_crm_rfqs','ptf_crm_offers','ptf_crm_customers',

      'ptf_crm_reminders','ptf_crm_notifs','ptf_crm_buycmp','ptf_crm_buyquotes',

      'ptf_crm_sharetx','ptf_crm_smsbook','ptf_crm_supplier_finance'];

    });

  var seqKey = p;
  var candidate = Math.max(gMax + 1, (window._ptfCodeSeq[seqKey] || 0) + 1);
  window._ptfCodeSeq[seqKey] = candidate;
  return p + '-' + candidate + devTag;
};

window.ptfCalculateNetProfit = function(prjNo) {
  var p = getData('ptf_crm_projects').filter(function(x){return x.no===prjNo;})[0];
  if (!p) return;
  /* موتور واحد سود ریالی (ptfProjectProfitIRR در fx.js): درآمد فقط مبلغ ریالی فاکتور فروش است؛
     خرید ریالی/ارزی از فاکتور تأمین‌کننده محاسبه می‌شود. وصول فروش هرگز تسعیر نمی‌شود. */
  if (typeof ptfProjectProfitIRR !== 'function') { alert('ماژول ارزی بارگذاری نشده — صفحه را رفرش کنید'); return; }
  var r = ptfProjectProfitIRR(p);
  if (!r.ok) { alert(r.warnings.join('\n') || '⚠️ داده کافی برای محاسبه سود نیست.'); return; }
  if (!r.buyIrr && !r.buyPendingFx.length && !confirm('⚠️ قیمت خرید نهایی ثبت نشده — سود بدون هزینه خرید محاسبه شود؟')) return;
  var recordedCosts = (typeof prjCostTotal === 'function') ? prjCostTotal(p) : 0;
  var extra = prompt('اگر هزینه ثبت‌نشده‌ی دیگری خارج از سیستم دارید وارد کنید؛ در غیر این صورت 0 بزنید.\n(هزینه‌های ثبت‌شده پرونده به‌صورت خودکار لحاظ می‌شوند)', '0');
  var extraCost = +String(extra||'0').replace(/[^\d۰-۹٠-٩]/g,'').replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}) || 0;
  var shipCost = recordedCosts + extraCost;
  var netProfit = r.profit - extraCost;
  var pct = r.sellIrr > 0 ? Math.round(netProfit * 100 / r.sellIrr) : 0;
  var warnHtml = r.warnings.length
    ? '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:8px 12px;font-size:12px;color:#b91c1c;margin-bottom:10px;line-height:1.9">' + r.warnings.map(function(w){return escP(w);}).join('<br>') + '</div>'
    : '';
  var reliableTag = (r.complete && !r.buyPendingFx.length)
    ? '<span class="bd" style="background:#d1fae5;color:#065f46">✅ همه اجزا قطعی — قابل اتکا</span>'
    : '<span class="bd" style="background:#fef3c7;color:#b45309">⚠️ ناقص — اجزای نامشخص در هشدارها</span>';
  var html = '<div class="md-b" style="display:grid;z-index:1800" onclick="if(event.target===this)this.remove()"><div class="md" style="max-width:560px">' +
    '<h3>💰 محاسبه‌گر سود خالص پروژه (مدیریت) ' + reliableTag + '</h3>' +
    warnHtml +
    '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;font-size:13px;color:#166534;margin-bottom:14px;line-height:2">' +
    '<b>فروش ریالی واقعی:</b> ' + r.sellIrr.toLocaleString('fa-IR') + ' ریال <small style="color:#4d7c0f">(' + escP(r.sellSrc) + ')</small><br>' +
    '<b>هزینه تأمین و خرید (ریالی‌شده):</b> ' + r.buyIrr.toLocaleString('fa-IR') + ' ریال' + (r.buyItems ? ' <small style="color:#4d7c0f">(' + r.buyItems + ' قلم)</small>' : '') + '<br>' +
    '<b>هزینه‌های ثبت‌شده پرونده:</b> ' + recordedCosts.toLocaleString('fa-IR') + ' ریال' + (extraCost ? ' <small style="color:#92400e">+ هزینه ثبت‌نشده اعلامی: ' + extraCost.toLocaleString('fa-IR') + ' ریال</small>' : '') + '<hr style="border:none;border-top:1px dashed #86efac;margin:8px 0">' +
    '<b style="font-size:15px;color:' + (netProfit >= 0 ? '#15803d' : '#dc2626') + '">سود خالص (ریال واقعی): ' + netProfit.toLocaleString('fa-IR') + ' ریال (' + pct + '٪)</b></div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end">' +
    '<button class="bt bt-o" onclick="this.closest(&quot;.md-b&quot;).remove()">بستن</button>' +
    '<button class="bt" style="background:#059669" onclick="alert(&quot;✅ سود خالص ' + pct + '٪ تایید شد&quot;);this.closest(&quot;.md-b&quot;).remove();">🏆 تأیید سود</button></div></div></div>';
  document.getElementById('panels').insertAdjacentHTML('beforeend', html);
};

// استانداردسازی ایمپورت اکسل کالاها طبق دستورالعمل US-120 (ستون A=شرح، B=واحد، C=قیمت، D=دسته، E=مدل)
window.ptfStandardImportProdXls = function(inp) {
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  
  var rd = new FileReader();
  rd.onload = function(e) {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
      if (!rows || rows.length < 2) { alert('فایل اکسل خالی یا فاقد اطلاعات کالا است'); return; }
      
      var prods = getData('ptf_crm_products');
      var added = 0;
      
      for (var r=1; r<rows.length; r++) {
        var row = rows[r];
        var desc = String(row[0] || '').trim(); // ستون A = شرح کالا
        if (!desc || desc === '-' || /^\d+$/.test(desc)) continue; // نادیده گرفتن ردیف خالی یا شماره ردیف
        
        var un = String(row[1] || 'عدد').trim() || 'عدد'; // ستون B = واحد
        var pr = +String(row[2] || '0').replace(/[^\d.]/g,'') || 0; // ستون C = قیمت
        var ca = String(row[3] || 'سایر').trim() || 'سایر'; // ستون D = دسته
        var st = String(row[4] || '-').trim() || '-'; // ستون E = مشخصه
        /* v15.9 (US-389): ستون‌های اختیاری جدید — F=برند، G=مدل + دسته همیشه فارسی استاندارد */
        var br = String(row[5] || '').trim();
        var md = String(row[6] || '').trim();
        if (typeof ptfNormCat === 'function') ca = ptfNormCat(ca);
        var cd = window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1001 + prods.length);
        prods.push({ cd: cd, nm: desc, en: '', ca: ca, st: st, br: br, md: md, un: un, pr: pr, ds: 'ورود اکسل استاندارد US-120', ts: new Date().toISOString() });
        added++;
      }
      
      /* v34.8.32 (W1-iterate) */
      if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', prods, { reason: 'excel-std' });
      else setData('ptf_crm_products', prods);
      renderProducts();
      alert('✅ تعداد ' + added + ' کالا طبق دستورالعمل استاندارد US-120 با کدهای مینیمال وارد سیستم شد.');
      if (typeof audit === 'function') audit('کالاها', 'ورود اکسل استاندارد ' + added + ' کالا', '');
    } catch(err) {
      alert('❌ خطا در خواندن فایل اکسل: ' + err.message);
    }
  };
  rd.readAsArrayBuffer(f);
};

// ورود اکسل استاندارد مشتریان (CUST) طبق US-120
window.ptfStandardImportCustXls = function(inp) {
  /* v122.2 (US-280): ورود اکسل کامل مشتریان — تفکیک موبایل/ثابت، چند رابط (ردیف تکراری)، چند شماره با /، فیلدهای اختیاری آدرس/شناسه ملی/وب/وندور */
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  var rd = new FileReader();
  rd.onload = function() {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
      if (!rows || rows.length < 2) { alert('فایل خالی است یا فقط سرستون دارد'); return; }
      var custs = getData('ptf_crm_customers');
      var added = 0, merged = 0;
      var byName = {};
      custs.forEach(function(c){ byName[String(c.co||'').trim()] = c; });
      for (var r = 1; r < rows.length; r++) {
        var R = rows[r] || [];
        var co = String(R[0]||'').trim();
        if (!co) continue;
        var person = ptfXlsPerson(R[2], R[3], R[5], R[6]); // C=رابط D=موبایل F=ثابت G=سمت
        var rec = byName[co];
        if (rec) {
          // مشتری موجود → فقط رابط جدید اضافه شود
          if (person) {
            rec.people = rec.people || [];
            var dupP = rec.people.some(function(p){ return p.nm === person.nm; });
            if (!dupP) { rec.people.push(person); merged++; }
          }
          // فیلدهای خالی رکورد موجود از اکسل پر شوند (بدون بازنویسی داده موجود)
          if (!rec.ind && R[1]) rec.ind = String(R[1]).trim();
          if (!rec.coAddr && R[8]) rec.coAddr = String(R[8]).trim();
          if (!rec.natId && R[9]) rec.natId = String(R[9]).trim();
          if (!rec.coWeb && R[10]) rec.coWeb = String(R[10]).trim();
          if (!rec.venNo && R[11]) rec.venNo = String(R[11]).trim();
          if (!rec.coEn && R[12]) rec.coEn = String(R[12]).trim();
          if ((!rec.coTels || !rec.coTels.length) && R[7]) rec.coTels = [{ n: String(R[7]).trim(), ext: '', lb: 'تلفنخانه' }];
          if ((rec.venSt||'unreg') === 'unreg' && R[4]) rec.venSt = ptfXlsVenSt(R[4]);
          if (!rec.con && person) rec.con = person.nm;
          if (!rec.ph && person) rec.ph = (person.mobs[0]||person.tels[0]||{}).n || '';
        } else {
          rec = {
            cd: (typeof genCode === 'function' ? genCode('CUST') : 'CUST-' + (1001 + custs.length)),
            co: co, kind: 'حقوقی',
            ind: String(R[1]||'نفت و گاز').trim(),
            venSt: ptfXlsVenSt(R[4]),
            venNo: String(R[11]||'').trim(),
            coTels: R[7] ? [{ n: String(R[7]).trim(), ext: '', lb: 'تلفنخانه' }] : [],
            coAddr: String(R[8]||'').trim(),
            natId: String(R[9]||'').trim(),
            coWeb: String(R[10]||'').trim(),
            coEn: String(R[12]||'').trim(),
            people: person ? [person] : [],
            phones: [],
            ts: new Date().toISOString()
          };
          if (person) { rec.con = person.nm; rec.ph = (person.mobs[0]||person.tels[0]||{}).n || ''; person.primary = true; }
          if (typeof dedupStamp === 'function') dedupStamp(rec);
          custs.unshift(rec);
          byName[co] = rec;
          added++;
        }
      }
      if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_customers', custs, { reason: 'excel-import', maxOps: 40 });
      else setData('ptf_crm_customers', custs);
      if (typeof renderCustomers === 'function') renderCustomers();
      alert('✅ ' + added + ' مشتری جدید وارد شد' + (merged ? ' و ' + merged + ' رابط به مشتریان موجود اضافه شد' : '') + ' (دستورالعمل US-280).');
    } catch(e) { alert('❌ خطا در خواندن فایل اکسل: ' + e.message); }
  };
  rd.readAsArrayBuffer(f);
};

/* v122.2: ابزارهای مشترک ورود اکسل — تفکیک موبایل/ثابت و چند شماره با / و داخلی بعد از خط تیره */
window.ptfXlsPhones = function(cell, isMob) {
  return String(cell||'').split(/[\/,،;؛|]+/).map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){
    if (isMob) return { n: x, lb: '' };
    var m = x.match(/^(.*?)[\s]*-[\s]*(\d{1,5})$/); // 02188xxxxxx-124 → شماره + داخلی
    return m && m[1].replace(/\D/g,'').length >= 5 ? { n: m[1].trim(), ext: m[2], lb: '' } : { n: x, ext: '', lb: '' };
  });
};
window.ptfXlsPerson = function(nm, mobCell, telCell, role) {
  var name = String(nm||'').trim();
  var mobs = ptfXlsPhones(mobCell, true);
  var tels = ptfXlsPhones(telCell, false);
  if (!name && !mobs.length && !tels.length) return null;
  return { nm: name || 'رابط', nmEn: '', role: String(role||'رابط اصلی').trim() || 'رابط اصلی', dept: '', tels: tels, mobs: mobs, primary: false };
};
window.ptfXlsVenSt = function(cell) {
  var v = String(cell||'').trim().toLowerCase();
  if (!v) return 'unreg';
  if (v === 'approved' || v.indexOf('تایید') > -1 || v.indexOf('تأیید') > -1) return 'approved';
  if (v === 'pending' || v.indexOf('بررسی') > -1) return 'pending';
  return 'unreg';
};

  };

/* v34.8.34 (T3-1 عملیاتی + فیکس نمایش): خواندن سرور-محور با گاردهای مطمئن —

    /* نبود توکن داخل DataLayer خطای no_token می‌دهد → همین‌جا fallback؛ حداکثر ۲ retry */
    if (prodServerPage.fails >= 2) {
      prodServerPage.fails = 0; prodServerReadOn._offOnce = true;
      if (typeof ptfToast === 'function') ptfToast('خواندن سروری در دسترس نیست — نمایش محلی', 'warn');

    }

    tb.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:26px">⏳ در حال دریافت از سرور…</td></tr>';
    var opts = { page: prodServerPage.page, pageSize: 100, sortBy: sort.key === 'pr' ? 'pr' : (sort.key || 'cd'), sortDir: sort.dir === -1 ? 'desc' : 'asc' };
    if (q) opts.q = q;
    window.ptfCollectionQuery('ptf_crm_products', opts, function (d) {
      prodServerPage.loading = false;
      if (d && d.ok) {
        /* v34.8.34 (HOTFIX ROOT-CAUSE): سرور ممکن است هنوز این داده را نداشته باشد

        var localCount = (getData('ptf_crm_products') || []).length;

        prodServerPage.rows = d.rows || [];

        prodServerPage.totalPages = d.pages || 1;
        renderProducts();
      } else { renderProducts(); }
    });
    return;
  }
  var list = prodServerPage.rows;
  var fc2 = ((document.getElementById('pFcat')||{}).value || '');
  if (fc2 && fc2 !== 'همه') {
    list = list.filter(function (p2) { var ca2 = (typeof ptfNormCat==='function'?ptfNormCat(p2.ca):p2.ca); return ca2 === fc2; });

    window.ptfReasonedDelete('PRODUCT_BATCH', checked.length + ' کالا', 'حذف دسته‌جمعی ' + checked.length + ' کالا', function() {
      var items = getData('ptf_crm_products').filter(function(p) { return checked.indexOf(p.cd) < 0; });
      /* v34.8.32 (W1-iterate): حذف دسته‌جمعی = فرمان‌های tombstone بازیافت‌پذیر */
      if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', items, { reason: 'prod-batch-del' });

    var items = getData('ptf_crm_products').filter(function(p) { return checked.indexOf(p.cd) < 0; });

function saveProd(isEdit) {
  var cd = document.getElementById('nPCd').value.trim().toUpperCase();
  var nm = document.getElementById('nPNm').value.trim();
  var un = document.getElementById('nPUn').value;
  // US-143 AC3: شرح و واحد اجباری
  if (!nm) { alert('شرح کالا الزامی است'); return; }
  if (!un) { alert('واحد کالا الزامی است'); return; }
  // US-143 AC2: واحد باید هم‌زبان شرح باشد
  var nmEn = prodIsEnglish(nm);
  var unEn = PROD_UNITS_EN.indexOf(un) > -1;
  if (nmEn && !unEn) { alert('⚠️ شرح کالا انگلیسی است — واحد هم باید انگلیسی باشد (No / PCS / Set / ...)'); return; }
  if (!nmEn && unEn) { alert('⚠️ شرح کالا فارسی است — واحد هم باید فارسی باشد (عدد / شاخه / متر / ...)'); return; }
  var items = getData('ptf_crm_products');
  if (!isEdit) {
    if (!cd) cd = prodAutoCode();
    /* v31.7.20 BUG-CODE-DUP-002: تلاش محدود قبلی فقط ۱ بار regen می‌کرد و اگر باز تکراری بود بی‌صدا ادامه می‌داد */
    var _pTry = 0;
    while (items.some(function (x) { return x && x.cd === cd; }) && _pTry < 5) { cd = prodAutoCode(); _pTry++; }
    if (items.some(function (x) { return x && x.cd === cd; })) {
      alert('⛔ کد کالای تولیدی ' + cd + ' تکراری است — لطفاً صفحه را رفرش کنید و دوباره تلاش کنید.');
      try { audit('سیستم', '⛔ جلوگیری از ثبت کالا با کد تکراری ' + cd + ' (BUG-CODE-DUP-002)', cd); } catch (eA2) {}
      return;
    }
  }
  var rec = {cd:cd, nm:nm,
    en: document.getElementById('nPEn').value.trim(),
    ca: document.getElementById('nPCa').value,
    st: document.getElementById('nPSt').value.trim(),
    br: document.getElementById('nPBr').value.trim(),
    md: (document.getElementById('nPMd')||{value:''}).value.trim(), /* v15.9 US-389: مدل */
    un: document.getElementById('nPUn').value,
    pr: +document.getElementById('nPPr').value || 0,
    prCur: (document.getElementById('nPPrCur')||{value:'IRR'}).value || 'IRR', /* v15.6 US-387 */
    ds: document.getElementById('nPDs').value.trim(),
    ts: new Date().toISOString()};
  // US-174: جلوگیری از ثبت کالای تکراری (شرح / نام انگلیسی)
  if (typeof ptfDupBlock === 'function' && ptfDupBlock('product', rec, isEdit ? cd : null)) return;
  rec.ca = (typeof ptfNormCat === 'function') ? ptfNormCat(rec.ca) : rec.ca; /* v15.9: دسته همیشه فارسی استاندارد */
  if (isEdit) {
    for (var i=0;i<items.length;i++) if (items[i].cd===cd) { rec.ts0=items[i].ts0||items[i].ts; rec.crAt=items[i].crAt; rec.crBy=items[i].crBy; rec.tp=items[i].tp; rec.srcInq=items[i].srcInq; rec.hidden=items[i].hidden; rec.prCur=rec.prCur||items[i].prCur; rec.refPriceAt=items[i].refPriceAt; rec.refPriceSrc=items[i].refPriceSrc; items[i]=rec; }
  } else { rec.ts0=rec.ts; if (typeof dedupStamp === 'function') dedupStamp(rec); items.push(rec); }
  /* v34.8.32 (W1): ثبت/ویرایش کالا با فرمان اتمیک سروری. */
  if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', items, { reason: 'saveProduct' });
  else setData('ptf_crm_products', items);
  hideModal(); renderProducts();
  addLog('کالا '+cd+(isEdit?' ویرایش':' ثبت')+' شد');
}

function importProdCsv(inp) {
  var f = inp.files[0]; if (!f) return;
  var isXlsx = /\.xlsx?$/i.test(f.name);
  // US-124 AC1: برچسب شماره درخواست (اختیاری)
  var inqNo = prompt('این کالاها مربوط به کدام درخواست است؟\n(شماره Inquiry را وارد کنید؛ اگر مربوط به درخواست خاصی نیست خالی بگذارید)', '');
  inqNo = (inqNo || '').trim();
  var done = function(rows) { // rows = آرایه آرایه‌ها شامل هدر
    if (!rows || rows.length < 2) { alert('فایل خالی یا نامعتبر است'); return; }
    var head = rows[0].map(function(h){ return String(h||'').toLowerCase(); });
    var find = function(cands){ for (var i=0;i<head.length;i++) for (var j=0;j<cands.length;j++) if (head[i].indexOf(cands[j])>-1) return i; return -1; };
    var m = { cd:find(['کد','code']), nm:find(['نام کالا','نام','name']), en:find(['انگلیسی','english','en']),
      ca:find(['دسته','category','cat']), st:find(['استاندارد','گرید','standard','grade']), br:find(['برند','brand']),
      un:find(['واحد','unit']), pr:find(['قیمت','price']), ds:find(['توضیح','desc']) };
    if (m.cd < 0) m.cd = 0;
    if (m.nm < 0) m.nm = 1;
    var items = getData('ptf_crm_products');
    var added=0, skipped=0;
    for (var i=1;i<rows.length;i++){
      var c = rows[i];
      var g = function(k){ return m[k]>-1 && c[m[k]]!=null ? String(c[m[k]]).trim() : ''; };
      var cdRaw = g('cd');
      var nmRaw = g('nm') || cdRaw;
      var cd = cdRaw.toUpperCase();
      // Sprint 112 / US-116: اگر کد معتبر نبود یا عدد ساده اکسلی (۱، ۲، ۳) بود، کد مینیمال یکتا بساز
      if (!cd || !/^[A-Z0-9_-]{3,30}$/.test(cd) || /^\d{1,3}$/.test(cd)) {
        cd = window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1000 + items.length + 1);
      }
      var dup=false; for (var j=0;j<items.length;j++) if (items[j].cd===cd) dup=true;
      if (dup) { cd = (window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1000 + items.length + Math.floor(Math.random()*900))); }
      var qty = 1, un = g('un')||'عدد';
      var qi = find(['تعداد','qty','quantity','مقدار']);
      if (qi > -1 && c[qi] != null) qty = +String(c[qi]).replace(/[^\d.]/g,'') || 1;
      items.push({cd:cd,nm:g('nm')||cd,en:g('en'),ca:g('ca')||'سایر',st:g('st'),br:g('br'),un:un,
        pr:+String(g('pr')).replace(/[^\d.]/g,'')||0,ds:g('ds'),inqNo:inqNo||'',
        ts:new Date().toISOString(),ts0:new Date().toISOString()});
      if (inqNo) {
        var iq = getData('ptf_crm_inqitems');
        iq.push({inqNo:inqNo, cd:cd, nm:g('nm')||cd, en:g('en'), qty:qty, un:un, st:g('st'), t:new Date().toLocaleDateString('fa-IR')});
        if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_inqitems', iq, { reason: 'w2' }); else setData('ptf_crm_inqitems', iq);
      }
      added++;
    }
    /* v34.8.32 (W1-iterate) */
    if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', items, { reason: 'quick-import' });
    else setData('ptf_crm_products', items);
    renderProducts();
    alert('✅ '+added+' کالا اضافه شد'+(inqNo?' و به درخواست '+inqNo+' متصل شد':'')+(skipped?' | '+skipped+' ردیف رد شد':''));
    addLog('ایمپورت '+(isXlsx?'Excel':'CSV')+' کالا: '+added+' ردیف'+(inqNo?' (درخواست '+inqNo+')':''));
  };
  var rd = new FileReader();
  if (isXlsx && typeof XLSX !== 'undefined') {
    rd.onload = function(){
      try {
        var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
        done(rows);
      } catch(e) { alert('خطا در خواندن فایل اکسل: '+e.message); }
    };
    rd.readAsArrayBuffer(f);
  } else {
    rd.onload = function(){
      var lines = rd.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(l){return l.trim()});
      var rows = lines.map(function(l){ return (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(function(x){return x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"')}); });
      done(rows);
    };
    rd.readAsText(f,'utf-8');
  }
  inp.value='';
}

/* v34.9.2: نام دوگانهٔ مشتری (فارسی + انگلیسی) برای همهٔ ماژول‌ها */
function ptfCustDualName(c) {
  if (!c) return '';
  var fa = String(c.co || c.name || '').trim();
  var en = String(c.coEn || '').trim();
  if (fa && en && fa !== en) return fa + ' (' + en + ')';
  return fa || en || '';
}
function ptfCustEnByCd(cd) {
  try {
    var c = getData('ptf_crm_customers').filter(function (x) { return x && x.cd === cd; })[0];
    return (c && c.coEn) || '';
  } catch (e) { return ''; }
}
/* v34.18.0 (DUAL-NAME-LISTS): نام دوگانه در فهرست‌ها — فارسی بالا + انگلیسی زیر هم.
   رجیستری خریدار در پیشنهادات/پرونده‌ها به‌طور تاریخی نام انگلیسی (coEn) را در buyerCo
   ذخیره می‌کند؛ این حل‌گرها از cd (و در نبود cd از تطبیق نام) نام فارسی زندهٔ مشتری
   را برمی‌گردانند تا فهرست‌ها هم‌شکل فهرست مشتریان شوند. */
function ptfCustFaByCd(cd) {
  try {
    var c = getData('ptf_crm_customers').filter(function (x) { return x && x.cd === cd; })[0];
    return (c && String(c.co || c.name || '').trim()) || '';
  } catch (e) { return ''; }
}
function ptfCustFaByEn(en) { /* تطبیق نام انگلیسی ذخیره‌شده با coEn مشتری (نبود cd — مثل پرونده‌های فروش) */
  try {
    var k = String(en || '').trim().toLowerCase(); if (!k) return '';
    var c = getData('ptf_crm_customers').filter(function (x) {
      var e1 = String((x && x.coEn) || '').trim().toLowerCase();
      return !!e1 && (e1 === k || String((x && x.co) || '').trim().toLowerCase() === k);
    })[0];
    return (c && String(c.co || '').trim()) || '';
  } catch (e) { return ''; }
}
function ptfCustNamePair(cd, storedName) { /* {fa, en} — اولویت دادهٔ زنده از cd */
  var en = String(storedName || '').trim();
  var fa = '';
  if (cd) { fa = ptfCustFaByCd(cd); var live = ptfCustEnByCd(cd); if (live) en = live; }
  if (!fa && en) fa = ptfCustFaByEn(en);
  return { fa: fa || en || '', en: en };
}
function ptfCustCellHtml(fa, en, cd) { /* سلول هم‌شکل فهرست مشتریان: بولد فارسی + کوچک ltr انگلیسی + cd */
  var h = '<b>' + escP(fa || en || '-') + '</b>';
  var e2 = String(en || '').trim();
  if (e2 && e2 !== fa) h += '<div style="font-size:10.5px;color:#64748b" dir="ltr">' + escP(e2) + '</div>';
  if (cd) h += '<div style="font-size:10.5px;color:#94a3b8" dir="ltr">' + escP(cd) + '</div>';
  return h;

/* v34.9.2 (RCA پایین‌ بودن مشتری جدید): ترتیب نمایش = جدیدترین اول (بر اساس شمارهٔ کد؛
   پایدار برای رکوردهای قدیمی بدون تاریخ). */
function ptfCustSortNewest(list) {
  function seq(x) { var m = String(x && x.cd || '').match(/(\d+)(?!.*\d)/); return m ? +m[1] : -1; }
  function ts(x) { var t = String(x && (x.createdAtISO || x.crAt) || ''); return t; }
  return (list || []).slice().sort(function (a, b) {
    var ta = ts(a), tb2 = ts(b);
    if (ta && tb2 && ta !== tb2) return ta < tb2 ? 1 : -1; /* ISO نزولی */
    var qa = seq(a), qb = seq(b);
    if (qa >= 0 && qb >= 0 && qa !== qb) return qb - qa;
    return 0;
  });
}

  });

// v101.2: تست واقعی AI بدون cache + نمایش تشخیصی امن transport
function ptfLlmTransportHtml(t) {
  if (!t || typeof t !== 'object') return '';
  var rows = [];
  if (t.host) rows.push('میزبان: <b dir="ltr">' + escP(t.host) + '</b>');
  if (t.curl_errno != null) rows.push('cURL errno: <b dir="ltr">' + escP(String(t.curl_errno)) + '</b>');
  if (t.curl_error) rows.push('cURL error: <span dir="ltr">' + escP(t.curl_error) + '</span>');
  if (t.ip_mode) rows.push('IP mode: <b dir="ltr">' + escP(t.ip_mode) + '</b>');
  if (t.namelookup_ms != null || t.connect_ms != null || t.total_ms != null) rows.push('زمان‌ها: DNS ' + escP(String(t.namelookup_ms || 0)) + 'ms | Connect ' + escP(String(t.connect_ms || 0)) + 'ms | Total ' + escP(String(t.total_ms || 0)) + 'ms');
  if (t.ssl_verify_result != null) rows.push('TLS verify result: <b dir="ltr">' + escP(String(t.ssl_verify_result)) + '</b>');
  if (!rows.length) return '';
  return '<div style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:7px;padding:7px;margin-top:7px;font-size:10.5px;line-height:1.8;color:#475569"><b>جزئیات امن ارتباط هاست</b><br>' + rows.join('<br>') + '</div>';
}

function hideModal() {
  /* v16.2 (BUG-017): فقط آخرین مودال «قابل‌مشاهده» بسته شود —
     پنجره‌های مینیمایزشده (display:none در body — modalx) هرگز قربانی نشوند */
  var modals = document.querySelectorAll('.md-b');
  for (var i = modals.length - 1; i >= 0; i--) {
    if ((modals[i].style || {}).display !== 'none') { modals[i].remove(); return; }
  }
}

function saveRfq() {
  var comp = document.getElementById('nRComp').value.trim();
  if (!comp) { (window.ptfDlgAlert || alert)('نام شرکت را وارد کنید', { icon: '⚠️', title: 'اعتبارسنجی فرم' }); return; } /* v16.4 US-372 */
  var cat = document.getElementById('nRCat').value;
  var con = document.getElementById('nRCon').value.trim();
  var rfqs = getData('ptf_crm_rfqs');
  
  var dup = rfqs.filter(function(r) {
    return r.co && r.co.trim() === comp && (r.ca === cat || (r.con && r.con.trim() === con));
  })[0];
  if (dup) {
    if (!confirm('⛔ هشدار ضدتکرار استعلام:\n\nاز شرکت «' + comp + '» در حوزه «' + (dup.ca||'-') + '» قبلاً استعلام شماره ' + dup.cd + ' در تاریخ ' + (dup.dt||'—') + ' ثبت شده است.\n\nآیا اطمینان دارید که این یک درخواست کاملاً جدید و مستقل است (نه تکراری)؟')) {
      return;
    }
  }

  var cd = genCode('RFQ');
  if (/^TMP-RFQ-/.test(String(cd || ''))) { alert('⛔ شماره رسمی درخواست از سرور دریافت نشده است. اتصال/ورود را برقرار کنید و دوباره تلاش کنید.'); return; }
  /* v31.7.20 BUG-CODE-DUP-002 (گزارش کارفرما): اگر کد تولیدی قبلاً وجود دارد (pool کهنه/counter عقب)،
     تا ۵ بار کد بعدی گرفته می‌شود؛ در نهایت اگر باز تکراری بود ثبت مسدود می‌شود — نه ادغام بی‌صدا. */
  var _dupTry = 0;
  while (rfqs.some(function (r) { return r && r.cd === cd; }) && _dupTry < 5) { cd = genCode('RFQ'); _dupTry++; }
  if (rfqs.some(function (r) { return r && r.cd === cd; })) {
    alert('⛔ کد تولیدی ' + cd + ' تکراری است — شمارنده سرور نیاز به همگام‌سازی دارد. لطفاً یک‌بار صفحه را رفرش کنید و دوباره تلاش کنید.');
    try { audit('سیستم', '⛔ جلوگیری از ثبت درخواست با کد تکراری ' + cd + ' (BUG-CODE-DUP-002)', cd); } catch (eA) {}
    return;
  }
  var recSimple = {cd:cd, co:comp, con:con, ca:cat, st:'st1', stxt:'🔴 دریافت اولیه', dt:new Date().toLocaleDateString('fa-IR')};
  if (typeof dedupStamp === 'function') dedupStamp(recSimple); /* v21.5 US-411ف1 */
  rfqs.unshift(recSimple);
  if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_rfqs', rfqs, { reason: 'w2' }); else setData('ptf_crm_rfqs', rfqs);
  hideModal();
  renderRfq();
  addLog('استعلام ' + cd + ' ثبت شد');

  /* ===== v34.1 US-SMS-RFQ: اطلاع‌رسانی پیامکی به مشتری هنگام ثبت درخواست ===== */
  try {
    var _rfqCust = getData('ptf_crm_customers').filter(function (x) { return x.co && x.co.trim() === comp; })[0];
    if (_rfqCust && typeof window.ptfSmsNotifyDialog === 'function') {
      var _rfqSmsTxt = 'پیشرو تجهیز فرتاک\n' +
        'درخواست شما با شماره ' + cd + ' در تاریخ ' + recSimple.dt + ' ثبت شد.\n' +
        'کارشناسان ما در اسرع وقت بررسی و نتیجه را اعلام خواهند کرد.\n' +
        '021-46087679\npishtaj.ir';
      window.ptfSmsNotifyDialog(_rfqCust, _rfqSmsTxt, 'ثبت درخواست ' + cd);
    }
  } catch (eRfqSms) {}

  /* US-303 (مصوب تیم متخصصان): بلافاصله ویرایشگر اقلام باز شود — ورود دستی/اکسل/دستیار
     تا «بارگذاری از درخواست» در TO/CO/TC واقعا کارا باشد */
  if (typeof ptfOpenFullInqEditor === 'function') {
    setTimeout(function () { ptfOpenFullInqEditor(cd); }, 250);
  }
}
