<style id="ptfCriticalTheme">
  :root { --bg: #f7f8fa; --brd: #e8ebf0; --pri: #ef4b1a; --org: #f79400; --crd: #fff; --tx: #1e293b; --sb: #fff; }
  body { background: var(--bg); color: var(--tx); }
  .sb { background: var(--sb); border-left: 1px solid var(--brd); }
  /* ===== v31.7.17 BUG-FOUC-001: تم قدیمی قبل از تم اصلی فلش می‌زد =====
     ریشه: theme.js و mobilenav.js انتهای body لود می‌شوند؛ CSS بحرانی پوسته باید در head باشد. */
  @font-face{font-family:'Vazirmatn';src:url('../assets/fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:100 500;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('../assets/fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:600 900;font-display:swap}
  *{font-family:'Vazirmatn','B Nazanin','BNazanin',Vazirmatn,Tahoma,sans-serif}
  .sb{box-shadow:0 0 20px rgba(15,23,42,.05)}
  .sb-n .sb-i{color:#475569}
  .sb-i.act{background:linear-gradient(90deg,rgba(239,75,26,.10),rgba(247,148,0,.05));color:#c2410c;box-shadow:inset -3px 0 0 var(--pri)}
  .pn{border:1px solid var(--brd);box-shadow:0 1px 3px rgba(15,23,42,.04)}
  html{overflow-y:scroll;scrollbar-gutter:stable}
  /* موبایل: سایدبار از همان فریم اول مخفی — دیگر فلشِ ستون ایموجی‌ها دیده نمی‌شود */
  @media(max-width:768px){
    .sb{display:none!important}
    .mn{margin-right:0!important;width:100%!important;max-width:100%!important}
    .ca{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
  }

/* ============ Sprint 108 / US-112: انقلابی در تجربه موبایل (Mobile Data Card View & Native PWA Feel) ============ */
@media (max-width: 768px) {
  body { font-size: 14px !important; background: var(--bg, #f1f5f9) !important; } /* US-285: رنگ متغیر — حالت شب موبایل */
  .btn, .bt, .bt-o, .btn-l, button {
    min-height: 46px !important;
    font-size: 14px !important;
    padding: 10px 14px !important;
    border-radius: 12px !important;
  }
  /* US-285: فیلدهای ورودی ۱۶px — جلوگیری از زوم خودکار iOS هنگام فوکوس */
  select, textarea, input[type="text"], input[type="number"], input[type="password"], input[type="email"], input[type="date"], input[type="search"] {
    min-height: 46px !important;
    font-size: 16px !important;
    padding: 10px 14px !important;
    border-radius: 12px !important;
  }
  
  /* تبدیل ردیف‌های جدول به کارت‌های اطلاعاتی مستقل لمسی (Card Transformation) */
  .tb2 table, .tb2 thead, .tb2 tbody, .tb2 th, .tb2 td, .tb2 tr {
    display: block !important;
    width: 100% !important;
  }
  .tb2 thead tr {
    position: absolute !important;
    top: -9999px !important;
    left: -9999px !important;
  }
  .tb2 tr {
    background: var(--crd, #fff) !important; /* US-285 */
    border: 1px solid var(--brd) !important;
    border-radius: 18px !important;
    margin-bottom: 14px !important;
    padding: 14px !important;
    box-shadow: 0 6px 20px rgba(0,0,0,.06) !important;
    position: relative !important;
  }
  .tb2 td {
    border: none !important;
    border-bottom: 1px dashed var(--brd, #e2e8f0) !important; /* US-285 */
    position: relative !important;
    padding: 10px 0 !important;
    text-align: left !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    font-size: 13px !important;
  }
  .tb2 td:last-child {
    border-bottom: none !important;
    justify-content: flex-end !important;
    gap: 10px !important;
    padding-top: 14px !important;
    margin-top: 4px !important;
    border-top: 1px solid var(--brd) !important;
  }
  
  /* بهبود نمایش سایدبار و ناوبری در موبایل */
  /* crm-l normal */
  /* sb 56px kept */
  .mn { padding: 10px !important; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; }
  .md, .ptfdlg-b .md {
    width: 96% !important;
    max-width: 96vw !important;
    max-height: 88vh !important;
    margin: 10px auto !important;
    padding: 18px !important;
    border-radius: 20px !important;
  }
  .ph { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
  /* v13.7 (US-337): یکسان‌سازی دکمه‌های مودال در موبایل — سهولت کاربری */
  .md { padding-top: 44px !important; } /* جا برای دکمه‌های مک */
  .mx-dots { top: 14px !important; left: 12px !important; }
  /* v20.0 BUG-033: چیپ بیضی mx-ai حذف شد — دستیار = نقطه چهارم mx-dot.a (بدون تداخل) */
  .md .fr { grid-template-columns: 1fr !important; } /* فرم‌های دوستونه → تک‌ستون در موبایل */
  .md h3 { font-size: 15px !important; padding-left: 72px !important; } /* تیتر زیر دکمه‌ها نرود */
  /* ردیف دکمه‌های پایین مودال: تمام‌عرض و زیر هم */
  .md > div[style*="justify-content:flex-end"], .md > div[style*="justify-content: flex-end"] {
    flex-direction: column-reverse !important; align-items: stretch !important; gap: 8px !important;
  }
  .md > div[style*="justify-content:flex-end"] .bt, .md > div[style*="justify-content: flex-end"] .bt {
    width: 100% !important; justify-content: center !important; text-align: center !important;
  }
  .sb2 { width: 100% !important; display: flex !important; flex-direction: column !important; gap: 10px !important; }
  .sb2 input, .sb2 select, .sb2 button { width: 100% !important; }
}


  /* ============ Sprint 111: مینیمالیسم مطلق سایدبار موبایل (بدون نوشته، بدون اسکرول افقی و متمایز از زیرمجموعه‌ها) ============ */
  @media (max-width: 768px) {
    /* ۱. تثبیت عرض سایدبار روی ۵۶ پیکسل؛ مهار اسکرول افقی و جابجایی محتوا */
    .sb {
      width: 56px !important; min-width: 56px !important; max-width: 56px !important;
      overflow-x: hidden !important; overflow-y: auto !important;
      touch-action: pan-y !important; border-left: 1px solid var(--brd) !important;
    }
    .sb * { max-width: 56px !important; overflow-x: hidden !important; white-space: nowrap !important; }
    
    /* ۲. مخفی‌سازی دائمی تمام نوشته‌ها، برچسب‌ها، متن تیترها و فلش‌های آکاردئون */
    /* US-285: «>» تا SVGهای iconx (span[data-ix] داخل .ic) مخفی نشوند + gt جدا کنترل می‌شود */
    .sb-l h3, .sb-l span, .sb-u span, .sb-i .lb, .sb-i > span:not(.ic), .nl, .sb-g .ar, .sb-g .gb {
      display: none !important;
    }
    
    /* ۳. تبدیل سرفصل‌ها: آیکون در بالا و متن کلمه با فونت ریز ۹ پیکسلی در زیر آیکون (طبق دستور کارفرما) */
    .sb-g {
      width: 50px !important; height: 46px !important;
      display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important;
      padding: 2px 0 !important; margin: 6px auto 2px auto !important;
      background: var(--crd, #f1f5f9) !important; border-radius: 10px !important; /* US-285: حالت شب */
      border: 1px solid var(--brd) !important;
      line-height: 1.1 !important;
    }
    /* US-285: ساختار جدید سرگروه — .gi آیکون / .gt متن ریز (سرریز ناممکن: ellipsis داخل 48px) */
    .sb-g .gi { display: grid !important; place-items: center !important; margin: 0 auto !important; font-size: 17px !important; }
    .sb-g .gt { display: block !important; font-size: 9px !important; font-weight: 900 !important; color: var(--tx, #334155) !important; text-align: center !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; max-width: 46px !important; }
    .sb-g .ar, .sb-g .gb { display: none !important; }
    
    /* ۴. زیرمجموعه‌ها: آیکون‌های مینیمال زیر سرفصل */
    .sb-gw { display: block !important; width: 100% !important; height: auto !important; max-height: none !important; overflow: visible !important; }
    .sb-gw .sb-i {
      width: 100% !important; height: 38px !important;
      display: flex !important; justify-content: center !important; align-items: center !important;
      padding: 0 !important; margin: 3px 0 !important;
    }
    .sb-i .ic { font-size: 22px !important; width: 28px !important; height: 28px !important; display: grid !important; place-items: center !important; margin: 0 auto !important; }
    
    /* ۵. تنظیم عرض پنل محتوا در کنار سایدبار ۵۶ پیکسلی */
    .mn { margin-right: 56px !important; width: calc(100% - 56px) !important; max-width: calc(100% - 56px) !important; padding: 10px !important; }
  }


/* ============ Sprint 118 / US-121: کنترل‌های مینیمال شناور (جای کلاسیک بالا-چپ) ============ */
.md { position: relative !important; overflow-x: hidden !important; padding-top: 36px !important; }
.md h3 {
  position: relative !important; top: auto !important; background: none !important;
  z-index: 1 !important; padding: 0 0 12px 0 !important; margin: 0 0 14px 0 !important;
  border-bottom: 1.5px solid var(--brd) !important; box-shadow: none !important;
}
.mx-dots { top: 12px !important; left: 14px !important; right: auto !important; bottom: auto !important; }
/* v122.2/v122.3 (US-280/281): دکمه‌های بستن قدیمی (دایره شناور + ✕ داخل h3 + نوار 🗖💾✕ storage.js) حذف شدند — دکمه‌های مک‌استایل modalx.js تنها کنترل پنجره‌ها هستند */
.md .md-ctrls, .ptf-win-ctrls, .md h3 .close-btn, .md h3 button[onclick*="remove()"], .md h3 button[onclick*="hideModal()"], .md h3 button[onclick*="ptfCloseActiveModal"] {
  display: none !important;
}

<script>
  // BUG-003 Fix: آنی‌سازی اعمال تم در هد قبل از رندر بدنه (FOUC Elimination)
  (function(){
    try {
      var mode = localStorage.getItem('ptf_theme');
      /* v14.1 (US-354): حالت خودکار — تم سیستم */
      if (mode === 'auto') { try { mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(e2){ mode = 'light'; } }
      var r = document.documentElement;
      if (mode === 'dark') {
        r.style.setProperty('--bg', '#0f172a');
        r.style.setProperty('--crd', '#1e293b');
        r.style.setProperty('--tx', '#f8fafc');
        r.style.setProperty('--brd', '#334155');
        r.style.setProperty('--sb', '#0f172a');
      }
    } catch(e){}
  })();
</script>

<script>
(function(){
  try {
    var mode = localStorage.getItem('ptf_theme');
    var r = document.documentElement;
    if (mode === 'dark') {
      r.style.setProperty('--bg', '#0f172a');
      r.style.setProperty('--crd', '#1e293b');
      r.style.setProperty('--tx', '#f8fafc');
      r.style.setProperty('--brd', '#334155');
      r.style.setProperty('--sb', '#0f172a');
    } else {
      var th = localStorage.getItem('ptf_crm_theme_vars');
      if (th) {
        var v = JSON.parse(th);
        if (v.pri) r.style.setProperty('--pri', v.pri);
        if (v.bg) r.style.setProperty('--bg', v.bg);
        if (v.crd) r.style.setProperty('--crd', v.crd);
        if (v.tx) r.style.setProperty('--tx', v.tx);
        if (v.brd) r.style.setProperty('--brd', v.brd);
        if (v.sb) r.style.setProperty('--sb', v.sb);
      }
    }
  } catch(e){}
})();
</script>

<script>
// ===== LOGIN - کاملاً مجزا و ساده =====
const ADMIN_USER = 'admin';
const ADMIN_HASH = 'f83b331362471ae55eeb42e54a2d46584dd9a1809dfc821fb2244c5b1b3ddabd'; // SHA-256
const ADMIN_NAME = 'مدیر ارشد سیستم';
const ADMIN_ROLE = 'مدیریت کل سیستم (Admin)';

async function sha256Hex(str) {
  // v78.1: در برخی مرورگرها روی HTTP غیرامن crypto.subtle وجود ندارد → پیاده‌سازی خالص JS
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* fallback پایین */ }
  }
  return sha256Fallback(str);
}
// SHA-256 خالص JS (فقط وقتی crypto.subtle در دسترس نیست — مثلاً HTTP بدون SSL)
function sha256Fallback(ascii) {
  function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), result = '';
  var words = [], asciiBitLength = 0;
  var hash = [], k = [], primeCounter = 0;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  // UTF-8 encode
  ascii = unescape(encodeURIComponent(ascii));
  ascii += '\x80';
  asciiBitLength = (ascii.length - 1) * 8;
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash.slice(0);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

// US-145 AC5: قفل ورود پس از ۵ تلاش ناموفق (۶۰ ثانیه)
function loginLockState() {
  try { return JSON.parse(localStorage.getItem('ptf_login_lock') || '{}'); } catch(e) { return {}; }
}
function loginFail() {
  var s = loginLockState();
  s.fails = (s.fails || 0) + 1;
  if (s.fails >= 5) { s.until = Date.now() + 60000; s.fails = 0; }
  localStorage.setItem('ptf_login_lock', JSON.stringify(s));
  return s;
}
function ptfApiAuthHeaders(json) {
  var h = json ? { 'Content-Type': 'application/json' } : {};
  try { var t = localStorage.getItem('ptf_crm_token'); if (t) h['X-CRM-Token'] = t; } catch (e) {}
  return h;
}
function ptfServerLogin(u, p) {
  return fetch('../api/crm.php?action=auth_login&_t=' + Date.now(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'username=' + encodeURIComponent(u) + '&pass' + 'word=' + encodeURIComponent(p)
  }).then(function (r) { return r.json(); }).catch(function () { return null; });
}
function ptfInvalidateSession(msg) {
  try { localStorage.removeItem('ptf_crm_session'); localStorage.removeItem('ptf_crm_token'); localStorage.removeItem('ptf_crm_token_role'); } catch (e) {}
  var le = document.getElementById('lerr');
  if (le) { le.textContent = msg || 'نشست سرور معتبر نیست؛ لطفاً دوباره وارد شوید.'; le.style.display = 'block'; }
  try { document.getElementById('crmL').style.display = 'none'; document.getElementById('loginS').style.display = 'grid'; } catch (e2) {}
}
async function doLogin() {
  var lock = loginLockState();
  if (lock.until && Date.now() < lock.until) {
    var sec = Math.ceil((lock.until - Date.now()) / 1000);
    var le = document.getElementById('lerr');
    le.textContent = '🔒 به دلیل تلاش‌های ناموفق، ورود ' + sec + ' ثانیه قفل است';
    le.style.display = 'block';
    setTimeout(function(){ le.style.display = 'none'; }, 3000);
    return;
  }
  var u = document.getElementById('uName').value.trim().toLowerCase();
  var p = document.getElementById('uPass').value.trim();
  var ph = await sha256Hex(p);

  // v33.0.3: server-authoritative login first for every role, including admin.
  var _login = await ptfServerLogin(u, p);
  if (_login && _login.ok && _login.token) {
    localStorage.removeItem('ptf_login_lock');
    localStorage.removeItem('ptf_crm_offline_login');
    localStorage.setItem('ptf_crm_session', JSON.stringify({
      user: _login.user || u,
      name: _login.name || u,
      role: _login.role || 'sales',
      roleId: _login.role || 'sales'
    }));
    localStorage.setItem('ptf_crm_token', _login.token);
    localStorage.setItem('ptf_crm_token_role', _login.role || 'sales');
    try {
      var _cu = JSON.parse(localStorage.getItem('ptf_crm_users') || '[]');
      var _ex = false;
      for (var _i = 0; _i < _cu.length; _i++) if (_cu[_i].username === (_login.user || u)) { _cu[_i].passhash = ph; _cu[_i].name = _cu[_i].name || (_login.name || u); _cu[_i].roleId = _cu[_i].roleId || (_login.role || 'sales'); _ex = true; }
      if (!_ex && u !== 'admin') _cu.push({ username: _login.user || u, name: _login.name || u, role: _login.role || 'sales', roleId: _login.role || 'sales', passhash: ph });
      localStorage.setItem('ptf_crm_users', JSON.stringify(_cu));
    } catch (eCacheUser) {}
    // v33.2.1: بعد از سرور لاگین، کاربران سرور رو بگیر — ادمین هم باید لیست کاربران رو ببینه
    if (typeof usersPullFromServer === 'function') usersPullFromServer(function () { if (typeof renderUsers2 === 'function') renderUsers2(); });
    showCrm();
    return;
  }
  if (u === ADMIN_USER) {
    var stAdmin = loginFail();
    var leAdmin = document.getElementById('lerr');
    leAdmin.textContent = stAdmin.until ? '🔒 ۵ تلاش ناموفق — ورود ۶۰ ثانیه قفل شد' : '❌ ورود admin باید از سرور توکن بگیرد. ptf-secrets.php/admin_sha256 و auth_key را بررسی کنید.';
    leAdmin.style.display = 'block';
    setTimeout(function(){ leAdmin.style.display = 'none'; }, 7000);
    return;
  }

  // US-193: اگر ادمین رمزش را عوض کرده، هش جدید در settings است
  var _adminHashEff = ADMIN_HASH;
  try { var _stg = JSON.parse(localStorage.getItem('ptf_crm_settings') || '{}'); if (_stg.adminHash) _adminHashEff = _stg.adminHash; } catch(e) {}
  if (false && u === ADMIN_USER && ph === _adminHashEff) {
    localStorage.removeItem('ptf_login_lock');
    localStorage.setItem('ptf_crm_session', JSON.stringify({user:u, name:ADMIN_NAME, role:ADMIN_ROLE, roleId:'admin'}));
    showCrm();
    return;
  }
  
  // Check custom users (passwords stored as SHA-256; legacy plain supported once, then migrated)
  var users = JSON.parse(localStorage.getItem('ptf_crm_users') || '[]');
  var migrated = false;
  for (var i = 0; i < users.length; i++) {
    if (users[i].username === u && users[i].passhash && users[i].passhash === ph) {
      localStorage.removeItem('ptf_login_lock');
      localStorage.setItem('ptf_crm_session', JSON.stringify({user:u, name:users[i].name, role:users[i].role, roleId:users[i].roleId||'sales'}));
      showCrm();
      return;
    }
    // Legacy: migrate old plain-text password to hash on first successful login
    if (users[i].username === u && users[i].password && users[i].password === p) {
      users[i].passhash = ph;
      delete users[i].password;
      localStorage.setItem('ptf_crm_users', JSON.stringify(users));
      localStorage.setItem('ptf_crm_session', JSON.stringify({user:u, name:users[i].name, role:users[i].role, roleId:users[i].roleId||'sales'}));
      showCrm();
      return;
    }
  }
  
  // ===== US-151 فاز ۱: کاربر محلی پیدا نشد → مستقیم از سرور بگیر و دوباره چک کن =====

    var _localByName = {};

  try {

      return n.length >= 3 && !/صدور پیشنهاد|ابلاغ سفارش|بررسی فنی|دریافت اولیه|آماده‌سازی|تحویل شده|آقای\s|خانم\s|مهندس\s|^مرحله\s*\d/i.test(n);
    });
    /* v15.9 (US-389): مهاجرت نرم دسته‌های انگلیسی (Electrical و...) به فارسی استاندارد — tp خام حفظ می‌شود */
    var caMig = false;
    if (typeof ptfNormCat === 'function') {
      clean.forEach(function(p){

function getData(k) {
  try {
    var raw = localStorage.getItem(k);
    if (!raw || raw === 'undefined') return [];
    return JSON.parse(raw);
  } catch (e) {
    console.error('ptf_crm_corrupt_localStorage_key:', k, e);
    return [];
  }
}
window.setData = function (k, d) {
  try {
    var s = JSON.stringify(d);
    var saveResult;
    if (typeof ptfStorageSafeSetItem === 'function') saveResult = ptfStorageSafeSetItem(k, s);
    else saveResult = localStorage.setItem(k, s);
    if (window.ptfSyncNotifyDirty) {
      window.ptfSyncNotifyDirty(k);
    }
    /* Same-tab writes do not emit the browser storage event. Notify the
       active CRM view as well, so derived balances/KPIs change immediately. */
    if (saveResult !== false && typeof window.ptfScheduleDataRefresh === 'function') {
      window.ptfScheduleDataRefresh(k);
    }
    return saveResult;
  } catch (e) {
    console.error('ptf_crm_localStorage_write_error:', k, e);
    var msg = '⚠️ ذخیره تغییرات انجام نشد؛ ظرفیت حافظه محلی را بررسی کنید.';
    try {
      if (typeof ptfToast === 'function') ptfToast(msg, 'warn');
      else alert(msg);
    } catch (e2) {}
    return false;
  }
};

  function extractNum(code, pattern) {

    'LTR':['ptf_crm_letters','cd','LTR',function(n){return 'LTR-'+n}],
    'DEAL':['ptf_crm_deals','cd','DEAL',function(n){return 'DEAL-'+n},['lossEvents','docs']],
    'FIN':['ptf_crm_finance','code','FIN',function(n){return 'FIN-'+n}],
    'LOS':['ptf_crm_deals','cd','LOS',function(n){return 'LOS-'+n},['lossEvents']],
    'DX':['ptf_crm_projects','cd','DX',function(n){return 'DX-'+n},['docs']],
    'PAC':['ptf_crm_projects','cd','PAC',function(n){return 'PAC-'+n},['docs']],
    'CST':['ptf_crm_buycmp','cd','CST',function(n){return 'CST-'+n},['events']],
    'SHP':['ptf_crm_projects','cd','SHP',function(n){return 'SHP-'+n},['docs']],
    'QC':['ptf_crm_projects','cd','QC',function(n){return 'QC-'+n},['docs']],
    'SHR':['ptf_crm_shareholders','cd','SHR',function(n){return 'SHR-'+n}],
    'SHT':['ptf_crm_sharetx','cd','SHT',function(n){return 'SHT-'+n}],
    'SND':['ptf_crm_smsbook','cd','SND',function(n){return 'SND-'+n}],
    'PB':['ptf_crm_smsbook','cd','PB',function(n){return 'PB-'+n}],
    'SFINV':['ptf_crm_supplier_finance','cd','SFINV',function(n){return 'SFINV-'+n}],
    'SFPAY':['ptf_crm_supplier_finance','cd','SFPAY',function(n){return 'SFPAY-'+n}],
    'SFOPEN':['ptf_crm_supplier_finance','cd','SFOPEN',function(n){return 'SFOPEN-'+n}],
    'SFADJ':['ptf_crm_supplier_finance','cd','SFADJ',function(n){return 'SFADJ-'+n}],
    'FOB':['ptf_crm_finance','cd','FOB',function(n){return 'FOB-'+n}],
    'FSCFG':['ptf_crm_finance','cd','FSCFG',function(n){return 'FSCFG-'+n}]
  };
  /* LOS/SHP/QC/PAC در دو منبع ذخیره می‌شوند — هر دو اسکن شود */
  var REG2 = {
    'LOS':['ptf_crm_projects','cd','LOS',function(n){return 'LOS-'+n},['lossEvents']],
    'SHP':['ptf_crm_projects','cd','SHP',function(n){return 'SHP-'+n},['docs']],
    'QC':['ptf_crm_projects','cd','QC',function(n){return 'QC-'+n},['docs']],
    'PAC':['ptf_crm_projects','cd','PAC',function(n){return 'PAC-'+n},['docs']]
  };
  if (REG[p]) {
    var r = REG[p];
    var result = genSeq(r[0], r[1], r[2], r[3], r[4]);
    if (REG2[p]) {
      var r2 = REG2[p];
      var max2 = deepScan(r2[0], r2[1], r2[2], r2[4]);
      var currentNum = extractNum(result.replace(/-D\d+$/, ''), r2[2]);
      if (max2 >= currentNum) {
        var seqKey2 = r2[2].toUpperCase();
        var newC = Math.max(max2 + 1, (window._ptfCodeSeq[seqKey2] || 0) + 1);
        window._ptfCodeSeq[seqKey2] = newC;
        result = r2[3](newC) + devTag;
      }
    }
    return result;
  }
  /* FALLBACK امن: هر prefix ناشناخته هم sequential از اسکن سراسری */
  var gMax = 0;
  try {
    var allKeys = ['ptf_crm_products','ptf_crm_rfqs','ptf_crm_offers','ptf_crm_customers',
      'ptf_crm_suppliers','ptf_crm_inqitems','ptf_crm_leads','ptf_crm_cheques',
      'ptf_crm_reminders','ptf_crm_notifs','ptf_crm_buycmp','ptf_crm_buyquotes',
      'ptf_crm_opex','ptf_crm_petty','ptf_crm_petty_tx','ptf_crm_petty_periods',
      'ptf_crm_invoices','ptf_crm_payables','ptf_crm_fiscal_snapshots','ptf_crm_letters',
      'ptf_crm_deals','ptf_crm_finance','ptf_crm_projects','ptf_crm_shareholders',
      'ptf_crm_sharetx','ptf_crm_smsbook','ptf_crm_supplier_finance'];
    allKeys.forEach(function(k) {
      gMax = Math.max(gMax, deepScan(k,'cd',p,null), deepScan(k,'code',p,null), deepScan(k,'no',p,null), deepScan(k,'id',p,null));
    });
  } catch(e) {}
  var seqKey = p;
  var candidate = Math.max(gMax + 1, (window._ptfCodeSeq[seqKey] || 0) + 1);
  window._ptfCodeSeq[seqKey] = candidate;
  return p + '-' + candidate + devTag;
};

// Sprint 115 / US-111: محاسبه‌گر سود خالص پروژه توسط مدیر
window.ptfCalculateNetProfit = function(prjNo) {
  var p = getData('ptf_crm_projects').filter(function(x){return x.no===prjNo;})[0];
  if (!p) return;
  /* ===== v16.0 (US-390 — طرح مصوب تیم متخصص): موتور واحد سود ریالی (ptfProjectProfitIRR در fx.js) =====
     پوشش کامل: فروش ریالی/ارزی (تسعیر سنا از دریافت‌ها) + خرید ریالی/ارز آزاد (نرخ پرداخت) +
     چند فاکتور/چند خرید + رکوردهای قدیمی. هر جزء نامشخص = هشدار صریح، هرگز عدد غلط. */
  if (typeof ptfProjectProfitIRR !== 'function') { alert('ماژول ارزی بارگذاری نشده — صفحه را رفرش کنید'); return; }
  var r = ptfProjectProfitIRR(p);
  if (!r.ok) { alert(r.warnings.join('\n') || '⚠️ داده کافی برای محاسبه سود نیست.'); return; }
  if (!r.buyIrr && !r.buyPendingFx.length && !confirm('⚠️ قیمت خرید نهایی ثبت نشده — سود بدون هزینه خرید محاسبه شود؟')) return;
  var recordedCosts = (typeof prjCostTotal === 'function') ? prjCostTotal(p) : 0;
  var extra = prompt('اگر هزینه ثبت‌نشده‌ی دیگری خارج از سیستم دارید وارد کنید؛ در غیر این صورت 0 بزنید.\n(هزینه‌های ثبت‌شده پرونده به‌صورت خودکار لحاظ می‌شوند)', '0');
  var extraCost = +String(extra||'0').replace(/[^\d۰-۹]/g,'').replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);}) || 0;
  var shipCost = recordedCosts + extraCost;
  var netProfit = r.profit - extraCost;
  var pct = r.sellIrr > 0 ? Math.round(netProfit * 100 / r.sellIrr) : 0;
  var fxNote = '';
  if (r.sellCur !== 'IRR') {
    fxNote = '<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 12px;font-size:12px;color:#9a3412;margin-bottom:10px">💱 سند ' + r.sellCur + ' — فروش = <b>دریافت‌های ریالی واقعی</b> (' + r.sellFxPaid.toLocaleString('en-US') + ' ' + r.sellCur + ' وصول‌شده' + (r.sellAvgRate ? ' با میانگین نرخ ' + r.sellAvgRate.toLocaleString('fa-IR') + ' ریال' : '') + ')' + (r.sellFxRemain > 0 ? ' | مانده وصول‌نشده: <b>' + r.sellFxRemain.toLocaleString('en-US') + ' ' + r.sellCur + '</b>' : '') + '</div>';
  }
  var warnHtml = r.warnings.length
    ? '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:8px 12px;font-size:12px;color:#b91c1c;margin-bottom:10px;line-height:1.9">' + r.warnings.map(function(w){return escP(w);}).join('<br>') + '</div>'
    : '';
  var reliableTag = (r.complete && !r.buyPendingFx.length)
    ? '<span class="bd" style="background:#d1fae5;color:#065f46">✅ همه اجزا قطعی — قابل اتکا</span>'
    : '<span class="bd" style="background:#fef3c7;color:#b45309">⚠️ ناقص — اجزای نامشخص در هشدارها</span>';
  var html = '<div class="md-b" style="display:grid;z-index:1800" onclick="if(event.target===this)this.remove()"><div class="md" style="max-width:560px">' +
    '<h3>💰 محاسبه‌گر سود خالص پروژه (مدیریت) ' + reliableTag + '</h3>' +
    fxNote + warnHtml +
    '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;font-size:13px;color:#166534;margin-bottom:14px;line-height:2">' +
    '<b>فروش ریالی واقعی:</b> ' + r.sellIrr.toLocaleString('fa-IR') + ' ریال <small style="color:#4d7c0f">(' + escP(r.sellSrc) + ')</small><br>' +
    '<b>هزینه تأمین و خرید (ریالی‌شده):</b> ' + r.buyIrr.toLocaleString('fa-IR') + ' ریال' + (r.buyItems ? ' <small style="color:#4d7c0f">(' + r.buyItems + ' قلم)</small>' : '') + '<br>' +
    '<b>هزینه‌های ثبت‌شده پرونده:</b> ' + recordedCosts.toLocaleString('fa-IR') + ' ریال' + (extraCost ? ' <small style="color:#92400e">+ هزینه ثبت‌نشده اعلامی: ' + extraCost.toLocaleString('fa-IR') + ' ریال</small>' : '') + '<hr style="border:none;border-top:1px dashed #86efac;margin:8px 0">' +
    '<b style="font-size:15px;color:' + (netProfit >= 0 ? '#15803d' : '#dc2626') + '">سود خالص (ریال واقعی): ' + netProfit.toLocaleString('fa-IR') + ' ریال (' + pct + '٪)</b></div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end">' +
    '<button class="bt bt-o" onclick="this.closest(&quot;.md-b&quot;).remove()">بستن</button>' +
    '<button class="bt" style="background:#059669" onclick="alert(&quot;✅ سود خالص ' + pct + '٪ تایید شد&quot;);this.closest(&quot;.md-b&quot;).remove();">🏆 تأیید سود</button></div></div></div>';
  document.getElementById('panels').insertAdjacentHTML('beforeend', html);
};

// استانداردسازی ایمپورت اکسل کالاها طبق دستورالعمل US-120 (ستون A=شرح، B=واحد، C=قیمت، D=دسته، E=مدل)
window.ptfStandardImportProdXls = function(inp) {
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  
  var rd = new FileReader();
  rd.onload = function(e) {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
      if (!rows || rows.length < 2) { alert('فایل اکسل خالی یا فاقد اطلاعات کالا است'); return; }
      
      var prods = getData('ptf_crm_products');
      var added = 0;
      
      for (var r=1; r<rows.length; r++) {
        var row = rows[r];
        var desc = String(row[0] || '').trim(); // ستون A = شرح کالا
        if (!desc || desc === '-' || /^\d+$/.test(desc)) continue; // نادیده گرفتن ردیف خالی یا شماره ردیف
        
        var un = String(row[1] || 'عدد').trim() || 'عدد'; // ستون B = واحد
        var pr = +String(row[2] || '0').replace(/[^\d.]/g,'') || 0; // ستون C = قیمت
        var ca = String(row[3] || 'سایر').trim() || 'سایر'; // ستون D = دسته
        var st = String(row[4] || '-').trim() || '-'; // ستون E = مشخصه
        /* v15.9 (US-389): ستون‌های اختیاری جدید — F=برند، G=مدل + دسته همیشه فارسی استاندارد */
        var br = String(row[5] || '').trim();
        var md = String(row[6] || '').trim();
        if (typeof ptfNormCat === 'function') ca = ptfNormCat(ca);
        var cd = window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1001 + prods.length);
        prods.push({ cd: cd, nm: desc, en: '', ca: ca, st: st, br: br, md: md, un: un, pr: pr, ds: 'ورود اکسل استاندارد US-120', ts: new Date().toISOString() });
        added++;
      }
      
      setData('ptf_crm_products', prods);
      renderProducts();
      alert('✅ تعداد ' + added + ' کالا طبق دستورالعمل استاندارد US-120 با کدهای مینیمال وارد سیستم شد.');
      if (typeof audit === 'function') audit('کالاها', 'ورود اکسل استاندارد ' + added + ' کالا', '');
    } catch(err) {
      alert('❌ خطا در خواندن فایل اکسل: ' + err.message);
    }
  };
  rd.readAsArrayBuffer(f);
};

// ورود اکسل استاندارد مشتریان (CUST) طبق US-120
window.ptfStandardImportCustXls = function(inp) {
  /* v122.2 (US-280): ورود اکسل کامل مشتریان — تفکیک موبایل/ثابت، چند رابط (ردیف تکراری)، چند شماره با /، فیلدهای اختیاری آدرس/شناسه ملی/وب/وندور */
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  var rd = new FileReader();
  rd.onload = function() {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
      if (!rows || rows.length < 2) { alert('فایل خالی است یا فقط سرستون دارد'); return; }
      var custs = getData('ptf_crm_customers');
      var added = 0, merged = 0;
      var byName = {};
      custs.forEach(function(c){ byName[String(c.co||'').trim()] = c; });
      for (var r = 1; r < rows.length; r++) {
        var R = rows[r] || [];
        var co = String(R[0]||'').trim();
        if (!co) continue;
        var person = ptfXlsPerson(R[2], R[3], R[5], R[6]); // C=رابط D=موبایل F=ثابت G=سمت
        var rec = byName[co];
        if (rec) {
          // مشتری موجود → فقط رابط جدید اضافه شود
          if (person) {
            rec.people = rec.people || [];
            var dupP = rec.people.some(function(p){ return p.nm === person.nm; });
            if (!dupP) { rec.people.push(person); merged++; }
          }
          // فیلدهای خالی رکورد موجود از اکسل پر شوند (بدون بازنویسی داده موجود)
          if (!rec.ind && R[1]) rec.ind = String(R[1]).trim();
          if (!rec.coAddr && R[8]) rec.coAddr = String(R[8]).trim();
          if (!rec.natId && R[9]) rec.natId = String(R[9]).trim();
          if (!rec.coWeb && R[10]) rec.coWeb = String(R[10]).trim();
          if (!rec.venNo && R[11]) rec.venNo = String(R[11]).trim();
          if (!rec.coEn && R[12]) rec.coEn = String(R[12]).trim();
          if ((!rec.coTels || !rec.coTels.length) && R[7]) rec.coTels = [{ n: String(R[7]).trim(), ext: '', lb: 'تلفنخانه' }];
          if ((rec.venSt||'unreg') === 'unreg' && R[4]) rec.venSt = ptfXlsVenSt(R[4]);
          if (!rec.con && person) rec.con = person.nm;
          if (!rec.ph && person) rec.ph = (person.mobs[0]||person.tels[0]||{}).n || '';
        } else {
          rec = {
            cd: (typeof genCode === 'function' ? genCode('CUST') : 'CUST-' + (1001 + custs.length)),
            co: co, kind: 'حقوقی',
            ind: String(R[1]||'نفت و گاز').trim(),
            venSt: ptfXlsVenSt(R[4]),
            venNo: String(R[11]||'').trim(),
            coTels: R[7] ? [{ n: String(R[7]).trim(), ext: '', lb: 'تلفنخانه' }] : [],
            coAddr: String(R[8]||'').trim(),
            natId: String(R[9]||'').trim(),
            coWeb: String(R[10]||'').trim(),
            coEn: String(R[12]||'').trim(),
            people: person ? [person] : [],
            phones: [],
            ts: new Date().toISOString()
          };
          if (person) { rec.con = person.nm; rec.ph = (person.mobs[0]||person.tels[0]||{}).n || ''; person.primary = true; }
          if (typeof dedupStamp === 'function') dedupStamp(rec);
          custs.unshift(rec);
          byName[co] = rec;
          added++;
        }
      }
      setData('ptf_crm_customers', custs);
      if (typeof renderCustomers === 'function') renderCustomers();
      alert('✅ ' + added + ' مشتری جدید وارد شد' + (merged ? ' و ' + merged + ' رابط به مشتریان موجود اضافه شد' : '') + ' (دستورالعمل US-280).');
    } catch(e) { alert('❌ خطا در خواندن فایل اکسل: ' + e.message); }
  };
  rd.readAsArrayBuffer(f);
};

/* v122.2: ابزارهای مشترک ورود اکسل — تفکیک موبایل/ثابت و چند شماره با / و داخلی بعد از خط تیره */
window.ptfXlsPhones = function(cell, isMob) {
  return String(cell||'').split(/[\/,،;؛|]+/).map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){
    if (isMob) return { n: x, lb: '' };
    var m = x.match(/^(.*?)[\s]*-[\s]*(\d{1,5})$/); // 02188xxxxxx-124 → شماره + داخلی
    return m && m[1].replace(/\D/g,'').length >= 5 ? { n: m[1].trim(), ext: m[2], lb: '' } : { n: x, ext: '', lb: '' };
  });
};
window.ptfXlsPerson = function(nm, mobCell, telCell, role) {
  var name = String(nm||'').trim();
  var mobs = ptfXlsPhones(mobCell, true);
  var tels = ptfXlsPhones(telCell, false);
  if (!name && !mobs.length && !tels.length) return null;
  return { nm: name || 'رابط', nmEn: '', role: String(role||'رابط اصلی').trim() || 'رابط اصلی', dept: '', tels: tels, mobs: mobs, primary: false };
};
window.ptfXlsVenSt = function(cell) {
  var v = String(cell||'').trim().toLowerCase();
  if (!v) return 'unreg';
  if (v === 'approved' || v.indexOf('تایید') > -1 || v.indexOf('تأیید') > -1) return 'approved';
  if (v === 'pending' || v.indexOf('بررسی') > -1) return 'pending';
  return 'unreg';
};

// ورود اکسل سرنخ‌ها (LEADS) طبق US-120
window.ptfStandardImportLeadsXls = function(inp) {
  /* v122.2 (US-280): ورود اکسل کامل سرنخ‌ها — تفکیک موبایل/ثابت + ایمیل/صنعت/ارزش */
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  var rd = new FileReader();
  rd.onload = function() {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
      if (!rows || rows.length < 2) { alert('فایل خالی است یا فقط سرستون دارد'); return; }
      var leads = getData('ptf_crm_leads');
      var added = 0;
      for (var r = 1; r < rows.length; r++) {
        var R = rows[r] || [];
        var co = String(R[0]||'').trim();
        if (!co) continue;
        var mobs = ptfXlsPhones(R[2], true);   // C = موبایل
        var tels = ptfXlsPhones(R[5], false);  // F = ثابت
        var val = parseFloat(String(R[9]||'').replace(/[^\d.]/g,'')) || 0; // J = برآورد ارزش
        leads.push({
          cd: (typeof genCode === 'function' ? genCode('LEAD') : 'LEAD-' + (1001 + leads.length)),
          co: co,
          person: String(R[1]||'').trim(),
          mob: mobs.length ? mobs.map(function(m){return m.n;}).join(' / ') : '',
          tel: tels.length ? tels.map(function(t){return t.n + (t.ext ? ' داخلی ' + t.ext : '');}).join(' / ') : '',
          ph: (mobs[0]||tels[0]||{}).n || '',
          src: String(R[3]||'اکسل وارداتی').trim(),
          need: String(R[4]||'').trim(),
          role: String(R[6]||'').trim(),
          email: String(R[7]||'').trim(),
          ind: String(R[8]||'').trim(),
          val: val,
          stage: 'new', hist: [],
          createdISO: new Date().toISOString().slice(0,10),
          createdFa: new Date().toLocaleDateString('fa-IR')
        });
        added++;
      }
      setData('ptf_crm_leads', leads);
      if (typeof renderLeads === 'function') renderLeads();
      alert('✅ ' + added + ' سرنخ فروش وارد شد (دستورالعمل US-280).');
    } catch(e) { alert('❌ خطا در خواندن فایل اکسل: ' + e.message); }
  };
  rd.readAsArrayBuffer(f);
};


// ورود اکسل استاندارد تأمین‌کنندگان (SUP) طبق US-120
window.ptfStandardImportSupXls = function(inp) {
  /* v122.2 (US-280): ورود اکسل کامل تأمین‌کنندگان — تفکیک موبایل/ثابت، چند رابط، فیلدهای اختیاری */
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  var rd = new FileReader();
  rd.onload = function() {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
      if (!rows || rows.length < 2) { alert('فایل خالی است یا فقط سرستون دارد'); return; }
      var sups = getData('ptf_crm_suppliers');
      var added = 0, merged = 0;
      var byName = {};
      sups.forEach(function(c){ byName[String(c.co||'').trim()] = c; });
      for (var r = 1; r < rows.length; r++) {
        var R = rows[r] || [];
        var co = String(R[0]||'').trim();
        if (!co) continue;
        var person = ptfXlsPerson(R[2], R[3], R[5], R[6]); // C=رابط D=موبایل F=ثابت G=سمت
        var rec = byName[co];
        if (rec) {
          if (person) {
            rec.people = rec.people || [];
            if (!rec.people.some(function(p){ return p.nm === person.nm; })) { rec.people.push(person); merged++; }
          }
          if (!rec.ca && R[1]) rec.ca = String(R[1]).trim();
          if (!rec.coWeb && R[4]) rec.coWeb = String(R[4]).trim();
          if ((!rec.coTels || !rec.coTels.length) && R[7]) rec.coTels = [{ n: String(R[7]).trim(), ext: '', lb: 'تلفنخانه' }];
          if (!rec.coAddr && R[8]) rec.coAddr = String(R[8]).trim();
          if (!rec.natId && R[9]) rec.natId = String(R[9]).trim();
          if (!rec.nm && person) rec.nm = person.nm;
          if (!rec.ph && person) rec.ph = (person.mobs[0]||person.tels[0]||{}).n || '';
        } else {
          rec = {
            cd: (typeof genCode === 'function' ? genCode('SUP') : 'SUP-' + (1001 + sups.length)),
            co: co, kind: 'حقوقی',
            ca: String(R[1]||'ابزار دقیق و پمپ').trim(),
            coWeb: String(R[4]||'').trim(),
            coTels: R[7] ? [{ n: String(R[7]).trim(), ext: '', lb: 'تلفنخانه' }] : [],
            coAddr: String(R[8]||'').trim(),
            natId: String(R[9]||'').trim(),
            people: person ? [person] : [],
            phones: [],
            ts: new Date().toISOString()
          };
          if (person) { rec.nm = person.nm; rec.ph = (person.mobs[0]||person.tels[0]||{}).n || ''; person.primary = true; }
          if (typeof dedupStamp === 'function') dedupStamp(rec);
          sups.unshift(rec);
          byName[co] = rec;
          added++;
        }
      }
      setData('ptf_crm_suppliers', sups);
      if (typeof renderSuppliers === 'function') renderSuppliers();
      alert('✅ ' + added + ' تأمین‌کننده جدید وارد شد' + (merged ? ' و ' + merged + ' رابط به موجودی‌ها اضافه شد' : '') + ' (دستورالعمل US-280).');
    } catch(e) { alert('❌ خطا در خواندن فایل اکسل: ' + e.message); }
  };
  rd.readAsArrayBuffer(f);
};

// ===== PRODUCTS (US-109) =====
var PROD_CATS = ['پایپینگ','فلنج و اتصالات','شیرآلات','برق صنعتی','ابزار دقیق','پمپ و کمپرسور','سایر'];
// US-143 AC2: واحد باید هم‌زبان شرح باشد
var PROD_UNITS = ['عدد','شاخه','متر','کیلوگرم','ست','بسته'];
var PROD_UNITS_EN = ['No','PCS','Set','Meter','Branch','KG','Pack','EA'];
// US-143 AC1: کد کالای خودکار P-XXXX
function prodAutoCode() {
  var items = getData('ptf_crm_products');
  var max = 0;
  items.forEach(function(p){ var m = (p.cd||'').match(/^(?:P-|P-)(\d+)$/i); if (m && +m[1] > max) max = +m[1]; });
  return (window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1000 + items.length + 1));
}
function prodIsEnglish(s) { return /^[\x00-\x7F\u00C0-\u024F]*$/.test(s) && /[A-Za-z]/.test(s); }

function buildProducts() {
  var catOpts='<option value="">همه</option>';
  for (var i=0;i<PROD_CATS.length;i++) catOpts += '<option>'+PROD_CATS[i]+'</option>';
  return '<div class="ph"><h3>📦 مدیریت کالاها</h3>' +
    '<div class="sb2" style="flex-wrap:wrap;gap:6px">' +
    '<button class="bt" onclick="showProdModal()">+ کالای جدید</button>' +
    '<button class="bt bt-o" style="color:#059669;border-color:#a7f3d0" onclick="exportProdCsv()">📤 خروجی اکسل</button>' +
    '<button class="bt bt-o" onclick="ptfShowExcelGuidelineModal(&quot;PROD&quot;, &quot;pCsvIn&quot;)">📥 ورود اکسل</button>' +
    '' +
    '<button class="bt bt-o" style="color:#dc2626;border-color:#fecaca" onclick="ptfBatchDeleteProducts()">🗑 حذف دسته‌جمعی انتخاب‌شده‌ها</button>' +
    '<input type="file" id="pCsvIn" accept=".csv,.xlsx,.xls" style="display:none" onchange="ptfStandardImportProdXls(this)">' +
    '</div></div>' +
    '<div class="sb2" style="margin-bottom:10px;display:flex;gap:8px">' +
    '<input type="text" id="pSrch" placeholder="جستجو: کد، نام، برند، استاندارد..." oninput="renderProducts()" style="flex:1;padding:8px 12px;border:1.5px solid var(--brd);border-radius:10px;font-size:13px">' +
    '<select id="pFcat" onchange="renderProducts()" style="padding:8px;border:1.5px solid var(--brd);border-radius:10px;font-size:13px">' + catOpts + '</select>' +
    '</div>' +
    '<div style="font-size:12px;color:#94a3b8;margin-bottom:8px" id="pCount"></div>' +
    '<div class="tb2"><table><thead><tr><th style="width:32px"><input type="checkbox" id="pChkAll" onclick="ptfToggleAllProdChk(this)" title="انتخاب همه"></th><th onclick="sortProd(&quot;cd&quot;)" style="cursor:pointer">کد ⇅</th><th onclick="sortProd(&quot;nm&quot;)" style="cursor:pointer">نام کالا ⇅</th><th>دسته</th><th>استاندارد/گرید</th><th>برند</th><th>واحد</th><th onclick="sortProd(&quot;pr&quot;)" style="cursor:pointer">قیمت مرجع ⇅</th><th>عملیات</th></tr></thead>' +
    '<tbody id="pTb"></tbody></table></div>';
}

var prodSort = {key:'cd', dir:1};
function sortProd(k){ if(prodSort.key===k){prodSort.dir*=-1}else{prodSort={key:k,dir:1}} renderProducts(); }

function renderProducts() {
  var items = getData('ptf_crm_products');
  var tb = document.getElementById('pTb');
  if (!tb) return;
  var q = (document.getElementById('pSrch')||{}).value || '';
  var fc = (document.getElementById('pFcat')||{}).value || '';
  q = q.trim().toLowerCase();
  var list = items.filter(function(p){
    /* v15.9 (US-389): فیلتر دسته نرمال‌شده — «برق صنعتی» کالاهای Electrical قدیمی را هم می‌گیرد */
    var pCa = (typeof ptfNormCat === 'function') ? ptfNormCat(p.ca) : p.ca;
    if (fc && fc !== 'همه' && pCa !== fc) return false;
    if (!q) return true;
    /* v15.9: جستجوی دوزبانه + مدل + نرمال‌سازی ارقام/فاصله */
    if (typeof ptfProdSearchMatch === 'function') return ptfProdSearchMatch(p, q);
    return ((p.cd||'')+' '+(p.nm||'')+' '+(p.en||'')+' '+(p.br||'')+' '+(p.st||'')+' '+(p.md||'')).toLowerCase().indexOf(q) > -1;
  });
  list.sort(function(a,b){
    var x=a[prodSort.key]||'', y=b[prodSort.key]||'';
    if (prodSort.key==='pr'){x=+x||0;y=+y||0}
    return (x>y?1:x<y?-1:0)*prodSort.dir;
  });
  var el = document.getElementById('pCount');
  if (el) el.textContent = 'نمایش ' + list.length + ' از ' + items.length + ' کالا';
  var h = '';
  for (var i=0;i<list.length;i++){
    var p = list[i];
    var cd = p.cd || '';
    var safeCd = cd.replace(/'/g, '');
    h += '<tr><td><input type="checkbox" class="p-chk" value="' + escP(cd) + '"></td>' +
      '<td><strong>'+escP(cd)+'</strong></td><td>'+escP(p.nm)+(p.en?'<br><small style="color:#94a3b8">'+escP(p.en)+'</small>':'')+'</td>'+
      '<td>'+escP((typeof ptfNormCat==='function'?ptfNormCat(p.ca):p.ca)||'-')+'</td><td>'+escP(p.st||'-')+'</td><td>'+escP(p.br||'-')+(p.md?'<br><small style="color:#7c3aed;direction:ltr;display:inline-block">'+escP(p.md)+'</small>':'')+'</td><td>'+escP(p.un||'-')+'</td>'+
      '<td>'+(p.pr? (+p.pr).toLocaleString(p.prCur&&p.prCur!=='IRR'?'en-US':'fa-IR')+' '+(p.prCur&&p.prCur!=='IRR'?p.prCur:'ریال') : '-')+(p.refPriceAt ? '<br><small style="color:#0e7490" title="'+escP(p.refPriceSrc||'')+'">مرجع: '+escP(p.refPriceAt)+'</small>' : '')+'</td>'+ /* v13.7 US-335 + v15.6 US-387: ارز واقعی به جای ریال */
      '<td><button class="bt bt-o" style="padding:4px 10px;font-size:12px" onclick="showProdModal(\''+safeCd+'\')">✎</button> '+
      '<button class="bt bt-o" style="padding:4px 10px;font-size:12px;color:#dc2626" onclick="delProd(\''+safeCd+'\')">✕</button></td></tr>';
  }
  tb.innerHTML = h || '<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:26px">کالایی یافت نشد</td></tr>';
}

// US-117: توابع انتخاب همه و حذف دسته‌جمعی کالاها
window.ptfToggleAllProdChk = function(el) {
  document.querySelectorAll('.p-chk').forEach(function(ch) { ch.checked = el.checked; });
};

window.ptfBatchDeleteProducts = function() {
  var checked = [];
  document.querySelectorAll('.p-chk:checked').forEach(function(ch) { if(ch.value) checked.push(ch.value); });
  if (!checked.length) { alert('هیچ کالایی انتخاب نشده است. لطفاً کالاها را با تیک زدن انتخاب کنید.'); return; }
  
  if (typeof window.ptfReasonedDelete === 'function') {
    window.ptfReasonedDelete('PRODUCT_BATCH', checked.length + ' کالا', 'حذف دسته‌جمعی ' + checked.length + ' کالا', function() {
      var items = getData('ptf_crm_products').filter(function(p) { return checked.indexOf(p.cd) < 0; });
      setData('ptf_crm_products', items);
      if (typeof audit === 'function') audit('کالاها', 'حذف دسته‌جمعی ' + checked.length + ' کالا', '');
      renderProducts();
    });
  } else {
    if (!confirm('آیا از حذف دسته‌جمعی ' + checked.length + ' کالای انتخاب‌شده اطمینان دارید؟')) return;
    var items = getData('ptf_crm_products').filter(function(p) { return checked.indexOf(p.cd) < 0; });
    setData('ptf_crm_products', items);
    renderProducts();
  }
};
function escP(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showProdModal(cd) {
  var p = null;
  if (cd) {
    var items = getData('ptf_crm_products');
    for (var i=0;i<items.length;i++) if (items[i].cd===cd) p = items[i];
  }
  var catOpts='';
  for (var i=0;i<PROD_CATS.length;i++) catOpts += '<option'+(p&&p.ca===PROD_CATS[i]?' selected':'')+'>'+PROD_CATS[i]+'</option>';
  // US-143 AC2: دو گروه واحد (فارسی/انگلیسی) — باید هم‌زبان شرح باشد
  var unitOpts = '<optgroup label="واحد فارسی">';
  for (var i=0;i<PROD_UNITS.length;i++) unitOpts += '<option'+(p&&p.un===PROD_UNITS[i]?' selected':'')+'>'+PROD_UNITS[i]+'</option>';
  unitOpts += '</optgroup><optgroup label="English Units">';
  for (var i=0;i<PROD_UNITS_EN.length;i++) unitOpts += '<option'+(p&&p.un===PROD_UNITS_EN[i]?' selected':'')+'>'+PROD_UNITS_EN[i]+'</option>';
  unitOpts += '</optgroup>';
  var autoCd = p ? p.cd : prodAutoCode();
  var html = '<div class="md-b" style="display:grid" onclick="if(event.target===this)hideModal()"><div class="md" style="max-width:560px">' +

function saveProd(isEdit) {
  var cd = document.getElementById('nPCd').value.trim().toUpperCase();
  var nm = document.getElementById('nPNm').value.trim();
  var un = document.getElementById('nPUn').value;
  // US-143 AC3: شرح و واحد اجباری
  if (!nm) { alert('شرح کالا الزامی است'); return; }
  if (!un) { alert('واحد کالا الزامی است'); return; }
  // US-143 AC2: واحد باید هم‌زبان شرح باشد
  var nmEn = prodIsEnglish(nm);
  var unEn = PROD_UNITS_EN.indexOf(un) > -1;
  if (nmEn && !unEn) { alert('⚠️ شرح کالا انگلیسی است — واحد هم باید انگلیسی باشد (No / PCS / Set / ...)'); return; }
  if (!nmEn && unEn) { alert('⚠️ شرح کالا فارسی است — واحد هم باید فارسی باشد (عدد / شاخه / متر / ...)'); return; }
  var items = getData('ptf_crm_products');
  if (!isEdit) {
    if (!cd) cd = prodAutoCode();
    /* v31.7.20 BUG-CODE-DUP-002: تلاش محدود قبلی فقط ۱ بار regen می‌کرد و اگر باز تکراری بود بی‌صدا ادامه می‌داد */
    var _pTry = 0;
    while (items.some(function (x) { return x && x.cd === cd; }) && _pTry < 5) { cd = prodAutoCode(); _pTry++; }
    if (items.some(function (x) { return x && x.cd === cd; })) {
      alert('⛔ کد کالای تولیدی ' + cd + ' تکراری است — لطفاً صفحه را رفرش کنید و دوباره تلاش کنید.');
      try { audit('سیستم', '⛔ جلوگیری از ثبت کالا با کد تکراری ' + cd + ' (BUG-CODE-DUP-002)', cd); } catch (eA2) {}
      return;
    }
  }
  var rec = {cd:cd, nm:nm,
    en: document.getElementById('nPEn').value.trim(),
    ca: document.getElementById('nPCa').value,
    st: document.getElementById('nPSt').value.trim(),
    br: document.getElementById('nPBr').value.trim(),
    md: (document.getElementById('nPMd')||{value:''}).value.trim(), /* v15.9 US-389: مدل */
    un: document.getElementById('nPUn').value,
    pr: +document.getElementById('nPPr').value || 0,
    prCur: (document.getElementById('nPPrCur')||{value:'IRR'}).value || 'IRR', /* v15.6 US-387 */
    ds: document.getElementById('nPDs').value.trim(),
    ts: new Date().toISOString()};
  // US-174: جلوگیری از ثبت کالای تکراری (شرح / نام انگلیسی)
  if (typeof ptfDupBlock === 'function' && ptfDupBlock('product', rec, isEdit ? cd : null)) return;
  rec.ca = (typeof ptfNormCat === 'function') ? ptfNormCat(rec.ca) : rec.ca; /* v15.9: دسته همیشه فارسی استاندارد */
  if (isEdit) {
    for (var i=0;i<items.length;i++) if (items[i].cd===cd) { rec.ts0=items[i].ts0||items[i].ts; rec.crAt=items[i].crAt; rec.crBy=items[i].crBy; rec.tp=items[i].tp; rec.srcInq=items[i].srcInq; rec.hidden=items[i].hidden; rec.prCur=rec.prCur||items[i].prCur; rec.refPriceAt=items[i].refPriceAt; rec.refPriceSrc=items[i].refPriceSrc; items[i]=rec; }
  } else { rec.ts0=rec.ts; if (typeof dedupStamp === 'function') dedupStamp(rec); items.push(rec); }
  setData('ptf_crm_products', items);
  hideModal(); renderProducts();
  addLog('کالا '+cd+(isEdit?' ویرایش':' ثبت')+' شد');
}

function exportProdCsv() {
  var items = getData('ptf_crm_products');
  if (!items.length) { alert('کالایی برای خروجی وجود ندارد'); return; }
  var rows = [['کد','نام فارسی','نام انگلیسی','دسته','استاندارد/گرید','برند','مدل','واحد','قیمت مرجع','توضیحات']];
  for (var i=0;i<items.length;i++){ var p=items[i];
    rows.push([p.cd,p.nm,p.en||'',p.ca||'',p.st||'',p.br||'',p.md||'',p.un||'',p.pr||'',(p.ds||'').replace(/\n/g,' ')]); } /* v15.9: مدل */
  var csv = '\uFEFF' + rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'ptf-products-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function importProdCsv(inp) {
  var f = inp.files[0]; if (!f) return;
  var isXlsx = /\.xlsx?$/i.test(f.name);
  // US-124 AC1: برچسب شماره درخواست (اختیاری)
  var inqNo = prompt('این کالاها مربوط به کدام درخواست است؟\n(شماره Inquiry را وارد کنید؛ اگر مربوط به درخواست خاصی نیست خالی بگذارید)', '');
  inqNo = (inqNo || '').trim();
  var done = function(rows) { // rows = آرایه آرایه‌ها شامل هدر
    if (!rows || rows.length < 2) { alert('فایل خالی یا نامعتبر است'); return; }
    var head = rows[0].map(function(h){ return String(h||'').toLowerCase(); });
    var find = function(cands){ for (var i=0;i<head.length;i++) for (var j=0;j<cands.length;j++) if (head[i].indexOf(cands[j])>-1) return i; return -1; };
    var m = { cd:find(['کد','code']), nm:find(['نام کالا','نام','name']), en:find(['انگلیسی','english','en']),
      ca:find(['دسته','category','cat']), st:find(['استاندارد','گرید','standard','grade']), br:find(['برند','brand']),
      un:find(['واحد','unit']), pr:find(['قیمت','price']), ds:find(['توضیح','desc']) };
    if (m.cd < 0) m.cd = 0;
    if (m.nm < 0) m.nm = 1;
    var items = getData('ptf_crm_products');
    var added=0, skipped=0;
    for (var i=1;i<rows.length;i++){
      var c = rows[i];
      var g = function(k){ return m[k]>-1 && c[m[k]]!=null ? String(c[m[k]]).trim() : ''; };
      var cdRaw = g('cd');
      var nmRaw = g('nm') || cdRaw;
      var cd = cdRaw.toUpperCase();
      // Sprint 112 / US-116: اگر کد معتبر نبود یا عدد ساده اکسلی (۱، ۲، ۳) بود، کد مینیمال یکتا بساز
      if (!cd || !/^[A-Z0-9_-]{3,30}$/.test(cd) || /^\d{1,3}$/.test(cd)) {
        cd = window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1000 + items.length + 1);
      }
      var dup=false; for (var j=0;j<items.length;j++) if (items[j].cd===cd) dup=true;
      if (dup) { cd = (window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1000 + items.length + Math.floor(Math.random()*900))); }
      var qty = 1, un = g('un')||'عدد';
      var qi = find(['تعداد','qty','quantity','مقدار']);
      if (qi > -1 && c[qi] != null) qty = +String(c[qi]).replace(/[^\d.]/g,'') || 1;
      items.push({cd:cd,nm:g('nm')||cd,en:g('en'),ca:g('ca')||'سایر',st:g('st'),br:g('br'),un:un,
        pr:+String(g('pr')).replace(/[^\d.]/g,'')||0,ds:g('ds'),inqNo:inqNo||'',
        ts:new Date().toISOString(),ts0:new Date().toISOString()});
      if (inqNo) {
        var iq = getData('ptf_crm_inqitems');
        iq.push({inqNo:inqNo, cd:cd, nm:g('nm')||cd, en:g('en'), qty:qty, un:un, st:g('st'), t:new Date().toLocaleDateString('fa-IR')});
        setData('ptf_crm_inqitems', iq);
      }
      added++;
    }
    setData('ptf_crm_products', items);
    renderProducts();
    alert('✅ '+added+' کالا اضافه شد'+(inqNo?' و به درخواست '+inqNo+' متصل شد':'')+(skipped?' | '+skipped+' ردیف رد شد':''));
    addLog('ایمپورت '+(isXlsx?'Excel':'CSV')+' کالا: '+added+' ردیف'+(inqNo?' (درخواست '+inqNo+')':''));
  };
  var rd = new FileReader();
  if (isXlsx && typeof XLSX !== 'undefined') {
    rd.onload = function(){
      try {
        var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
        done(rows);
      } catch(e) { alert('خطا در خواندن فایل اکسل: '+e.message); }
    };
    rd.readAsArrayBuffer(f);
  } else {
    rd.onload = function(){
      var lines = rd.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(l){return l.trim()});
      var rows = lines.map(function(l){ return (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(function(x){return x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"')}); });
      done(rows);
    };
    rd.readAsText(f,'utf-8');
  }
  inp.value='';
}

// v101.2: تست واقعی AI بدون cache + نمایش تشخیصی امن transport
function ptfLlmTransportHtml(t) {
  if (!t || typeof t !== 'object') return '';
  var rows = [];
  if (t.host) rows.push('میزبان: <b dir="ltr">' + escP(t.host) + '</b>');
  if (t.curl_errno != null) rows.push('cURL errno: <b dir="ltr">' + escP(String(t.curl_errno)) + '</b>');
  if (t.curl_error) rows.push('cURL error: <span dir="ltr">' + escP(t.curl_error) + '</span>');
  if (t.ip_mode) rows.push('IP mode: <b dir="ltr">' + escP(t.ip_mode) + '</b>');
  if (t.namelookup_ms != null || t.connect_ms != null || t.total_ms != null) rows.push('زمان‌ها: DNS ' + escP(String(t.namelookup_ms || 0)) + 'ms | Connect ' + escP(String(t.connect_ms || 0)) + 'ms | Total ' + escP(String(t.total_ms || 0)) + 'ms');
  if (t.ssl_verify_result != null) rows.push('TLS verify result: <b dir="ltr">' + escP(String(t.ssl_verify_result)) + '</b>');
  if (!rows.length) return '';
  return '<div style="background:#f8fafc;border:1px solid #cbd5e1;border-radius:7px;padding:7px;margin-top:7px;font-size:10.5px;line-height:1.8;color:#475569"><b>جزئیات امن ارتباط هاست</b><br>' + rows.join('<br>') + '</div>';
}
function ptfLlmRealTest() {
  var res = document.getElementById('llmTestRes');
  if (!res) return;
  res.innerHTML = '<span style="color:#0e7490">⏳ در حال فراخوانی واقعی سرویس AI بدون استفاده از cache... (حداکثر ۴۵ ثانیه)</span>';
  fetch('../api/llm.php?action=test&_t=' + Date.now(), { method: 'POST', headers: ptfApiAuthHeaders(true), body: '{}' })
    .then(function(r){ return r.text().then(function(t) { try { return JSON.parse(t); } catch (e) { return { ok:false, error:'پاسخ API ساختار JSON معتبر ندارد', raw:t.slice(0,500), diag:'خروجی debug یا خطای PHP پیش از JSON رخ داده است؛ متن خام پایین نمایش داده می‌شود.' }; } }); })

function hideModal() {
  /* v16.2 (BUG-017): فقط آخرین مودال «قابل‌مشاهده» بسته شود —
     پنجره‌های مینیمایزشده (display:none در body — modalx) هرگز قربانی نشوند */
  var modals = document.querySelectorAll('.md-b');
  for (var i = modals.length - 1; i >= 0; i--) {
    if ((modals[i].style || {}).display !== 'none') { modals[i].remove(); return; }
  }
}

// ===== SAVE HANDLERS =====
function saveRfq() {
  var comp = document.getElementById('nRComp').value.trim();
  if (!comp) { (window.ptfDlgAlert || alert)('نام شرکت را وارد کنید', { icon: '⚠️', title: 'اعتبارسنجی فرم' }); return; } /* v16.4 US-372 */
  var cat = document.getElementById('nRCat').value;
  var con = document.getElementById('nRCon').value.trim();
  var rfqs = getData('ptf_crm_rfqs');
  
  var dup = rfqs.filter(function(r) {
    return r.co && r.co.trim() === comp && (r.ca === cat || (r.con && r.con.trim() === con));
  })[0];
  if (dup) {
    if (!confirm('⛔ هشدار ضدتکرار استعلام:\n\nاز شرکت «' + comp + '» در حوزه «' + (dup.ca||'-') + '» قبلاً استعلام شماره ' + dup.cd + ' در تاریخ ' + (dup.dt||'—') + ' ثبت شده است.\n\nآیا اطمینان دارید که این یک درخواست کاملاً جدید و مستقل است (نه تکراری)؟')) {
      return;
    }
  }

  var cd = genCode('RFQ');
  if (/^TMP-RFQ-/.test(String(cd || ''))) { alert('⛔ شماره رسمی درخواست از سرور دریافت نشده است. اتصال/ورود را برقرار کنید و دوباره تلاش کنید.'); return; }
  /* v31.7.20 BUG-CODE-DUP-002 (گزارش کارفرما): اگر کد تولیدی قبلاً وجود دارد (pool کهنه/counter عقب)،
     تا ۵ بار کد بعدی گرفته می‌شود؛ در نهایت اگر باز تکراری بود ثبت مسدود می‌شود — نه ادغام بی‌صدا. */
  var _dupTry = 0;
  while (rfqs.some(function (r) { return r && r.cd === cd; }) && _dupTry < 5) { cd = genCode('RFQ'); _dupTry++; }
  if (rfqs.some(function (r) { return r && r.cd === cd; })) {
    alert('⛔ کد تولیدی ' + cd + ' تکراری است — شمارنده سرور نیاز به همگام‌سازی دارد. لطفاً یک‌بار صفحه را رفرش کنید و دوباره تلاش کنید.');
    try { audit('سیستم', '⛔ جلوگیری از ثبت درخواست با کد تکراری ' + cd + ' (BUG-CODE-DUP-002)', cd); } catch (eA) {}
    return;
  }
  var recSimple = {cd:cd, co:comp, con:con, ca:cat, st:'st1', stxt:'🔴 دریافت اولیه', dt:new Date().toLocaleDateString('fa-IR')};
  if (typeof dedupStamp === 'function') dedupStamp(recSimple); /* v21.5 US-411ف1 */
  rfqs.unshift(recSimple);
  setData('ptf_crm_rfqs', rfqs);
  hideModal();
  renderRfq();
  addLog('استعلام ' + cd + ' ثبت شد');
  /* US-303 (مصوب تیم متخصصان): بلافاصله ویرایشگر اقلام باز شود — ورود دستی/اکسل/دستیار
     تا «بارگذاری از درخواست» در TO/CO/TC واقعا کارا باشد */
  if (typeof ptfOpenFullInqEditor === 'function') {
    setTimeout(function () { ptfOpenFullInqEditor(cd); }, 250);
  }
}

function saveRfqStatus() {

  var rfqs = getData('ptf_crm_rfqs');

}

  if (!comp) { (window.ptfDlgAlert || alert)('نام شرکت را وارد کنید', { icon: '⚠️', title: 'اعتبارسنجی فرم' }); return; } /* v16.4 US-372 */
  var items = getData('ptf_crm_suppliers');
  var recS = {cd:genCode('SUP'), co:comp, nm:document.getElementById('nSNm').value,
    ph:document.getElementById('nSPh').value, ca:document.getElementById('nSCat').value};
  if (typeof ptfDupBlock === 'function' && ptfDupBlock('supplier', recS, null)) return; // US-174
  if (typeof dedupStamp === 'function') dedupStamp(recS);
  items.unshift(recS);
  setData('ptf_crm_suppliers', items);
  hideModal();
  renderSuppliers();
  addLog('تامین‌کننده ' + comp + ' ثبت شد');
}

function saveCust() {
  var comp = document.getElementById('nCComp').value.trim();
  if (!comp) { (window.ptfDlgAlert || alert)('نام شرکت را وارد کنید', { icon: '⚠️', title: 'اعتبارسنجی فرم' }); return; } /* v16.4 US-372 */
  var items = getData('ptf_crm_customers');
  var recC = {cd:genCode('CUST'), co:comp, ind:document.getElementById('nCInd').value,

  items.unshift(recC);
  setData('ptf_crm_customers', items);
  hideModal();
  renderCustomers();
  addLog('کارفرما ' + comp + ' ثبت شد');

function saveOrder() {
  var cd = document.getElementById('oSel').value;
  var buy = parseInt(document.getElementById('oBuy').value) || 0;
  var sell = parseInt(document.getElementById('oSell').value) || 0;
  if (!cd || !buy || !sell) { alert('مقادیر را کامل کنید'); return; }
  var prices = JSON.parse(localStorage.getItem('ptf_crm_order_prices') || '{}');
  prices[cd] = {buy:buy, sell:sell};
  localStorage.setItem('ptf_crm_order_prices', JSON.stringify(prices));
  hideModal();
  renderOrders();
  addLog('قیمت ' + cd + ' ثبت شد. سود: ' + (sell-buy).toLocaleString());
  alert('✅ سود ناخالص: ' + (sell-buy).toLocaleString() + ' ریال');
}

function saveFin() {
  var orderCode = document.getElementById('fSel').value;
  var sell = parseInt(document.getElementById('fSell').value) || 0;
  var buy = parseInt(document.getElementById('fBuy').value) || 0;
  var payStatus = document.getElementById('fPay').value;
  if (!orderCode || !sell || !buy) { alert('مقادیر را کامل کنید'); return; }
  var invs = JSON.parse(localStorage.getItem('ptf_crm_finance') || '[]');
  invs.unshift({code:genCode('FIN'), orderCode:orderCode, ref:'FIN-'+Date.now(), sell: sell, buy:buy, payStatus:payStatus,
    date:new Date().toLocaleDateString('fa-IR')});
  localStorage.setItem('ptf_crm_finance', JSON.stringify(invs));
  hideModal();
  renderFinance();
  addLog('فاکتور ثبت شد. سود: ' + (sell-buy).toLocaleString());
}

function saveUser() {
  var nm = document.getElementById('nUNm').value.trim();
  var u = document.getElementById('nULg').value.trim().toLowerCase();
  var p = document.getElementById('nUPw').value.trim();
  var rl = document.getElementById('nURl').value;
  if (!nm || !u || !p) { alert('فیلدها را پر کنید'); return; }
  if (u === 'admin') { alert('admin رزرو است'); return; }
  if (p.length < 6) { alert('رمز حداقل ۶ کاراکتر'); return; }
  var users = getData('ptf_crm_users');
  for (var i = 0; i < users.length; i++) {
    if (users[i].username === u) { alert('نام کاربری تکراری'); return; }
  }
  sha256Hex(p).then(function(ph) {
  users.push({username:u, passhash:ph, name:nm, role:rl});
  setData('ptf_crm_users', users);
  hideModal();
  renderUsers();
  addLog('کاربر ' + nm + ' تعریف شد');
  alert('✅ کاربر ' + nm + ' با دسترسی ' + rl + ' تعریف شد');
  });
}

// ===== LOAD ALL =====
/* v16.9 (BUG-021): رندر اول داشبورد قبل از اتصال hook های ویجت (نوار ارز/روز من/لانچر/قیف) خام می‌ماند.
   ناظر سبک: تا اتصال کامل زنجیره، داشبورد را (فقط اگر پنل فعال dash است و کاربر تعامل نکرده) یک‌بار تازه می‌کند. */
window._ptfDashUserTouched = false;
document.addEventListener('pointerdown', function () { window._ptfDashUserTouched = true; }, { once: true, capture: true });
function ptfDashHooksReady() {
  return !!(window._lchHooked && window._insDashHooked && window._fxDashHooked && window._mydayHooked);
}
function ptfDashEnsureFull() {
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    var done = ptfDashHooksReady();
    if (done || tries > 25) {
      clearInterval(iv);
      try {
        /* فقط پنل فعال داشبورد + بدون تعامل کاربر + واقعا ویجتی کم است */
        var actBtn = document.querySelector('.sb-i.act');
        var onDash = actBtn && (actBtn.getAttribute('onclick') || '').indexOf("'dash'") > -1;
        var missing = !document.getElementById('fxTicker') || !document.getElementById('mydayBox') || !document.getElementById('lchGrid');
        if (onDash && missing && !window._ptfDashUserTouched) {
          goPanel('dash', actBtn);
        }
      } catch (e) {}
    }
  }, 200);
}
function loadAll() {
  goPanel('dash', document.querySelector('.sb-i'));
  ptfDashEnsureFull();
  // Load settings
  var s = JSON.parse(localStorage.getItem('ptf_crm_settings') || '{}');
  if (s.email) { var el = document.getElementById('sEmail'); if (el) el.value = s.email; }
  if (s.sms) { var el2 = document.getElementById('sSms'); if (el2) el2.value = s.sms; }
  addLog('به سامانه خوش آمدید');
}
