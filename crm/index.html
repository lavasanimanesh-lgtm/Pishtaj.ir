function saveCust() {
  var comp = document.getElementById('nCComp').value.trim();
  if (!comp) { (window.ptfDlgAlert || alert)('نام شرکت را وارد کنید', { icon: '⚠️', title: 'اعتبارسنجی فرم' }); return; } /* v16.4 US-372 */
  var items = getData('ptf_crm_customers');
  var recC = {cd:(typeof window.ptfAllocCustCode === 'function' ? window.ptfAllocCustCode(items) : genCode('CUST')), co:comp, coEn:(document.getElementById('nCEn')||{}).value || '', ind:document.getElementById('nCInd').value,
    con:document.getElementById('nCCon').value, ph:document.getElementById('nCPh').value};
  /* v34.9.2 (RCA برخورد کد CUST): اگر کدِ تولیدشده محلاً تکراری بود، رکورد کاربر دیگر
     آپدیت نمی‌شود؛ کد یکتای پسونددار گرفته می‌شود و سرور با expectCreate برخورد را رد می‌کند.
     v34.37.0 (CODE-RETIRED): ptfAllocCustCode کدهای بازنشسته (دارای سنگ‌قبر) را هم رد
     می‌کند — بدون آن، مشتریِ تازه با کدِ بازیافت‌شده در اولین سینک پاک می‌شد. این گارد
     به‌عنوان لایهٔ دوم می‌ماند (اگر ماژول پیشنهادها هنوز بارگذاری نشده باشد). */
  if (items.some(function (x) { return x && x.cd === recC.cd; })) {
    recC.cd = recC.cd + '-' + Date.now().toString(36);
  }
  if (typeof ptfDupBlock === 'function' && ptfDupBlock('customer', recC, null)) return; // US-174
  if (typeof dedupStamp === 'function') dedupStamp(recC);
  items.unshift(recC);
  /* v34.8.32 (W1): ثبت مشتری با فرمان اتمیک سروری؛ legacy فقط وقتی فرمان خاموش است. */
  if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_customers', items, { reason: 'saveCust' });
  else setData('ptf_crm_customers', items);
  hideModal();
  renderCustomers();
  addLog('کارفرما ' + comp + ' ثبت شد');
}

function saveOrder() {
  var cd = document.getElementById('oSel').value;
  var buy = parseInt(document.getElementById('oBuy').value) || 0;
  var sell = parseInt(document.getElementById('oSell').value) || 0;
  if (!cd || !buy || !sell) { alert('مقادیر را کامل کنید'); return; }
  var prices = JSON.parse(localStorage.getItem('ptf_crm_order_prices') || '{}');
  prices[cd] = {buy:buy, sell:sell};
  localStorage.setItem('ptf_crm_order_prices', JSON.stringify(prices));
  hideModal();
  renderOrders();
  addLog('قیمت ' + cd + ' ثبت شد. سود: ' + (sell-buy).toLocaleString());
  alert('✅ سود ناخالص: ' + (sell-buy).toLocaleString() + ' ریال');
}

function saveFin() {
  var orderCode = document.getElementById('fSel').value;

  var payStatus = document.getElementById('fPay').value;

  addLog('فاکتور ثبت شد. سود: ' + (sell-buy).toLocaleString());

function saveUser() {
  var nm = document.getElementById('nUNm').value.trim();
  var u = document.getElementById('nULg').value.trim().toLowerCase();
  var p = document.getElementById('nUPw').value.trim();
  var rl = document.getElementById('nURl').value;
  if (!nm || !u || !p) { alert('فیلدها را پر کنید'); return; }
  if (u === 'admin') { alert('admin رزرو است'); return; }
  if (p.length < 6) { alert('رمز حداقل ۶ کاراکتر'); return; }
  var users = getData('ptf_crm_users');
  for (var i = 0; i < users.length; i++) {
    if (users[i].username === u) { alert('نام کاربری تکراری'); return; }
  }
  sha256Hex(p).then(function(ph) {
  users.push({username:u, passhash:ph, name:nm, role:rl});
  if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_users', users, { reason: 'w4' }); else setData('ptf_crm_users', users);
  hideModal();
  renderUsers();
  addLog('کاربر ' + nm + ' تعریف شد');
  alert('✅ کاربر ' + nm + ' با دسترسی ' + rl + ' تعریف شد');
  });
}

// ===== LOAD ALL =====
/* v16.9 (BUG-021): رندر اول داشبورد قبل از اتصال hook های ویجت (نوار ارز/روز من/لانچر/قیف) خام می‌ماند.
   ناظر سبک: تا اتصال کامل زنجیره، داشبورد را (فقط اگر پنل فعال dash است و کاربر تعامل نکرده) یک‌بار تازه می‌کند. */
window._ptfDashUserTouched = false;
document.addEventListener('pointerdown', function () { window._ptfDashUserTouched = true; }, { once: true, capture: true });
function ptfDashHooksReady() {
  return !!(window._lchHooked && window._insDashHooked && window._fxDashHooked && window._mydayHooked);
}
function ptfDashEnsureFull() {
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    var done = ptfDashHooksReady();
    if (done || tries > 25) {
      clearInterval(iv);
      try {
        /* فقط پنل فعال داشبورد + بدون تعامل کاربر + واقعا ویجتی کم است */
        var actBtn = document.querySelector('.sb-i.act');
        var onDash = actBtn && (actBtn.getAttribute('onclick') || '').indexOf("'dash'") > -1;
        var missing = !document.getElementById('fxTicker') || !document.getElementById('mydayBox') || !document.getElementById('lchGrid');
        if (onDash && missing && !window._ptfDashUserTouched) {
          goPanel('dash', actBtn);
        }
      } catch (e) {}
    }
  }, 200);
}
function loadAll() {
  /* مقصد deep-link پس از کامل‌شدن moduleها باز می‌شود؛ تا آن زمان dashboard امن
     رندر می‌شود، اما hash اولیه نباید با pushState به #dash بازنویسی شود. */
  var keepInitialHash = !!(window.ptfInitialHashPanel && window.ptfInitialHashPanel !== 'dash');
  if (keepInitialHash) _ptfNavFromPop = true;
  goPanel('dash', document.querySelector('.sb-i'));
  if (keepInitialHash) _ptfNavFromPop = false;
  ptfDashEnsureFull();
  // Load settings
  var s = JSON.parse(localStorage.getItem('ptf_crm_settings') || '{}');
  if (s.email) { var el = document.getElementById('sEmail'); if (el) el.value = s.email; }
  if (s.sms) { var el2 = document.getElementById('sSms'); if (el2) el2.value = s.sms; }
