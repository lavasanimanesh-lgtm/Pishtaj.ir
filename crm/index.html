<script>

function ptfSafeReset() {
  try { if (typeof ptfAuthClear === 'function') ptfAuthClear(); } catch (eAc3) {}
  localStorage.removeItem('ptf_crm_session');
  /* v34.7.93 (AUTH-TOKEN-REQUIRED): «رفع مشکل ورود» باید نشست و توکن را همزمان پاک کند.
     پیش‌تر فقط session حذف می‌شد و توکن کهنه/نامعتبر در localStorage می‌ماند و ورود مجدد
     را گمراه می‌کرد. داده‌های CRM هرگز حذف نمی‌شوند. */
  localStorage.removeItem('ptf_crm_token');
  localStorage.removeItem('ptf_crm_token_role');
  localStorage.removeItem('ptf_login_lock');
  localStorage.removeItem('ptf_nav_open');
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
  if (window.caches && caches.keys) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
  setTimeout(function(){ location.href = '?fresh=' + Date.now(); }, 800);
}

<script>
// ===== LOGIN - کاملاً مجزا و ساده =====
const ADMIN_USER = 'admin';
/* SEC-03 (v34.1): ADMIN_HASH از سورس کلاینت حذف شد — احراز هویت ادمین فقط سمت سرور */
const ADMIN_NAME = 'مدیر ارشد سیستم';
const ADMIN_ROLE = 'مدیریت کل سیستم (Admin)';

async function sha256Hex(str) {
  // v78.1: در برخی مرورگرها روی HTTP غیرامن crypto.subtle وجود ندارد → پیاده‌سازی خالص JS
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* fallback پایین */ }
  }
  return sha256Fallback(str);
}
// SHA-256 خالص JS (فقط وقتی crypto.subtle در دسترس نیست — مثلاً HTTP بدون SSL)
function sha256Fallback(ascii) {
  function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), result = '';
  var words = [], asciiBitLength = 0;
  var hash = [], k = [], primeCounter = 0;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  // UTF-8 encode
  ascii = unescape(encodeURIComponent(ascii));
  ascii += '\x80';
  asciiBitLength = (ascii.length - 1) * 8;
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    var j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16);
    var oldHash = hash.slice(0);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

// US-145 AC5: قفل ورود پس از ۵ تلاش ناموفق (۶۰ ثانیه)
function loginLockState() {
  try { return JSON.parse(localStorage.getItem('ptf_login_lock') || '{}'); } catch(e) { return {}; }
}
function loginFail() {
  var s = loginLockState();
  s.fails = (s.fails || 0) + 1;
  if (s.fails >= 5) { s.until = Date.now() + 60000; s.fails = 0; }
  localStorage.setItem('ptf_login_lock', JSON.stringify(s));
  return s;
}
function ptfApiAuthHeaders(json) {
  /* v34.8.45 (R5/T4-1b): نمای واحد لایهٔ نشست (rbac.js) — توکن از sessionStorage */
  if (typeof ptfAuthHeaders === 'function') return ptfAuthHeaders(json);
  var h = json ? { 'Content-Type': 'application/json' } : {};
  try { var t = localStorage.getItem('ptf_crm_token'); if (t) h['X-CRM-Token'] = t; } catch (e) {}
  return h;
}
function ptfServerLogin(u, p) {
  return fetch('../api/crm.php?action=auth_login&_t=' + Date.now(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'username=' + encodeURIComponent(u) + '&pass' + 'word=' + encodeURIComponent(p)
  }).then(function (r) { return r.json(); }).catch(function () { return null; });
}

/* v34.8.46 (R6/T7-ب — LOGIN-2FA): اگر auth_login برای نقش مالی otp_required برگرداند،
   کد پیامکی گرفته و با auth_login_otp توکن بگیرد. لغو کاربر = خروج با error روشن. */
async function ptf2faContinue(u, resp) {
  try {
    if (!resp || !resp.otp_required) {
      if (resp && resp.ok && resp.twofa_skipped && typeof ptfToast === 'function') {
        try { ptfToast('ℹ️ ورود دومرحله‌ای برای نقش شما فعال است اما موقتاً اجرا نشد (' + resp.twofa_skipped + ') — برای ادمین ثبت شد', 'warn'); } catch (eT) {}
      }
      return resp;
    }
    var tries = 0;
    while (tries < 3) {
      var code = '';
      try { code = (window.prompt('رمز ۶ رقمی ارسال‌شده به موبایل ...' + (resp.mobile_last4 || '') + ' (اعتبار ۳ دقیقه):') || '').trim(); } catch (ePr) {}
      if (!/^\d{6}$/.test(code)) {
        if (code === '' || code === null) return { ok: false, error: 'twofa_cancelled', message: 'ورود دومرحله‌ای لغو شد' };
        tries++; continue;
      }
      var r2 = await fetch('../api/crm.php?action=auth_login_otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'username=' + encodeURIComponent(u) + '&otp_challenge=' + encodeURIComponent(resp.otp_challenge) + '&code=' + encodeURIComponent(code)
      }).then(function (r) { return r.json(); }).catch(function () { return null; });
      if (r2 && r2.ok && r2.token) return r2;
      tries++;
      if (tries < 3) { try { alert((r2 && (r2.message || r2.error)) ? ((r2.message || r2.error) + ' — دوباره تلاش کنید') : 'کد تأیید نشد — دوباره تلاش کنید'); } catch (eAl) {} }
    }
    return { ok: false, error: 'twofa_failed', message: 'کد دومرحله‌ای تأیید نشد — دوباره وارد شوید' };
  } catch (e) { return { ok: false, error: 'twofa_error', message: 'خطای ورود دومرحله‌ای' }; }
}
function ptfInvalidateSession(msg) {
  try { if (typeof window.ptfBootSplashHide === 'function') window.ptfBootSplashHide(); } catch (eSplashHide) {}

/* =====================================================================
   MOB-010 — deep-link پنل‌ها
   مقصد hash بعد از اتمام defer bundleها اعمال می‌شود؛ بنابراین #off در cold
   start نه به #dash بازنویسی می‌شود و نه پیش از تعریف buildOffers خطا می‌دهد.
   ===================================================================== */
function ptfHashPanelId(value) {
  var raw = String(value == null ? '' : value).replace(/^#/, '').trim().toLowerCase();
  return /^[a-z][a-z0-9_-]*$/.test(raw) ? raw : '';
}
function ptfDeepLinkButton(id) {
  return (typeof window.ptfFindPanelButton === 'function') ? window.ptfFindPanelButton(id) : null;
}
function ptfReplacePanelHash(id) {
  try { history.replaceState({ panel: id }, '', '#' + id); } catch (e) {}
}
function ptfDeepLinkFallback() {
  try {
    var role = (typeof window.roleDef === 'function') ? window.roleDef() : null;
    if (role && role.panels !== '*') {
      if (role.panels.indexOf('dash') > -1) return 'dash';
      if (role.panels.length) return role.panels[0];
    }
  } catch (e) {}
  return 'dash';
}
window.ptfOpenHashPanel = function (value) {
  var id = ptfHashPanelId(value);
  if (!id) return false;
  var crm = document.getElementById('crmL');
  if (!crm || crm.style.display === 'none') return false;
  var btn = ptfDeepLinkButton(id);
  /* panel ناشناخته یا بدون دسترسی → landing مجاز نقش، بدون alert گمراه‌کننده. */
  if (!btn || window.getComputedStyle(btn).display === 'none' || (typeof window.canPanel === 'function' && !window.canPanel(id) && id !== 'set')) {
    ptfReplacePanelHash(ptfDeepLinkFallback());
    return false;
  }
  _ptfNavFromPop = true;
  try { goPanel(id, btn); } catch (e) { _ptfNavFromPop = false; return false; }
  _ptfNavFromPop = false;
  /* بعضی wrapperهای پنل سفارشی history/state پایه را دور می‌زنند. */
  window.ptfActivePanel = id;
  ptfReplacePanelHash(id);
  return true;
};
function ptfApplyInitialHashPanel() {
  var id = ptfHashPanelId(window.ptfInitialHashPanel);
  window.ptfInitialHashPanel = '';
  if (id && id !== 'dash') window.ptfOpenHashPanel(id);
  else if (id === 'dash') ptfReplacePanelHash('dash');
}
/* همهٔ scriptهای defer و mobile-nav-state تا load تمام می‌شوند؛ 360ms برای wrapper
   state آخر لازم است و همان قراردادی است که queue ناوبری cold-start استفاده می‌کند. */
window.addEventListener('load', function () { setTimeout(ptfApplyInitialHashPanel, 360); }, { once: true });
window.addEventListener('hashchange', function () {
  if (window._ptfSkipNextHashChange) { window._ptfSkipNextHashChange = false; return; }
  if (document.readyState !== 'complete') return;
  setTimeout(function () { window.ptfOpenHashPanel(window.location.hash); }, 0);
});

function getData(k) {
  try {
    /* فاز B کلیدهای سنگین را از localStorage به حافظه/IndexedDB منتقل می‌کند.
       خواندن مستقیم localStorage بعد از refresh در این حالت [] برمی‌گرداند و
       پنل‌ها ظاهراً همهٔ استعلام‌ها/پرونده‌ها را ناپدید می‌کنند. بنابراین ابتدا
       projection همگام‌شده‌ای را که sync.js می‌نویسد می‌خوانیم و فقط وقتی
       mirror مقداری ندارد، همان خط legacy (ثبت‌شده در baseline نگهبان A10)
       نتیجهٔ localStorage را می‌دهد — خواندن mirror همیشه بر fallback می‌چربد. */
    var raw = localStorage.getItem(k);
    try {
      if (typeof window.ptfBRead === 'function') {
        var mirrored = window.ptfBRead(k);
        if (mirrored !== null && mirrored !== undefined && mirrored !== '') raw = mirrored;
      }
    } catch (eMirror) {}
    if (!raw || raw === 'undefined') return [];
    return JSON.parse(raw);
  } catch (e) {
    console.error('ptf_crm_corrupt_localStorage_key:', k, e);
    return [];
  }
}
window.setData = function (k, d) {
  try {
    var s = JSON.stringify(d);
    var saveResult;
    if (typeof ptfStorageSafeSetItem === 'function') saveResult = ptfStorageSafeSetItem(k, s);
    else saveResult = localStorage.setItem(k, s);
    if (window.ptfSyncNotifyDirty) {
      window.ptfSyncNotifyDirty(k);
    }
    /* Same-tab writes do not emit the browser storage event. Notify the
       active CRM view as well, so derived balances/KPIs change immediately. */
    if (saveResult !== false && typeof window.ptfScheduleDataRefresh === 'function') {
      window.ptfScheduleDataRefresh(k);
    }
    return saveResult;
  } catch (e) {
    console.error('ptf_crm_localStorage_write_error:', k, e);
    var msg = '⚠️ ذخیره تغییرات انجام نشد؛ ظرفیت حافظه محلی را بررسی کنید.';
    try {
      if (typeof ptfToast === 'function') ptfToast(msg, 'warn');
      else alert(msg);
    } catch (e2) {}
    return false;
  }
};

   ۵. در حلقه‌های batch، genCode قبل از setData فراخوانی → race condition
   ۶. هیچ اعتبارسنجی یکتایی پس از تولید وجود نداشت
   اصلاح: همه ۴۳ prefix sequential + regex سازگار با Device Tag + یکتایی تضمینی + fallback امن */
window._ptfCodeSeq = window._ptfCodeSeq || {};
window.ptfUnifiedCode = function (prefix) {
  var p = String(prefix || 'ID').toUpperCase().trim();
  // US-265 (v23.2): Device Tag — بدون تغيير
  var devTag = (function () {
    try {
      if (localStorage.getItem('ptf_crm_sync_enabled') !== '1' && !window._ptfSyncBootstrapped) return '';
      var t = localStorage.getItem('ptf_crm_device_tag');
      if (!t) { t = 'D' + Math.floor(10 + Math.random() * 89); localStorage.setItem('ptf_crm_device_tag', t); }
      return '-' + t;
    } catch (e) { return ''; }
  })();
  /* v28.8 BUG-CODE-FIX: رفع ۶ نقص بحرانی سیستم کدینگ
     ① regex سازگار با Device Tag ② همه prefixها sequential
     ③ یکتایی تضمینی ④ اسکن عمیق ساختارهای تودرتو
     ⑵ شمارنده نشست قوی‌تر ⑥ fallback امن برای prefix ناشناخته */
  function extractNum(code, pattern) {
    var s = String(code || '').replace(/-D\d+$/, '');
    // FIX v28.8: سازگاری با فرمت PTF-KIND-YEAR-NUM (offerSerial) و KIND-NUM
    var m = s.match(new RegExp('^' + pattern + '-(\\d+)$', 'i'))
         || s.match(new RegExp('^PTF-' + pattern + '-\\d+-(\\d+)$', 'i'));
    return m ? +m[1] : 0;
  }
  function deepScan(listKey, codeField, pattern, paths) {
    var max = 0;
    try {
      var raw = localStorage.getItem(listKey);
      if (!raw) return 0;
      var data = JSON.parse(raw);
      if (!Array.isArray(data) && typeof data === 'object') {
        Object.keys(data).forEach(function(k) {
          if (Array.isArray(data[k])) {
            data[k].forEach(function(x) {
              var n = extractNum(x[codeField], pattern);
              if (n > max) max = n;
            });
          }
        });
        return max;
      }
      if (Array.isArray(data)) {
        data.forEach(function(item) {
          var n = extractNum(item[codeField], pattern);
          if (n > max) max = n;
          if (paths && paths.length) {
            paths.forEach(function(path) {
              var nested = item;
              path.split('.').forEach(function(seg) { nested = nested ? nested[seg] : null; });
              if (Array.isArray(nested)) {
                nested.forEach(function(x) {
                  var n2 = extractNum(x[codeField], pattern);
                  if (n2 > max) max = n2;
                });
              }
            });
          }
        });
      }
    } catch (e) {}
    return max;
  }
  function genSeq(listKey, codeField, pattern, make, nestedPaths) {
    var max = deepScan(listKey, codeField, pattern, nestedPaths);
    var seqKey = pattern.toUpperCase();
    var candidate = Math.max(max + 1, (window._ptfCodeSeq[seqKey] || 0) + 1);
    window._ptfCodeSeq[seqKey] = candidate;
    var code = make(candidate);
    var attempts = 0;
    while (attempts < 50) {
      var exists = false;
      try {
        var raw = localStorage.getItem(listKey);
        if (raw) {
          var data = JSON.parse(raw);
          var check = function(x) {
            var cd = String(x[codeField] || '').replace(/-D\d+$/, '').toUpperCase();
            return cd === code.toUpperCase();
          };
          if (Array.isArray(data)) {
            exists = data.some(check);
            if (!exists && nestedPaths) {
              nestedPaths.forEach(function(path) {
                data.forEach(function(item) {
                  var nested = item;
                  path.split('.').forEach(function(seg) { nested = nested ? nested[seg] : null; });
                  if (Array.isArray(nested) && nested.some(check)) exists = true;
                });
              });
            }
          } else if (typeof data === 'object') {
            Object.keys(data).forEach(function(k) {
              if (Array.isArray(data[k]) && data[k].some(check)) exists = true;
            });
          }
        }
      } catch(e) {}
      if (!exists) break;
      candidate++;
      window._ptfCodeSeq[seqKey] = candidate;
      code = make(candidate);
      attempts++;
    }
    return code + devTag;
  }
  var REG = {
    'PROD':['ptf_crm_products','cd','P',function(n){return 'P-'+n}],
    'P':['ptf_crm_products','cd','P',function(n){return 'P-'+n}],
    'PRODUCT':['ptf_crm_products','cd','P',function(n){return 'P-'+n}],
    'RFQ':['ptf_crm_rfqs','cd','RFQ',function(n){return 'RFQ-'+n}],
    'TO':['ptf_crm_offers','no','TO',function(n){return typeof offerSerial==='function'?offerSerial('TO'):'PTF-TO-'+(typeof faYear==='function'?faYear():'1404')+'-'+String(n).padStart(4,'0')}],
    'CO':['ptf_crm_offers','no','CO',function(n){return typeof offerSerial==='function'?offerSerial('CO'):'PTF-CO-'+(typeof faYear==='function'?faYear():'1404')+'-'+String(n).padStart(4,'0')}],
    'TC':['ptf_crm_offers','no','TC',function(n){return typeof offerSerial==='function'?offerSerial('TC'):'PTF-TC-'+(typeof faYear==='function'?faYear():'1404')+'-'+String(n).padStart(4,'0')}],
    'CUST':['ptf_crm_customers','cd','CUST',function(n){return 'CUST-'+n}],
    'SUP':['ptf_crm_suppliers','cd','SUP',function(n){return 'SUP-'+n}],
    'IQI':['ptf_crm_inqitems','cd','IQI',function(n){return 'IQI-'+n}],
    'LEAD':['ptf_crm_leads','cd','LEAD',function(n){return 'LEAD-'+n}],
    'CHQ':['ptf_crm_cheques','cd','CHQ',function(n){return 'CHQ-'+n}],
    'REM':['ptf_crm_reminders','cd','REM',function(n){return 'REM-'+n}],
    'NTF':['ptf_crm_notifs','cd','NTF',function(n){return 'NTF-'+n}],
    'CMP':['ptf_crm_buycmp','id','CMP',function(n){return 'CMP-'+n}],
    'BQ':['ptf_crm_buyquotes','cd','BQ',function(n){return 'BQ-'+n}],
    'OPX':['ptf_crm_opex','cd','OPX',function(n){return 'OPX-'+n}],
    'PTX':['ptf_crm_petty','cd','PTX',function(n){return 'PTX-'+n}],
    'PTY':['ptf_crm_petty_tx','cd','PTY',function(n){return 'PTY-'+n}],
    'PPR':['ptf_crm_petty_periods','cd','PPR',function(n){return 'PPR-'+n}],
    'INV':['ptf_crm_invoices','cd','INV',function(n){return 'INV-'+n}],
    'PAY':['ptf_crm_payables','cd','PAY',function(n){return 'PAY-'+n}],
    'ADP':['ptf_crm_payables','cd','ADP',function(n){return 'ADP-'+n},['advance.payments']],
    'FSY':['ptf_crm_fiscal_snapshots','cd','FSY',function(n){return 'FSY-'+n}],
    'FAM':['ptf_crm_fiscal_snapshots','cd','FAM',function(n){return 'FAM-'+n}],
    'LET':['ptf_crm_letters','cd','LET',function(n){return 'LET-'+n}],
    'LTR':['ptf_crm_letters','cd','LTR',function(n){return 'LTR-'+n}],
    'DEAL':['ptf_crm_deals','cd','DEAL',function(n){return 'DEAL-'+n},['lossEvents','docs']],
    'FIN':['ptf_crm_finance','code','FIN',function(n){return 'FIN-'+n}],
    'LOS':['ptf_crm_deals','cd','LOS',function(n){return 'LOS-'+n},['lossEvents']],
    'DX':['ptf_crm_projects','cd','DX',function(n){return 'DX-'+n},['docs']],
    'PAC':['ptf_crm_projects','cd','PAC',function(n){return 'PAC-'+n},['docs']],
    'CST':['ptf_crm_buycmp','cd','CST',function(n){return 'CST-'+n},['events']],
    'SHP':['ptf_crm_projects','cd','SHP',function(n){return 'SHP-'+n},['docs']],
    'QC':['ptf_crm_projects','cd','QC',function(n){return 'QC-'+n},['docs']],
    'SHR':['ptf_crm_shareholders','cd','SHR',function(n){return 'SHR-'+n}],
    'SHT':['ptf_crm_sharetx','cd','SHT',function(n){return 'SHT-'+n}],
    'SND':['ptf_crm_smsbook','cd','SND',function(n){return 'SND-'+n}],
    'PB':['ptf_crm_smsbook','cd','PB',function(n){return 'PB-'+n}],
    'SFINV':['ptf_crm_supplier_finance','cd','SFINV',function(n){return 'SFINV-'+n}],
    'SFPAY':['ptf_crm_supplier_finance','cd','SFPAY',function(n){return 'SFPAY-'+n}],
    'SFOPEN':['ptf_crm_supplier_finance','cd','SFOPEN',function(n){return 'SFOPEN-'+n}],
    'SFADJ':['ptf_crm_supplier_finance','cd','SFADJ',function(n){return 'SFADJ-'+n}],
    'FOB':['ptf_crm_finance','cd','FOB',function(n){return 'FOB-'+n}],
    'FSCFG':['ptf_crm_finance','cd','FSCFG',function(n){return 'FSCFG-'+n}]
  };
  /* LOS/SHP/QC/PAC در دو منبع ذخیره می‌شوند — هر دو اسکن شود */
  var REG2 = {
    'LOS':['ptf_crm_projects','cd','LOS',function(n){return 'LOS-'+n},['lossEvents']],
    'SHP':['ptf_crm_projects','cd','SHP',function(n){return 'SHP-'+n},['docs']],
    'QC':['ptf_crm_projects','cd','QC',function(n){return 'QC-'+n},['docs']],
    'PAC':['ptf_crm_projects','cd','PAC',function(n){return 'PAC-'+n},['docs']]
  };
  if (REG[p]) {
    var r = REG[p];
    var result = genSeq(r[0], r[1], r[2], r[3], r[4]);
    if (REG2[p]) {
      var r2 = REG2[p];
      var max2 = deepScan(r2[0], r2[1], r2[2], r2[4]);
      var currentNum = extractNum(result.replace(/-D\d+$/, ''), r2[2]);
      if (max2 >= currentNum) {
        var seqKey2 = r2[2].toUpperCase();
        var newC = Math.max(max2 + 1, (window._ptfCodeSeq[seqKey2] || 0) + 1);
        window._ptfCodeSeq[seqKey2] = newC;
        result = r2[3](newC) + devTag;
      }
    }
    return result;
  }
  /* FALLBACK امن: هر prefix ناشناخته هم sequential از اسکن سراسری */
  var gMax = 0;
  try {
    var allKeys = ['ptf_crm_products','ptf_crm_rfqs','ptf_crm_offers','ptf_crm_customers',
      'ptf_crm_suppliers','ptf_crm_inqitems','ptf_crm_leads','ptf_crm_cheques',
      'ptf_crm_reminders','ptf_crm_notifs','ptf_crm_buycmp','ptf_crm_buyquotes',
      'ptf_crm_opex','ptf_crm_petty','ptf_crm_petty_tx','ptf_crm_petty_periods',
      'ptf_crm_invoices','ptf_crm_payables','ptf_crm_fiscal_snapshots','ptf_crm_letters',
      'ptf_crm_deals','ptf_crm_finance','ptf_crm_projects','ptf_crm_shareholders',
      'ptf_crm_sharetx','ptf_crm_smsbook','ptf_crm_supplier_finance'];
    allKeys.forEach(function(k) {
      gMax = Math.max(gMax, deepScan(k,'cd',p,null), deepScan(k,'code',p,null), deepScan(k,'no',p,null), deepScan(k,'id',p,null));
    });
  } catch(e) {}
  var seqKey = p;
  var candidate = Math.max(gMax + 1, (window._ptfCodeSeq[seqKey] || 0) + 1);
  window._ptfCodeSeq[seqKey] = candidate;
  return p + '-' + candidate + devTag;
};

// Sprint 115 / US-111: محاسبه‌گر سود خالص پروژه توسط مدیر
window.ptfCalculateNetProfit = function(prjNo) {
  var p = getData('ptf_crm_projects').filter(function(x){return x.no===prjNo;})[0];
  if (!p) return;
  /* موتور واحد سود ریالی (ptfProjectProfitIRR در fx.js): درآمد فقط مبلغ ریالی فاکتور فروش است؛
     خرید ریالی/ارزی از فاکتور تأمین‌کننده محاسبه می‌شود. وصول فروش هرگز تسعیر نمی‌شود. */
  if (typeof ptfProjectProfitIRR !== 'function') { alert('ماژول ارزی بارگذاری نشده — صفحه را رفرش کنید'); return; }
  var r = ptfProjectProfitIRR(p);
  if (!r.ok) { alert(r.warnings.join('\n') || '⚠️ داده کافی برای محاسبه سود نیست.'); return; }
  if (!r.buyIrr && !r.buyPendingFx.length && !confirm('⚠️ قیمت خرید نهایی ثبت نشده — سود بدون هزینه خرید محاسبه شود؟')) return;
  var recordedCosts = (typeof prjCostTotal === 'function') ? prjCostTotal(p) : 0;
  var extra = prompt('اگر هزینه ثبت‌نشده‌ی دیگری خارج از سیستم دارید وارد کنید؛ در غیر این صورت 0 بزنید.\n(هزینه‌های ثبت‌شده پرونده به‌صورت خودکار لحاظ می‌شوند)', '0');
  var extraCost = +String(extra||'0').replace(/[^\d۰-۹٠-٩]/g,'').replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}) || 0;
  var shipCost = recordedCosts + extraCost;
  var netProfit = r.profit - extraCost;
  var pct = r.sellIrr > 0 ? Math.round(netProfit * 100 / r.sellIrr) : 0;
  var warnHtml = r.warnings.length
    ? '<div class="ptf-f38">' + r.warnings.map(function(w){return escP(w);}).join('<br>') + '</div>'
    : '';
  var reliableTag = (r.complete && !r.buyPendingFx.length)
    ? '<span class="bd" class="ptf-style-2">✅ همه اجزا قطعی — قابل اتکا</span>'
    : '<span class="bd" class="ptf-s34">⚠️ ناقص — اجزای نامشخص در هشدارها</span>';
  var html = '<div class="md-b" class="ptf-s45" onclick="if(event.target===this)this.remove()"><div class="md" class="ptf-s52">' +
    '<h3>💰 محاسبه‌گر سود خالص پروژه (مدیریت) ' + reliableTag + '</h3>' +
    warnHtml +
    '<div class="ptf-f36">' +
    '<b>فروش ریالی واقعی:</b> ' + r.sellIrr.toLocaleString('fa-IR') + ' ریال <small class="ptf-s28">(' + escP(r.sellSrc) + ')</small><br>' +
    '<b>هزینه تأمین و خرید (ریالی‌شده):</b> ' + r.buyIrr.toLocaleString('fa-IR') + ' ریال' + (r.buyItems ? ' <small class="ptf-s28">(' + r.buyItems + ' قلم)</small>' : '') + '<br>' +
    '<b>هزینه‌های ثبت‌شده پرونده:</b> ' + recordedCosts.toLocaleString('fa-IR') + ' ریال' + (extraCost ? ' <small class="ptf-s22">+ هزینه ثبت‌نشده اعلامی: ' + extraCost.toLocaleString('fa-IR') + ' ریال</small>' : '') + '<hr class="ptf-s47">' +
    '<b class="ptf-s61">سود خالص (ریال واقعی): ' + netProfit.toLocaleString('fa-IR') + ' ریال (' + pct + '٪)</b></div>' +
    '<div class="ptf-s26">' +
    '<button class="bt bt-o" onclick="this.closest(&quot;.md-b&quot;).remove()">بستن</button>' +
    '<button class="bt" class="ptf-s35" onclick="alert(&quot;✅ سود خالص ' + pct + '٪ تایید شد&quot;);this.closest(&quot;.md-b&quot;).remove();">🏆 تأیید سود</button></div></div></div>';
  document.getElementById('panels').insertAdjacentHTML('beforeend', html);
};

window.ptfXlsGuideGo = function (btn, fid) {
  try { var mb = btn.closest('.md-b'); if (mb) mb.remove(); } catch (e) {}
  var els = document.querySelectorAll('#' + fid);
  var el = els.length ? els[els.length - 1] : null; /* آخرین نمونه = مودال/پنل فعال (هم‌راستا offEl US-364) */
  if (el) el.click();
  else alert('⚠️ فیلد انتخاب فایل یافت نشد — پنل را دوباره باز کنید و مجدد تلاش کنید.');

// استانداردسازی ایمپورت اکسل کالاها طبق دستورالعمل US-120 (ستون A=شرح، B=واحد، C=قیمت، D=دسته، E=مدل)
window.ptfStandardImportProdXls = function(inp) {
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  
  var rd = new FileReader();
  rd.onload = function(e) {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
      if (!rows || rows.length < 2) { alert('فایل اکسل خالی یا فاقد اطلاعات کالا است'); return; }
      
      var prods = getData('ptf_crm_products');
      var added = 0;
      
      for (var r=1; r<rows.length; r++) {
        var row = rows[r];
        var desc = String(row[0] || '').trim(); // ستون A = شرح کالا
        if (!desc || desc === '-' || /^\d+$/.test(desc)) continue; // نادیده گرفتن ردیف خالی یا شماره ردیف
        
        var un = String(row[1] || 'عدد').trim() || 'عدد'; // ستون B = واحد
        var pr = +String(row[2] || '0').replace(/[^\d.]/g,'') || 0; // ستون C = قیمت
        var ca = String(row[3] || 'سایر').trim() || 'سایر'; // ستون D = دسته
        var st = String(row[4] || '-').trim() || '-'; // ستون E = مشخصه
        /* v15.9 (US-389): ستون‌های اختیاری جدید — F=برند، G=مدل + دسته همیشه فارسی استاندارد */
        var br = String(row[5] || '').trim();
        var md = String(row[6] || '').trim();
        if (typeof ptfNormCat === 'function') ca = ptfNormCat(ca);
        var cd = window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1001 + prods.length);
        prods.push({ cd: cd, nm: desc, en: '', ca: ca, st: st, br: br, md: md, un: un, pr: pr, ds: 'ورود اکسل استاندارد US-120', ts: new Date().toISOString() });
        added++;
      }
      
      /* v34.8.32 (W1-iterate) */
      if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', prods, { reason: 'excel-std' });
      else setData('ptf_crm_products', prods);
      renderProducts();
      alert('✅ تعداد ' + added + ' کالا طبق دستورالعمل استاندارد US-120 با کدهای مینیمال وارد سیستم شد.');
      if (typeof audit === 'function') audit('کالاها', 'ورود اکسل استاندارد ' + added + ' کالا', '');
    } catch(err) {
      alert('❌ خطا در خواندن فایل اکسل: ' + err.message);
    }
  };
  rd.readAsArrayBuffer(f);
};

// ورود اکسل استاندارد مشتریان (CUST) طبق US-120
window.ptfStandardImportCustXls = function(inp) {
  /* v122.2 (US-280): ورود اکسل کامل مشتریان — تفکیک موبایل/ثابت، چند رابط (ردیف تکراری)، چند شماره با /، فیلدهای اختیاری آدرس/شناسه ملی/وب/وندور */
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  var rd = new FileReader();
  rd.onload = function() {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
      if (!rows || rows.length < 2) { alert('فایل خالی است یا فقط سرستون دارد'); return; }
      var custs = getData('ptf_crm_customers');
      var added = 0, merged = 0;
      var byName = {};
      custs.forEach(function(c){ byName[String(c.co||'').trim()] = c; });
      for (var r = 1; r < rows.length; r++) {
        var R = rows[r] || [];
        var co = String(R[0]||'').trim();
        if (!co) continue;
        var person = ptfXlsPerson(R[2], R[3], R[5], R[6]); // C=رابط D=موبایل F=ثابت G=سمت
        var rec = byName[co];
        if (rec) {
          // مشتری موجود → فقط رابط جدید اضافه شود
          if (person) {
            rec.people = rec.people || [];
            var dupP = rec.people.some(function(p){ return p.nm === person.nm; });
            if (!dupP) { rec.people.push(person); merged++; }
          }
          // فیلدهای خالی رکورد موجود از اکسل پر شوند (بدون بازنویسی داده موجود)
          if (!rec.ind && R[1]) rec.ind = String(R[1]).trim();
          if (!rec.coAddr && R[8]) rec.coAddr = String(R[8]).trim();
          if (!rec.natId && R[9]) rec.natId = String(R[9]).trim();
          if (!rec.coWeb && R[10]) rec.coWeb = String(R[10]).trim();
          if (!rec.venNo && R[11]) rec.venNo = String(R[11]).trim();
          if (!rec.coEn && R[12]) rec.coEn = String(R[12]).trim();
          if ((!rec.coTels || !rec.coTels.length) && R[7]) rec.coTels = [{ n: String(R[7]).trim(), ext: '', lb: 'تلفنخانه' }];
          if ((rec.venSt||'unreg') === 'unreg' && R[4]) rec.venSt = ptfXlsVenSt(R[4]);
          if (!rec.con && person) rec.con = person.nm;
          if (!rec.ph && person) rec.ph = (person.mobs[0]||person.tels[0]||{}).n || '';
        } else {
          rec = {
            cd: (typeof genCode === 'function' ? genCode('CUST') : 'CUST-' + (1001 + custs.length)),
            co: co, kind: 'حقوقی',
            ind: String(R[1]||'نفت و گاز').trim(),
            venSt: ptfXlsVenSt(R[4]),
            venNo: String(R[11]||'').trim(),
            coTels: R[7] ? [{ n: String(R[7]).trim(), ext: '', lb: 'تلفنخانه' }] : [],
            coAddr: String(R[8]||'').trim(),
            natId: String(R[9]||'').trim(),
            coWeb: String(R[10]||'').trim(),
            coEn: String(R[12]||'').trim(),
            people: person ? [person] : [],
            phones: [],
            ts: new Date().toISOString(),
            /* v34.39.45 (CUST-SORT): مهر ثبت — مشتری واردشده با اکسل هم در صدر فهرست بنشیند */
            createdAtISO: new Date().toISOString()
          };
          if (!rec.crAt) rec.crAt = rec.createdAtISO;
          if (person) { rec.con = person.nm; rec.ph = (person.mobs[0]||person.tels[0]||{}).n || ''; person.primary = true; }
          if (typeof dedupStamp === 'function') dedupStamp(rec);
          custs.unshift(rec);
          byName[co] = rec;
          added++;
        }
      }
      if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_customers', custs, { reason: 'excel-import', maxOps: 40 });
      else setData('ptf_crm_customers', custs);
      if (typeof renderCustomers === 'function') renderCustomers();
      alert('✅ ' + added + ' مشتری جدید وارد شد' + (merged ? ' و ' + merged + ' رابط به مشتریان موجود اضافه شد' : '') + ' (دستورالعمل US-280).');
    } catch(e) { alert('❌ خطا در خواندن فایل اکسل: ' + e.message); }
  };
  rd.readAsArrayBuffer(f);
};

/* v122.2: ابزارهای مشترک ورود اکسل — تفکیک موبایل/ثابت و چند شماره با / و داخلی بعد از خط تیره */
window.ptfXlsPhones = function(cell, isMob) {
  return String(cell||'').split(/[\/,،;؛|]+/).map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){
    if (isMob) return { n: x, lb: '' };
    var m = x.match(/^(.*?)[\s]*-[\s]*(\d{1,5})$/); // 02188xxxxxx-124 → شماره + داخلی
    return m && m[1].replace(/\D/g,'').length >= 5 ? { n: m[1].trim(), ext: m[2], lb: '' } : { n: x, ext: '', lb: '' };
  });
};
window.ptfXlsPerson = function(nm, mobCell, telCell, role) {
  var name = String(nm||'').trim();
  var mobs = ptfXlsPhones(mobCell, true);
  var tels = ptfXlsPhones(telCell, false);
  if (!name && !mobs.length && !tels.length) return null;
  return { nm: name || 'رابط', nmEn: '', role: String(role||'رابط اصلی').trim() || 'رابط اصلی', dept: '', tels: tels, mobs: mobs, primary: false };
};
window.ptfXlsVenSt = function(cell) {
  var v = String(cell||'').trim().toLowerCase();
  if (!v) return 'unreg';
  if (v === 'approved' || v.indexOf('تایید') > -1 || v.indexOf('تأیید') > -1) return 'approved';
  if (v === 'pending' || v.indexOf('بررسی') > -1) return 'pending';
  return 'unreg';
};

// ورود اکسل سرنخ‌ها (LEADS) طبق US-120
window.ptfStandardImportLeadsXls = function(inp) {
  /* v122.2 (US-280): ورود اکسل کامل سرنخ‌ها — تفکیک موبایل/ثابت + ایمیل/صنعت/ارزش */
  var f = inp.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') { alert('کتابخانه SheetJS بارگذاری نشده است'); return; }
  var rd = new FileReader();
  rd.onload = function() {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
      if (!rows || rows.length < 2) { alert('فایل خالی است یا فقط سرستون دارد'); return; }
      var leads = getData('ptf_crm_leads');
      var added = 0;
      for (var r = 1; r < rows.length; r++) {
        var R = rows[r] || [];
        var co = String(R[0]||'').trim();
        if (!co) continue;
        var mobs = ptfXlsPhones(R[2], true);   // C = موبایل
        var tels = ptfXlsPhones(R[5], false);  // F = ثابت
        var val = parseFloat(String(R[9]||'').replace(/[^\d.]/g,'')) || 0; // J = برآورد ارزش
        leads.push({
          cd: (typeof genCode === 'function' ? genCode('LEAD') : 'LEAD-' + (1001 + leads.length)),
          co: co,
          person: String(R[1]||'').trim(),
          mob: mobs.length ? mobs.map(function(m){return m.n;}).join(' / ') : '',
          tel: tels.length ? tels.map(function(t){return t.n + (t.ext ? ' داخلی ' + t.ext : '');}).join(' / ') : '',
          ph: (mobs[0]||tels[0]||{}).n || '',
          src: String(R[3]||'اکسل وارداتی').trim(),
          need: String(R[4]||'').trim(),
          role: String(R[6]||'').trim(),
          email: String(R[7]||'').trim(),
          ind: String(R[8]||'').trim(),
          val: val,
          stage: 'new', hist: [],
          createdISO: new Date().toISOString().slice(0,10),
          createdFa: new Date().toLocaleDateString('fa-IR')
        });
        added++;
      }
      /* v34.8.32 (W4) */
      if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_leads', leads, { reason: 'w4' });
      else setData('ptf_crm_leads', leads);
      if (typeof renderLeads === 'function') renderLeads();
      alert('✅ ' + added + ' سرنخ فروش وارد شد (دستورالعمل US-280).');
    } catch(e) { alert('❌ خطا در خواندن فایل اکسل: ' + e.message); }
  };
  rd.readAsArrayBuffer(f);
};

  rd.onload = function() {
    try {
      var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});

        } else {
          rec = {

    } catch(e) { alert('❌ خطا در خواندن فایل اکسل: ' + e.message); }

function renderSuppliers() {
  var items = getData('ptf_crm_suppliers');
  var tb = document.getElementById('sTb');
  if (!tb) return;
  /* v34.7.93 (SUP-PERF-001): ساخت رشتهٔ جدول یک‌باره و innerHTML واحد — قبلاً در هر
     ردیف innerHTML += می‌شد که هزینهٔ DOM/پارس مجدد جدول را برای انباشت تامین‌کنندگان
     به O(n^2) می‌رساند و جستجو/تب‌ها را کند می‌کرد. فیلتر جستجو هم همین‌جا انجام می‌شود. */
  var q = (((document.getElementById('sSrch') || {}).value) || '').trim().toLowerCase();
  var list = items;
  if (q) {
    list = items.filter(function (s) {
      return ((s.cd || '') + ' ' + (s.co || '') + ' ' + (s.nm || '') + ' ' + (s.ph || '') + ' ' + (s.ca || '') + ' ' + (s.origin || '')).toLowerCase().indexOf(q) > -1;
    });
  }
  var h = '';
  for (var i = 0; i < list.length; i++) {
    var s = list[i];
    h += '<tr><td><strong>' + escP(s.cd) + '</strong></td><td>' + escP(s.co) + '</td>' +
      '<td>' + escP(s.nm || '-') + '</td><td class="ptf-style-5">' + escP(s.ph || '-') + '</td>' +
      '<td>' + escP(s.ca || '-') + '</td></tr>';
  }
  tb.innerHTML = h || '<tr><td colspan="5" class="ptf-s12">' + (q ? 'تامین‌کننده‌ای با این جستجو یافت نشد' : 'تامین‌کننده‌ای ثبت نشده') + '</td></tr>';
  if (document.getElementById('dSup')) document.getElementById('dSup').textContent = items.length;
}

/* v34.8.34 (T3-1 عملیاتی + فیکس نمایش): خواندن سرور-محور با گاردهای مطمئن —

   • حداکثر ۲ retry؛ شکست پیاپی = بقیهٔ نشست محلی
   • فیلتر دسته محلی روی ردیف‌های سروری (سرور eq ندارد)
   • کلید بازگشت فوری: ptfProdServerToggle(false) */
var prodServerPage = { rows: null, page: 1, totalPages: 1, total: 0, loading: false, fails: 0 };
window.ptfProdServerToggle = function (on) {
  try {
    var st = getData('ptf_crm_settings') || {};
    if (Array.isArray(st)) st = {};
    st.prodServerRead = !!on;
    setData('ptf_crm_settings', st);
  } catch (e) {}
  prodServerPage.rows = null; prodServerPage.fails = 0; prodServerReadOn._offOnce = false;
  renderProducts();
};
function prodServerReadOn() {
  if (prodServerReadOn._offOnce) return false;
  try {
    var st = getData('ptf_crm_settings') || {};
    return !Array.isArray(st) && st.prodServerRead !== false && typeof window.ptfCollectionQuery === 'function';
  } catch (e) { return false; }
}
window.ptfProdServerGoto = function (pg) { prodServerPage.page = Math.max(1, Math.min(prodServerPage.totalPages || 1, pg | 0)); prodServerPage.rows = null; renderProducts(); };
function prodRowHtml(p) {

function renderProductsLocal() {
  var items = getData('ptf_crm_products');
  var tb = document.getElementById('pTb');
  if (!tb) return;
  var q = (document.getElementById('pSrch')||{}).value || '';
  var fc = (document.getElementById('pFcat')||{}).value || '';
  q = q.trim().toLowerCase();
  var list = items.filter(function(p){
    var pCa = (typeof ptfNormCat === 'function') ? ptfNormCat(p.ca) : p.ca;
    if (fc && fc !== 'همه' && pCa !== fc) return false;
    if (!q) return true;
    if (typeof ptfProdSearchMatch === 'function') return ptfProdSearchMatch(p, q);
    return ((p.cd||'')+' '+(p.nm||'')+' '+(p.en||'')+' '+(p.br||'')+' '+(p.st||'')+' '+(p.md||'')).toLowerCase().indexOf(q) > -1;
  });
  list.sort(function(a,b){
    var x=a[prodSort.key]||'', y=b[prodSort.key]||'';
    if (prodSort.key==='pr'){x=+x||0;y=+y||0}
    return (x>y?1:x<y?-1:0)*prodSort.dir;
  });
  var el = document.getElementById('pCount');
  if (el) el.textContent = 'نمایش ' + list.length + ' از ' + items.length + ' کالا';

function renderProductsServer() {
  var tb = document.getElementById('pTb');
  if (!tb) return;
  var q = ((document.getElementById('pSrch')||{}).value || '').trim();
  var sort = (typeof prodSort !== 'undefined' && prodSort) ? prodSort : { key: 'cd', dir: 1 };
  if (prodServerPage.loading) { tb.innerHTML = '<tr><td colspan="9" class="ptf-style-7">⏳ در حال دریافت از سرور…</td></tr>'; return; }
  if (!prodServerPage.rows) {
    /* نبود توکن داخل DataLayer خطای no_token می‌دهد → همین‌جا fallback؛ حداکثر ۲ retry */
    if (prodServerPage.fails >= 2) {
      prodServerPage.fails = 0; prodServerReadOn._offOnce = true;
      if (typeof ptfToast === 'function') ptfToast('خواندن سروری در دسترس نیست — نمایش محلی', 'warn');
      renderProductsLocal();
      return;
    }
    prodServerPage.loading = true; prodServerPage.fails++;
    tb.innerHTML = '<tr><td colspan="9" class="ptf-style-7">⏳ در حال دریافت از سرور…</td></tr>';
    var opts = { page: prodServerPage.page, pageSize: 100, sortBy: sort.key === 'pr' ? 'pr' : (sort.key || 'cd'), sortDir: sort.dir === -1 ? 'desc' : 'asc' };
    if (q) opts.q = q;
    window.ptfCollectionQuery('ptf_crm_products', opts, function (d) {
      prodServerPage.loading = false;
      if (d && d.ok) {
        /* v34.8.34 (HOTFIX ROOT-CAUSE): سرور ممکن است هنوز این داده را نداشته باشد
           (دستگاهی که هیچ‌وقت push نکرده) → پاسخ موفق ولی rows خالی. در این حالت
           دادهٔ محلی حاکم است — رندر محلی، نه جدول خالی. */
        var localCount = (getData('ptf_crm_products') || []).length;
        if ((d.total || 0) === 0 && localCount > 0) {
          prodServerPage.fails = 0; prodServerReadOn._offOnce = true;
          renderProductsLocal();
          return;
        }
        prodServerPage.fails = 0;
        prodServerPage.rows = d.rows || [];
        prodServerPage.total = d.total || 0;
        prodServerPage.totalPages = d.pages || 1;
        renderProducts();
      } else { renderProducts(); }
    });
    return;
  }
  var list = prodServerPage.rows;
  var fc2 = ((document.getElementById('pFcat')||{}).value || '');
  if (fc2 && fc2 !== 'همه') {
    list = list.filter(function (p2) { var ca2 = (typeof ptfNormCat==='function'?ptfNormCat(p2.ca):p2.ca); return ca2 === fc2; });
  }
  var el = document.getElementById('pCount');
  if (el) el.textContent = 'نمایش ' + list.length + ' از ' + prodServerPage.total + ' کالا (صفحهٔ ' + prodServerPage.page + ' از ' + prodServerPage.totalPages + ' — سروری)';
  var h = '';
  for (var i=0;i<list.length;i++) h += prodRowHtml(list[i]);
  var nav = '';
  if (prodServerPage.totalPages > 1) {
    nav = '<tr><td colspan="9" class="ptf-s31">' +
      '<button class="bt bt-o" class="ptf-style-8" onclick="ptfProdServerGoto(' + (prodServerPage.page - 1) + ')"' + (prodServerPage.page <= 1 ? ' disabled' : '') + '>‹ قبلی</button> ' +
      ' صفحهٔ ' + prodServerPage.page + ' از ' + prodServerPage.totalPages + ' ' +
      '<button class="bt bt-o" class="ptf-style-8" onclick="ptfProdServerGoto(' + (prodServerPage.page + 1) + ')"' + (prodServerPage.page >= prodServerPage.totalPages ? ' disabled' : '') + '>بعدی ›</button></td></tr>';
  }
  tb.innerHTML = (h || '<tr><td colspan="9" class="ptf-style-7">کالایی یافت نشد</td></tr>') + nav;
}
function renderProducts() {
  if (prodServerReadOn()) { try { renderProductsServer(); return; } catch (eSrv) { prodServerReadOn._offOnce = true; } }
  renderProductsLocal();
}

window.ptfBatchDeleteProducts = function() {
  var checked = [];
  document.querySelectorAll('.p-chk:checked').forEach(function(ch) { if(ch.value) checked.push(ch.value); });
  if (!checked.length) { alert('هیچ کالایی انتخاب نشده است. لطفاً کالاها را با تیک زدن انتخاب کنید.'); return; }
  
  if (typeof window.ptfReasonedDelete === 'function') {
    window.ptfReasonedDelete('PRODUCT_BATCH', checked.length + ' کالا', 'حذف دسته‌جمعی ' + checked.length + ' کالا', function() {
      var items = getData('ptf_crm_products').filter(function(p) { return checked.indexOf(p.cd) < 0; });
      /* v34.8.32 (W1-iterate): حذف دسته‌جمعی = فرمان‌های tombstone بازیافت‌پذیر */
      if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', items, { reason: 'prod-batch-del' });
      else setData('ptf_crm_products', items);
      if (typeof audit === 'function') audit('کالاها', 'حذف دسته‌جمعی ' + checked.length + ' کالا', '');
      renderProducts();
    });
  } else {
    if (!confirm('آیا از حذف دسته‌جمعی ' + checked.length + ' کالای انتخاب‌شده اطمینان دارید؟')) return;
    var items = getData('ptf_crm_products').filter(function(p) { return checked.indexOf(p.cd) < 0; });
    if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', items, { reason: 'prod-batch-del' });
    else setData('ptf_crm_products', items);
    renderProducts();
  }
};

function saveProd(isEdit) {
  var cd = document.getElementById('nPCd').value.trim().toUpperCase();
  var nm = document.getElementById('nPNm').value.trim();
  var un = document.getElementById('nPUn').value;
  // US-143 AC3: شرح و واحد اجباری
  if (!nm) { alert('شرح کالا الزامی است'); return; }
  if (!un) { alert('واحد کالا الزامی است'); return; }
  // US-143 AC2: واحد باید هم‌زبان شرح باشد
  var nmEn = prodIsEnglish(nm);
  var unEn = PROD_UNITS_EN.indexOf(un) > -1;
  if (nmEn && !unEn) { alert('⚠️ شرح کالا انگلیسی است — واحد هم باید انگلیسی باشد (No / PCS / Set / ...)'); return; }
  if (!nmEn && unEn) { alert('⚠️ شرح کالا فارسی است — واحد هم باید فارسی باشد (عدد / شاخه / متر / ...)'); return; }
  var items = getData('ptf_crm_products');
  if (!isEdit) {
    if (!cd) cd = prodAutoCode();
    /* v31.7.20 BUG-CODE-DUP-002: تلاش محدود قبلی فقط ۱ بار regen می‌کرد و اگر باز تکراری بود بی‌صدا ادامه می‌داد */
    var _pTry = 0;
    while (items.some(function (x) { return x && x.cd === cd; }) && _pTry < 5) { cd = prodAutoCode(); _pTry++; }
    if (items.some(function (x) { return x && x.cd === cd; })) {
      alert('⛔ کد کالای تولیدی ' + cd + ' تکراری است — لطفاً صفحه را رفرش کنید و دوباره تلاش کنید.');
      try { audit('سیستم', '⛔ جلوگیری از ثبت کالا با کد تکراری ' + cd + ' (BUG-CODE-DUP-002)', cd); } catch (eA2) {}

    br: document.getElementById('nPBr').value.trim(),

  // US-174: جلوگیری از ثبت کالای تکراری (شرح / نام انگلیسی)
  if (typeof ptfDupBlock === 'function' && ptfDupBlock('product', rec, isEdit ? cd : null)) return;
  rec.ca = (typeof ptfNormCat === 'function') ? ptfNormCat(rec.ca) : rec.ca; /* v15.9: دسته همیشه فارسی استاندارد */

  if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', items, { reason: 'saveProduct' });

function importProdCsv(inp) {
  var f = inp.files[0]; if (!f) return;
  var isXlsx = /\.xlsx?$/i.test(f.name);
  // US-124 AC1: برچسب شماره درخواست (اختیاری)
  var inqNo = prompt('این کالاها مربوط به کدام درخواست است؟\n(شماره Inquiry را وارد کنید؛ اگر مربوط به درخواست خاصی نیست خالی بگذارید)', '');
  inqNo = (inqNo || '').trim();
  var done = function(rows) { // rows = آرایه آرایه‌ها شامل هدر
    if (!rows || rows.length < 2) { alert('فایل خالی یا نامعتبر است'); return; }
    var head = rows[0].map(function(h){ return String(h||'').toLowerCase(); });
    var find = function(cands){ for (var i=0;i<head.length;i++) for (var j=0;j<cands.length;j++) if (head[i].indexOf(cands[j])>-1) return i; return -1; };
    var m = { cd:find(['کد','code']), nm:find(['نام کالا','نام','name']), en:find(['انگلیسی','english','en']),
      ca:find(['دسته','category','cat']), st:find(['استاندارد','گرید','standard','grade']), br:find(['برند','brand']),
      un:find(['واحد','unit']), pr:find(['قیمت','price']), ds:find(['توضیح','desc']) };
    if (m.cd < 0) m.cd = 0;
    if (m.nm < 0) m.nm = 1;
    var items = getData('ptf_crm_products');
    var added=0, skipped=0;
    for (var i=1;i<rows.length;i++){
      var c = rows[i];
      var g = function(k){ return m[k]>-1 && c[m[k]]!=null ? String(c[m[k]]).trim() : ''; };
      var cdRaw = g('cd');
      var nmRaw = g('nm') || cdRaw;
      var cd = cdRaw.toUpperCase();
      // Sprint 112 / US-116: اگر کد معتبر نبود یا عدد ساده اکسلی (۱، ۲، ۳) بود، کد مینیمال یکتا بساز
      if (!cd || !/^[A-Z0-9_-]{3,30}$/.test(cd) || /^\d{1,3}$/.test(cd)) {
        cd = window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1000 + items.length + 1);
      }
      var dup=false; for (var j=0;j<items.length;j++) if (items[j].cd===cd) dup=true;
      if (dup) { cd = (window.ptfUnifiedCode ? window.ptfUnifiedCode('PROD') : 'P-' + (1000 + items.length + Math.floor(Math.random()*900))); }
      var qty = 1, un = g('un')||'عدد';
      var qi = find(['تعداد','qty','quantity','مقدار']);
      if (qi > -1 && c[qi] != null) qty = +String(c[qi]).replace(/[^\d.]/g,'') || 1;
      items.push({cd:cd,nm:g('nm')||cd,en:g('en'),ca:g('ca')||'سایر',st:g('st'),br:g('br'),un:un,
        pr:+String(g('pr')).replace(/[^\d.]/g,'')||0,ds:g('ds'),inqNo:inqNo||'',
        ts:new Date().toISOString(),ts0:new Date().toISOString()});
      if (inqNo) {
        var iq = getData('ptf_crm_inqitems');
        iq.push({inqNo:inqNo, cd:cd, nm:g('nm')||cd, en:g('en'), qty:qty, un:un, st:g('st'), t:new Date().toLocaleDateString('fa-IR')});
        if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_inqitems', iq, { reason: 'w2' }); else setData('ptf_crm_inqitems', iq);
      }
      added++;
    }
    /* v34.8.32 (W1-iterate) */
    if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_products', items, { reason: 'quick-import' });
    else setData('ptf_crm_products', items);
    renderProducts();
    alert('✅ '+added+' کالا اضافه شد'+(inqNo?' و به درخواست '+inqNo+' متصل شد':'')+(skipped?' | '+skipped+' ردیف رد شد':''));
    addLog('ایمپورت '+(isXlsx?'Excel':'CSV')+' کالا: '+added+' ردیف'+(inqNo?' (درخواست '+inqNo+')':''));
  };
  var rd = new FileReader();
  if (isXlsx && typeof XLSX !== 'undefined') {
    rd.onload = function(){
      try {
        var wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
        done(rows);
      } catch(e) { alert('خطا در خواندن فایل اکسل: '+e.message); }
    };
    rd.readAsArrayBuffer(f);
  } else {
    rd.onload = function(){
      var lines = rd.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(l){return l.trim()});
      var rows = lines.map(function(l){ return (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(function(x){return x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"')}); });
      done(rows);
    };
    rd.readAsText(f,'utf-8');
  }
  inp.value='';
}

/* v34.9.2: نام دوگانهٔ مشتری (فارسی + انگلیسی) برای همهٔ ماژول‌ها */
function ptfCustDualName(c) {

/* v34.38.1 (LIST-RENDER-N1): حل‌گرهای نام مشتری در هر ردیف فهرست‌ها صدا زده می‌شوند و

var _ptfCustCacheArr = null, _ptfCustCacheT = 0;
function ptfCustCacheGet() {

  if (_ptfCustCacheArr && (now - _ptfCustCacheT) < 2000) return _ptfCustCacheArr;

window.ptfCustCacheDrop = function () { _ptfCustCacheArr = null; _ptfCustCacheT = 0; };
function ptfCustEnByCd(cd) {

/* v34.18.0 (DUAL-NAME-LISTS): نام دوگانه در فهرست‌ها — فارسی بالا + انگلیسی زیر هم.
   رجیستری خریدار در پیشنهادات/پرونده‌ها به‌طور تاریخی نام انگلیسی (coEn) را در buyerCo
   ذخیره می‌کند؛ این حل‌گرها از cd (و در نبود cd از تطبیق نام) نام فارسی زندهٔ مشتری
   را برمی‌گردانند تا فهرست‌ها هم‌شکل فهرست مشتریان شوند. */
function ptfCustFaByCd(cd) {
  try {
    var c = ptfCustCacheGet().filter(function (x) { return x && x.cd === cd; })[0];
    return (c && String(c.co || c.name || '').trim()) || '';

}
function ptfCustFaByEn(en) { /* تطبیق نام انگلیسی ذخیره‌شده با coEn مشتری (نبود cd — مثل پرونده‌های فروش) */

function ptfCustNamePair(cd, storedName) { /* {fa, en} — اولویت دادهٔ زنده از cd */
  var en = String(storedName || '').trim();

  if (cd) { fa = ptfCustFaByCd(cd); var live = ptfCustEnByCd(cd); if (live) en = live; }
  if (!fa && en) fa = ptfCustFaByEn(en);
  return { fa: fa || en || '', en: en };

function ptfCustCellHtml(fa, en, cd) { /* سلول هم‌شکل فهرست مشتریان: بولد فارسی + کوچک ltr انگلیسی + cd */

/* v34.9.2 + v34.39.45 (CUST-SORT): ترتیب پیش‌فرض = جدیدترین اول.
   کلید اصلی: زمان ثبت (createdAtISO/crAt/ts) نزولی — چون از این نسخه به بعد هر مشتری
   تازه مهر ثبت می‌گیرد، مشتری جدید همیشه در صدر می‌نشیند حتی اگر کدش بازیافتی یا
   پسونددار باشد. رکوردهای بدون مهر ثبت (میراثی) با شمارهٔ کد نزولی، بعد از زمان‌دارها. */
function ptfCustTs(x) { return String(x && (x.createdAtISO || x.crAt || x.ts) || ''); }
function ptfCustSortNewest(list) {
  function key(x) { return ptfCustCdKey(x && x.cd); }
  return (list || []).map(function (x, i) { return { x: x, i: i, k: key(x), t: ptfCustTs(x) }; })
    .sort(function (a, b) {
      if (a.t && b.t) {
        if (a.t !== b.t) return a.t < b.t ? 1 : -1;
        if (a.k !== b.k) return b.k - a.k;
        return a.i - b.i;
      }
      if (a.t) return -1; /* زمان‌دارها قبل از میراثی‌ها */
      if (b.t) return 1;
      if (a.k !== b.k) return b.k - a.k;
      return a.i - b.i;
    }).map(function (o) { return o.x; });
}

/* ═══ v34.39.45 (CUST-SORT — درخواست کارفرما): سورت فهرست مشتریان با کلیک سرستون ═══
   چرخهٔ هر سرستون: کلیک اول صعودی (کد: نزولی) → کلیک دوم معکوس → کلیک سوم بازگشت
   به پیش‌فرض «جدیدترین اول». وضعیت در localStorage ماندگار است. */
window._ptfCustListSort = (function () {
  try {
    /* A10/T0-1: خواندن فقط از لایهٔ داده (getData) — مستقیم به localStorage دست نزن */
    var s = (typeof getData === 'function') ? getData('ptf_cust_list_sort') : null;
    if (s && ['newest', 'cd', 'co', 'ind', 'con'].indexOf(s.key) > -1 && (s.dir === 'asc' || s.dir === 'desc')) return s;
  } catch (e) {}
  return { key: 'newest', dir: 'desc' };
})();
function ptfCustCdKey(cd) {
  /* v34.39.45: مقاوم در برابر کدهای پسونددارِ برخورد (مثل CUST-1099-m2x9k) — فقط دو
     گروه عددی اول ملاک‌اند؛ گروه اول فقط وقتی «سال» فرض می‌شود که بازهٔ سال بدهد
     (۱۳۰۰–۱۵۰۰ شمسی / ۱۹۰۰–۲۱۰۰ میلادی) و گروه دوم هم داشته باشد. */
  var g = String(cd || '').match(/\d+/g);
  if (!g) return -1;
  var first = +g[0];
  var looksYear = g.length > 1 && ((first >= 1300 && first <= 1500) || (first >= 1900 && first <= 2100));
  if (looksYear) return first * 1e7 + (+g[1]);
  return first;
}
function ptfCustSortVal(c, key) {
  if (key === 'cd') return ptfCustCdKey(c && c.cd);
  if (key === 'co') { var fa = String(c && (c.co || c.name) || '').trim(); return (fa || String(c && c.coEn || '').trim()).toLowerCase(); }
  if (key === 'ind') return String(c && c.ind || '').trim().toLowerCase();
  if (key === 'con') {
    var pp = (typeof window.primaryPerson === 'function') ? window.primaryPerson(c) : null;
    return String((c && c.con) || (pp && pp.nm) || '').trim().toLowerCase();
  }
  return '';
}
window.ptfCustSortBy = function (list, key, dir) {
  var mul = dir === 'asc' ? 1 : -1;
  return (list || []).map(function (x, i) { return { x: x, i: i }; })
    .sort(function (a, b) {
      var va = ptfCustSortVal(a.x, key), vb = ptfCustSortVal(b.x, key);
      var c = 0;
      if (key === 'cd') c = (va - vb);
      else c = String(va).localeCompare(String(vb), 'fa');
      if (c !== 0) return c * mul;
      return a.i - b.i; /* پایدار */
    }).map(function (o) { return o.x; });
};
window.ptfCustSortClick = function (key) {
  var st = window._ptfCustListSort || { key: 'newest', dir: 'desc' };
  if (st.key !== key) { st = { key: key, dir: (key === 'cd') ? 'desc' : 'asc' }; }
  else if (st.dir === 'asc') { st = { key: key, dir: 'desc' }; }
  else { st = { key: 'newest', dir: 'desc' }; } /* کلیک سوم → پیش‌فرض جدیدترین */
  window._ptfCustListSort = st;
  /* A10/T0-1: نوشتن فقط از لایهٔ داده (setData — با سپر ظرفیت + اعلان سینک) */

};
window.ptfCustSortMarks = function () {

  Object.keys(marks).forEach(function (k) {

// v101.2: تست واقعی AI بدون cache + نمایش تشخیصی امن transport
function ptfLlmTransportHtml(t) {
  if (!t || typeof t !== 'object') return '';
  var rows = [];
  if (t.host) rows.push('میزبان: <b dir="ltr">' + escP(t.host) + '</b>');
  if (t.curl_errno != null) rows.push('cURL errno: <b dir="ltr">' + escP(String(t.curl_errno)) + '</b>');
  if (t.curl_error) rows.push('cURL error: <span dir="ltr">' + escP(t.curl_error) + '</span>');
  if (t.ip_mode) rows.push('IP mode: <b dir="ltr">' + escP(t.ip_mode) + '</b>');
  if (t.namelookup_ms != null || t.connect_ms != null || t.total_ms != null) rows.push('زمان‌ها: DNS ' + escP(String(t.namelookup_ms || 0)) + 'ms | Connect ' + escP(String(t.connect_ms || 0)) + 'ms | Total ' + escP(String(t.total_ms || 0)) + 'ms');
  if (t.ssl_verify_result != null) rows.push('TLS verify result: <b dir="ltr">' + escP(String(t.ssl_verify_result)) + '</b>');
  if (!rows.length) return '';
  return '<div class="ptf-f33"><b>جزئیات امن ارتباط هاست</b><br>' + rows.join('<br>') + '</div>';
}

function hideModal() {
  /* v16.2 (BUG-017): فقط آخرین مودال «قابل‌مشاهده» بسته شود —
     پنجره‌های مینیمایزشده (display:none در body — modalx) هرگز قربانی نشوند */
  var modals = document.querySelectorAll('.md-b');
  for (var i = modals.length - 1; i >= 0; i--) {
    if ((modals[i].style || {}).display !== 'none') { modals[i].remove(); return; }
  }
}

function saveRfq() {
  var comp = document.getElementById('nRComp').value.trim();
  if (!comp) { (window.ptfDlgAlert || alert)('نام شرکت را وارد کنید', { icon: '⚠️', title: 'اعتبارسنجی فرم' }); return; } /* v16.4 US-372 */
  var cat = document.getElementById('nRCat').value;
  var con = document.getElementById('nRCon').value.trim();
  var rfqs = getData('ptf_crm_rfqs');
  
  var dup = rfqs.filter(function(r) {
    return r.co && r.co.trim() === comp && (r.ca === cat || (r.con && r.con.trim() === con));
  })[0];
  if (dup) {
    if (!confirm('⛔ هشدار ضدتکرار استعلام:\n\nاز شرکت «' + comp + '» در حوزه «' + (dup.ca||'-') + '» قبلاً استعلام شماره ' + dup.cd + ' در تاریخ ' + (dup.dt||'—') + ' ثبت شده است.\n\nآیا اطمینان دارید که این یک درخواست کاملاً جدید و مستقل است (نه تکراری)؟')) {
      return;
    }
  }

  var cd = genCode('RFQ');
  if (/^TMP-RFQ-/.test(String(cd || ''))) { alert('⛔ شماره رسمی درخواست از سرور دریافت نشده است. اتصال/ورود را برقرار کنید و دوباره تلاش کنید.'); return; }
  /* v31.7.20 BUG-CODE-DUP-002 (گزارش کارفرما): اگر کد تولیدی قبلاً وجود دارد (pool کهنه/counter عقب)،
     تا ۵ بار کد بعدی گرفته می‌شود؛ در نهایت اگر باز تکراری بود ثبت مسدود می‌شود — نه ادغام بی‌صدا. */
  var _dupTry = 0;
  while (rfqs.some(function (r) { return r && r.cd === cd; }) && _dupTry < 5) { cd = genCode('RFQ'); _dupTry++; }
  if (rfqs.some(function (r) { return r && r.cd === cd; })) {
    alert('⛔ کد تولیدی ' + cd + ' تکراری است — شمارنده سرور نیاز به همگام‌سازی دارد. لطفاً یک‌بار صفحه را رفرش کنید و دوباره تلاش کنید.');
    try { audit('سیستم', '⛔ جلوگیری از ثبت درخواست با کد تکراری ' + cd + ' (BUG-CODE-DUP-002)', cd); } catch (eA) {}
    return;
  }
  var recSimple = {cd:cd, co:comp, con:con, ca:cat, st:'st1', stxt:'🔴 دریافت اولیه', dt:new Date().toLocaleDateString('fa-IR')};
  if (typeof dedupStamp === 'function') dedupStamp(recSimple); /* v21.5 US-411ف1 */
  rfqs.unshift(recSimple);
  if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_rfqs', rfqs, { reason: 'w2' }); else setData('ptf_crm_rfqs', rfqs);
  hideModal();
  renderRfq();
  addLog('استعلام ' + cd + ' ثبت شد');

  /* ===== v34.1 US-SMS-RFQ: اطلاع‌رسانی پیامکی به مشتری هنگام ثبت درخواست ===== */
  try {
    var _rfqCust = getData('ptf_crm_customers').filter(function (x) { return x.co && x.co.trim() === comp; })[0];
    if (_rfqCust && typeof window.ptfSmsNotifyDialog === 'function') {
      var _rfqSmsTxt = 'پیشرو تجهیز فرتاک\n' +
        'درخواست شما با شماره ' + cd + ' در تاریخ ' + recSimple.dt + ' ثبت شد.\n' +
        'کارشناسان ما در اسرع وقت بررسی و نتیجه را اعلام خواهند کرد.\n' +
        '021-46087679\npishtaj.ir';
      window.ptfSmsNotifyDialog(_rfqCust, _rfqSmsTxt, 'ثبت درخواست ' + cd);
    }
  } catch (eRfqSms) {}

  /* US-303 (مصوب تیم متخصصان): بلافاصله ویرایشگر اقلام باز شود — ورود دستی/اکسل/دستیار
     تا «بارگذاری از درخواست» در TO/CO/TC واقعا کارا باشد */
  if (typeof ptfOpenFullInqEditor === 'function') {
    setTimeout(function () { ptfOpenFullInqEditor(cd); }, 250);
  }
}

function saveCust() {
  var comp = document.getElementById('nCComp').value.trim();
  if (!comp) { (window.ptfDlgAlert || alert)('نام شرکت را وارد کنید', { icon: '⚠️', title: 'اعتبارسنجی فرم' }); return; } /* v16.4 US-372 */
  var items = getData('ptf_crm_customers');
  var recC = {cd:(typeof window.ptfAllocCustCode === 'function' ? window.ptfAllocCustCode(items) : genCode('CUST')), co:comp, coEn:(document.getElementById('nCEn')||{}).value || '', ind:document.getElementById('nCInd').value,
    con:document.getElementById('nCCon').value, ph:document.getElementById('nCPh').value};
  /* v34.9.2 (RCA برخورد کد CUST): اگر کدِ تولیدشده محلاً تکراری بود، رکورد کاربر دیگر
     آپدیت نمی‌شود؛ کد یکتای پسونددار گرفته می‌شود و سرور با expectCreate برخورد را رد می‌کند.
     v34.37.0 (CODE-RETIRED): ptfAllocCustCode کدهای بازنشسته (دارای سنگ‌قبر) را هم رد
     می‌کند — بدون آن، مشتریِ تازه با کدِ بازیافت‌شده در اولین سینک پاک می‌شد. این گارد
     به‌عنوان لایهٔ دوم می‌ماند (اگر ماژول پیشنهادها هنوز بارگذاری نشده باشد). */
  if (items.some(function (x) { return x && x.cd === recC.cd; })) {
    recC.cd = recC.cd + '-' + Date.now().toString(36);
  }
  if (typeof ptfDupBlock === 'function' && ptfDupBlock('customer', recC, null)) return; // US-174
  /* v34.39.45 (CUST-SORT): مهر ثبت مشتری تازه — مبنای سورت «جدیدترین اول» */
  recC.createdAtISO = new Date().toISOString();
  if (!recC.crAt) recC.crAt = recC.createdAtISO;
  if (typeof dedupStamp === 'function') dedupStamp(recC);
  items.unshift(recC);
  /* v34.8.32 (W1): ثبت مشتری با فرمان اتمیک سروری؛ legacy فقط وقتی فرمان خاموش است. */
  if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_customers', items, { reason: 'saveCust' });
  else setData('ptf_crm_customers', items);
  hideModal();
  renderCustomers();
  addLog('کارفرما ' + comp + ' ثبت شد');
}

function saveOrder() {
  var cd = document.getElementById('oSel').value;
  var buy = parseInt(document.getElementById('oBuy').value) || 0;
  var sell = parseInt(document.getElementById('oSell').value) || 0;
  if (!cd || !buy || !sell) { alert('مقادیر را کامل کنید'); return; }
  var prices = JSON.parse(localStorage.getItem('ptf_crm_order_prices') || '{}');
  prices[cd] = {buy:buy, sell:sell};
  localStorage.setItem('ptf_crm_order_prices', JSON.stringify(prices));
  hideModal();
  renderOrders();
  addLog('قیمت ' + cd + ' ثبت شد. سود: ' + (sell-buy).toLocaleString());
  alert('✅ سود ناخالص: ' + (sell-buy).toLocaleString() + ' ریال');
}

function saveFin() {
  var orderCode = document.getElementById('fSel').value;
  var sell = parseInt(document.getElementById('fSell').value) || 0;
  var buy = parseInt(document.getElementById('fBuy').value) || 0;
  var payStatus = document.getElementById('fPay').value;
  if (!orderCode || !sell || !buy) { alert('مقادیر را کامل کنید'); return; }

  invs.unshift({code:genCode('FIN'), orderCode:orderCode, ref:'FIN-'+Date.now(), sell: sell, buy:buy, payStatus:payStatus,
    date:new Date().toLocaleDateString('fa-IR')});
  localStorage.setItem('ptf_crm_finance', JSON.stringify(invs));
  hideModal();
  renderFinance();
  addLog('فاکتور ثبت شد. سود: ' + (sell-buy).toLocaleString());
}

function saveUser() {
  var nm = document.getElementById('nUNm').value.trim();
  var u = document.getElementById('nULg').value.trim().toLowerCase();
  var p = document.getElementById('nUPw').value.trim();
  var rl = document.getElementById('nURl').value;
  if (!nm || !u || !p) { alert('فیلدها را پر کنید'); return; }
  if (u === 'admin') { alert('admin رزرو است'); return; }
  if (p.length < 6) { alert('رمز حداقل ۶ کاراکتر'); return; }
  var users = getData('ptf_crm_users');
  for (var i = 0; i < users.length; i++) {
    if (users[i].username === u) { alert('نام کاربری تکراری'); return; }
  }
  sha256Hex(p).then(function(ph) {
  users.push({username:u, passhash:ph, name:nm, role:rl});
  if (window.ptfEntitySaveCollection) window.ptfEntitySaveCollection('ptf_crm_users', users, { reason: 'w4' }); else setData('ptf_crm_users', users);
  hideModal();
  renderUsers();
  addLog('کاربر ' + nm + ' تعریف شد');
  alert('✅ کاربر ' + nm + ' با دسترسی ' + rl + ' تعریف شد');
  });
}

// ===== LOAD ALL =====
/* v16.9 (BUG-021): رندر اول داشبورد قبل از اتصال hook های ویجت (نوار ارز/روز من/لانچر/قیف) خام می‌ماند.
   ناظر سبک: تا اتصال کامل زنجیره، داشبورد را (فقط اگر پنل فعال dash است و کاربر تعامل نکرده) یک‌بار تازه می‌کند. */
window._ptfDashUserTouched = false;
document.addEventListener('pointerdown', function () { window._ptfDashUserTouched = true; }, { once: true, capture: true });
function ptfDashHooksReady() {
  return !!(window._lchHooked && window._insDashHooked && window._fxDashHooked && window._mydayHooked);
}
function ptfDashEnsureFull() {
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    var done = ptfDashHooksReady();
    if (done || tries > 25) {
      clearInterval(iv);
      try {
        /* فقط پنل فعال داشبورد + بدون تعامل کاربر + واقعا ویجتی کم است */
        var actBtn = document.querySelector('.sb-i.act');
        var onDash = actBtn && (actBtn.getAttribute('onclick') || '').indexOf("'dash'") > -1;
        var missing = !document.getElementById('fxTicker') || !document.getElementById('mydayBox') || !document.getElementById('lchGrid');
        if (onDash && missing && !window._ptfDashUserTouched) {
          goPanel('dash', actBtn);
        }
      } catch (e) {}
    }
  }, 200);
}
function loadAll() {
  /* مقصد deep-link پس از کامل‌شدن moduleها باز می‌شود؛ تا آن زمان dashboard امن
     رندر می‌شود، اما hash اولیه نباید با pushState به #dash بازنویسی شود. */
  var keepInitialHash = !!(window.ptfInitialHashPanel && window.ptfInitialHashPanel !== 'dash');
  if (keepInitialHash) _ptfNavFromPop = true;
  goPanel('dash', document.querySelector('.sb-i'));
  if (keepInitialHash) _ptfNavFromPop = false;
  ptfDashEnsureFull();
  // Load settings
  var s = JSON.parse(localStorage.getItem('ptf_crm_settings') || '{}');
  if (s.email) { var el = document.getElementById('sEmail'); if (el) el.value = s.email; }
  if (s.sms) { var el2 = document.getElementById('sSms'); if (el2) el2.value = s.sms; }
  addLog('به سامانه خوش آمدید');
}
