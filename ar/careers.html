<section class="job-hero"><div class="container"><h1>الوظائف</h1><p>الوظائف الشاغرة. يُقدَّم الطلب من صفحة الوظيفة ثنائية اللغة (القسم الإنجليزي عبر #en). استمارة التقديم باللغة الفارسية.</p></div></section>
<main class="job-wrap">
<!--PTF_CAREERS_LIST-->
<div id="careersArList"><p>لا توجد وظائف شاغرة حالياً.</p></div>
<!--/PTF_CAREERS_LIST-->
</main>
<script>
(function(){
  var el = document.getElementById('careersArList');
  if (!el) return;
  function paint(d){
    var jobs = (d && d.jobs) || [];
    if (!jobs.length) { el.innerHTML = '<p>لا توجد وظائف شاغرة حالياً.</p>'; return; }
    el.className = 'job-grid';
    el.innerHTML = jobs.map(function(j){
      var title = j.titleEn || j.titleFa || '';
      return '<a class="job-card" href="../careers/' + String(j.slug||'').replace(/[^a-z0-9\-]/g,'') + '/#en"><h3>' + String(title).replace(/</g,'') + '</h3></a>';
    }).join('');
  }
  fetch('../api/careers.php?action=published', { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : Promise.reject(); }).then(paint).catch(function(){
    fetch('../careers/status.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(paint).catch(function(){});
  });
})();
</script>

<script>
(function(){
  var t=document.getElementById('menuToggle'),n=document.getElementById('mainNav');
  if(!t||!n)return;
  function setOpen(o){n.classList.toggle('open',o);t.setAttribute('aria-expanded',o?'true':'false');t.classList.toggle('is-x',o);}
  t.addEventListener('click',function(){setOpen(!n.classList.contains('open'));});
  Array.prototype.forEach.call(n.querySelectorAll('a'),function(a){a.addEventListener('click',function(){setOpen(false);});});
})();
</script>
