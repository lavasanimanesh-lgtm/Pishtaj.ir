# ─────────────────────────────────────────────────────────────────────────────
# Quality Gate — گیت روی push/PR به main (بازسازی php.yml، ۲۰۲۶-۰۸-۲۸)
#
# نسخهٔ قدیمی این فایل قالب Composer گیت‌هاب بود بدون اینکه composer.json در
# مخزن وجود داشته باشد → هر PR قرمز می‌شد بی‌آنکه چیزی واقعاً تست شود.
# این نسخه همان گیت کانونی پروژه را اجرا می‌کند:
#   ۱) نگهبان معماری (fail-fast)
#   ۲) سوئیت تسترهای CI (sync/مالی/اعلان/امنیت + php -l درون‌ساخت)
#   ۳) php -l روی api و crm
#   ۴) node --check روی همهٔ ماژول‌های JS سمت کلاینت
# ─────────────────────────────────────────────────────────────────────────────
name: Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  # انتشار خلاصهٔ خطا روی PR (گام «Publish gate failure summary») — گیت قرمز نباید
  # بی‌توضیح بماند؛ لاگ اکشن‌ها از بیرون قابل خواندن نیست، کامنت PR هست.
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Architecture guard
        run: node _tools/arch/arch-guard.js

      - name: CI gate
        run: |
          set -o pipefail
          node _tools/uat/run-ci-gate.js 2>&1 | tee "$RUNNER_TEMP/ci-gate.log"

      # اگر گیت قرمز شد، فهرست تسترهای شکست‌خورده + دنبالهٔ لاگ روی همان PR کامنت
      # می‌شود تا تشخیص بدون دسترسی به لاگ اکشن‌ها ممکن باشد. برای PR از فورک، توکن
      # فقط‌خواندنی است؛ continue-on-error مانع قرمز شدنِ بی‌دلیل می‌شود.
      - name: Publish gate failure summary
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          f="$RUNNER_TEMP/ci-gate.log"
          [ -f "$f" ] || { echo "گیت لاگ تولید نکرد (شکست پیش از اجرای گیت)"; exit 0; }
          {
            echo '### ❌ Quality Gate — خلاصهٔ خطا'
            echo ''
            echo '```'
            grep -nE '✘|→ FAIL|=== CI gate|^ *• ' "$f" | tail -80 || true
            echo '```'
            echo ''
            echo '<details><summary>۳۰۰ خط آخر لاگ گیت</summary>'
            echo ''
            echo '```'
            tail -300 "$f"
            echo '```'
            echo ''
            echo '</details>'
          } > "$RUNNER_TEMP/gate-summary.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/gate-summary.md"

      - name: PHP syntax lint (api + crm)
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq php-cli >/dev/null 2>&1 || true
          command -v php >/dev/null 2>&1 || { echo "::error::php-cli نصب نشد"; exit 1; }
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null 2>&1 || { echo "::error file=$f::php -l شکست خورد"; fail=1; }
          done < <(find api crm -name '*.php' -print0)
          [ "$fail" -eq 0 ] || exit 1
          echo "php -l: سالم"

      - name: JS syntax check (crm)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" >/dev/null 2>&1 || { echo "::error file=$f::node --check شکست خورد"; fail=1; }
          done < <(find crm -name '*.js' -print0)
          [ "$fail" -eq 0 ] || exit 1
          echo "node --check: سالم"

      # SEO-2026-09-19: تا امروز ۳۰۰ قاعدهٔ RewriteRule در .htaccess بدون هیچ
      # بازبینیِ خودکار نوشته می‌شد؛ یک مقصدِ ناموجود یا زنجیرهٔ ۳۰۱ یعنی
      # هدررفت اعتبار و خزش. این گام، مقصدها/زنجیره/حلقه، پوششِ سیاههٔ
      # URLهای مرده (_tools/legacy-url-inventory.json) و یکپارچگیِ لینکِ
      # داخلی را چک می‌کند و روی هر ایراد غیرصفر خارج می‌شود.
      - name: SEO redirect audit (.htaccess)
        run: python3 _tools/seo_redirect_audit.py --strict
